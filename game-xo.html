            <button class="withdraw-btn" id="withdrawBtn" onclick="openWithdraw()" disabled>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2"/>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
                <span id="withdrawText">السحب</span>
            </button>
        </div>

    </div>

    <!-- نافذة النتيجة -->
    <div class="result-overlay" id="resultOverlay">
        <div class="result-box">
            <div class="result-icon" id="resultIcon"></div>
            <div class="result-title" id="resultTitle"></div>
            <div class="result-prize" id="resultPrize"></div>
            <button class="result-btn" onclick="closeResult()">حسناً</button>
        </div>
    </div>

    <!-- نافذة السحب -->
    <div class="withdraw-modal" id="withdrawModal">
        <div class="withdraw-content" id="withdrawContent">
            <button class="modal-close" onclick="closeWithdraw()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"/>
                    <line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
            </button>

            <div class="modal-title">طلب سحب إلى Binance</div>

            <div class="frozen-balance">
                <div class="frozen-label">المبلغ المتاح للسحب</div>
                <div class="frozen-amount"><span id="binanceAmount">0.00</span> <small>USDT</small></div>
            </div>

            <form id="formBinance" onsubmit="submitWithdraw(event, 'binance')">
                <input type="hidden" name="subject" value="طلب سحب USDT - لعبة XO - بينانس" />
                <div class="form-group">
                    <label>Binance ID</label>
                    <input type="text" name="binance_id" placeholder="أدخل Binance ID" inputmode="numeric" required />
                </div>
                <input type="hidden" name="message" id="msgBinance" />
                <button type="submit" class="submit-btn" id="submitBinance">إرسال طلب السحب</button>
            </form>
        </div>
    </div>

    <script>
        /* ============================================
           🔒 المفاتيح المشفرة
        ============================================ */
        const _K1 = [115, 102, 95, 100, 98, 49, 50, 48, 102, 98, 98];
        const _K2 = [99, 101, 97, 53, 48, 48, 49, 97, 56, 54, 100, 98];
        const _K3 = [53, 99, 52, 56];
        const _EM = [109, 97, 121, 97, 114, 97, 121, 113, 64, 103, 109, 97, 105, 108, 46, 99, 111, 109];

        function _dk() {
            let s = '';
            for (let i = 0; i < _K1.length; i++) s += String.fromCharCode(_K1[i]);
            for (let i = 0; i < _K2.length; i++) s += String.fromCharCode(_K2[i]);
            for (let i = 0; i < _K3.length; i++) s += String.fromCharCode(_K3[i]);
            return s;
        }

        function _de() {
            let s = '';
            for (let i = 0; i < _EM.length; i++) s += String.fromCharCode(_EM[i]);
            return s;
        }

        /* ============================================
           الإعدادات
        ============================================ */
        const REWARD_PER_WIN = 0.0005;
        const MAX_PLAYS = 30;
        const COOLDOWN = 6 * 60 * 60 * 1000;
        const MIN_WITHDRAW = 0.0005;

        /* ============================================
           حالة اللعبة (مع الحفظ)
        ============================================ */
        let state = {
            board: ['', '', '', '', '', '', '', '', ''],
            playerTurn: true,
            gameActive: false,
            moves: 0,
            balance: parseFloat(localStorage.getItem('xoBalance') || '0'),
            wins: parseInt(localStorage.getItem('xoWins') || '0'),
            losses: parseInt(localStorage.getItem('xoLosses') || '0'),
            ties: parseInt(localStorage.getItem('xoTies') || '0'),
            playsLeft: parseInt(localStorage.getItem('xoPlaysLeft') || String(MAX_PLAYS)),
            lastReset: parseInt(localStorage.getItem('xoLastReset') || '0')
        };

        let lastWithdrawTime = parseInt(localStorage.getItem('xoLastWithdraw') || '0');
        let cooldownInterval = null;

        /* ============================================
           حفظ الحالة
        ============================================ */
        function saveState() {
            localStorage.setItem('xoBalance', state.balance);
            localStorage.setItem('xoWins', state.wins);
            localStorage.setItem('xoLosses', state.losses);
            localStorage.setItem('xoTies', state.ties);
            localStorage.setItem('xoPlaysLeft', state.playsLeft);
            localStorage.setItem('xoLastReset', state.lastReset);
        }

        /* ============================================
           العناصر
        ============================================ */
        const cells = document.querySelectorAll('.cell');
        const turnIndicator = document.getElementById('turnIndicator');
        const startBtn = document.getElementById('startBtn');
        const balanceEl = document.getElementById('balanceAmount');
        const winsEl = document.getElementById('wins');
        const lossesEl = document.getElementById('losses');
        const tiesEl = document.getElementById('ties');
        const playsLeftEl = document.getElementById('playsLeft');
        const withdrawBtn = document.getElementById('withdrawBtn');
        const withdrawText = document.getElementById('withdrawText');
        const cooldownBar = document.getElementById('cooldownBar');
        const cooldownTimer = document.getElementById('cooldownTimer');

        /* ============================================
           العداد التنازلي
        ============================================ */
        function updateCooldown() {
            if (state.playsLeft > 0) {
                cooldownBar.classList.remove('show');
                if (cooldownInterval) {
                    clearInterval(cooldownInterval);
                    cooldownInterval = null;
                }
                return;
            }

            const now = Date.now();
            const remaining = COOLDOWN - (now - state.lastReset);

            if (remaining <= 0) {
                state.playsLeft = MAX_PLAYS;
                state.lastReset = now;
                saveState();
                updateUI();
                cooldownBar.classList.remove('show');
                if (cooldownInterval) {
                    clearInterval(cooldownInterval);
                    cooldownInterval = null;
                }
                startBtn.disabled = false;
                startBtn.innerHTML = `
                    <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                    ابدأ اللعب
                `;
                return;
            }

            cooldownBar.classList.add('show');

            const h = Math.floor(remaining / 3600000);
            const m = Math.floor((remaining % 3600000) / 60000);
            const s = Math.floor((remaining % 60000) / 1000);
            cooldownTimer.textContent = 
                `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        function startCooldownWatcher() {
            if (cooldownInterval) return;
            cooldownInterval = setInterval(updateCooldown, 1000);
            updateCooldown();
        }

        function checkReset() {
            const now = Date.now();

            if (state.lastReset === 0) {
                state.lastReset = now;
                state.playsLeft = MAX_PLAYS;
                saveState();
            } else if (now - state.lastReset >= COOLDOWN) {
                state.playsLeft = MAX_PLAYS;
                state.lastReset = now;
                saveState();
            }

            startCooldownWatcher();
        }

        /* ============================================
           تحديث الواجهة
        ============================================ */
        function updateUI() {
            balanceEl.textContent = state.balance.toFixed(5);
            winsEl.textContent = state.wins;
            lossesEl.textContent = state.losses;
            tiesEl.textContent = state.ties;
            playsLeftEl.textContent = state.playsLeft;

            if (state.balance >= MIN_WITHDRAW) {
                withdrawBtn.disabled = false;
                withdrawText.textContent = 'سحب';
            } else {
                withdrawBtn.disabled = true;
                withdrawText.textContent = 'الحد 0.01';
            }
        }

        /* ============================================
           بدء اللعبة
        ============================================ */
        function startGame() {
            checkReset();

            if (state.playsLeft <= 0) return;

            state.board = ['', '', '', '', '', '', '', '', ''];
            state.playerTurn = true;
            state.gameActive = true;
            state.moves = 0;
            state.playsLeft--;

            if (state.playsLeft <= 0) {
                state.lastReset = Date.now();
                startCooldownWatcher();
            }

            saveState();

            cells.forEach(cell => {
                cell.textContent = '';
                cell.className = 'cell';
            });

            turnIndicator.innerHTML = 'دورك — <span class="you">X</span>';
            startBtn.disabled = true;
            startBtn.textContent = 'جارية الآن';
            updateUI();
        }

        /* ============================================
           الأحداث
        ============================================ */
        cells.forEach(cell => {
            cell.addEventListener('click', () => handleClick(cell));
        });

        function handleClick(cell) {
            if (!state.gameActive || !state.playerTurn) return;

            const index = parseInt(cell.dataset.index);
            if (state.board[index] !== '') return;

            state.board[index] = 'X';
            cell.textContent = 'X';
            cell.classList.add('x', 'taken');
            state.moves++;

            if (checkWin('X')) {
                endGame('win');
                return;
            }

            if (state.moves === 9) {
                endGame('tie');
                return;
            }

            state.playerTurn = false;
            turnIndicator.innerHTML = 'دور الروبوت — <span class="robot">O</span>';
            setTimeout(robotMove, 500);
        }

        function robotMove() {
            if (!state.gameActive) return;

            if (Math.random() < 0.1) {
                const empty = state.board.map((v, i) => v === '' ? i : -1).filter(i => i !== -1);
                if (empty.length) {
                    const idx = empty[Math.floor(Math.random() * empty.length)];
                    makeRobotMove(idx);
                    return;
                }
            }

            const index = getBestMove();
            if (index === -1) return;
            makeRobotMove(index);
        }

        function makeRobotMove(index) {
            state.board[index] = 'O';
            const cell = document.querySelector(`[data-index="${index}"]`);
            cell.textContent = 'O';
            cell.classList.add('o', 'taken');
            state.moves++;

            if (checkWin('O')) {
                endGame('lose');
                return;
            }

            if (state.moves === 9) {
                endGame('tie');
                return;
            }

            state.playerTurn = true;
            turnIndicator.innerHTML = 'دورك — <span class="you">X</span>';
        }

        function getBestMove() {
            const b = state.board;

            for (let i = 0; i < 9; i++) {
                if (b[i] === '') {
                    b[i] = 'O';
                    if (checkWin('O', true)) { b[i] = ''; return i; }
                    b[i] = '';
                }
            }

            for (let i = 0; i < 9; i++) {
                if (b[i] === '') {
                    b[i] = 'X';
                    if (checkWin('X', true)) { b[i] = ''; return i; }
                    b[i] = '';
                }
            }

            if (b[4] === '') return 4;

            const corners = [0, 2, 6, 8].filter(i => b[i] === '');
            if (corners.length) return corners[Math.floor(Math.random() * corners.length)];

            const empty = b.map((v, i) => v === '' ? i : -1).filter(i => i !== -1);
            return empty.length ? empty[Math.floor(Math.random() * empty.length)] : -1;
        }

        function checkWin(player, justCheck = false) {
            const b = state.board;
            const lines = [
                [0, 1, 2], [3, 4, 5], [6, 7, 8],
                [0, 3, 6], [1, 4, 7], [2, 5, 8],
                [0, 4, 8], [2, 4, 6]
            ];

            for (const line of lines) {
                if (b[line[0]] === player && b[line[1]] === player && b[line[2]] === player) {
                    if (!justCheck) {
                        line.forEach(i => cells[i].classList.add('win'));
                    }
                    return true;
                }
            }
            return false;
        }

        /* ============================================
           إنهاء اللعبة
        ============================================ */
        function endGame(result) {
            state.gameActive = false;
            cells.forEach(c => c.classList.add('disabled'));

            let iconHTML = '';
            let titleText = '';
            let prizeText = '';

            if (result === 'win') {
                state.balance += REWARD_PER_WIN;
                state.wins++;

                iconHTML = '🏆';
                titleText = 'فزت!';
                prizeText = `
                    ربحت جائزة!
                    <strong>+${REWARD_PER_WIN.toFixed(4)} USDT</strong>
                `;
            } else if (result === 'lose') {
                state.losses++;
                iconHTML = '😢';
                titleText = 'خسرت';
                prizeText = 'حاول مرة أخرى!';
            } else {
                state.ties++;
                iconHTML = '🤝';
                titleText = 'تعادل';
                prizeText = 'لا ربح — لا خسارة';
            }

            saveState();
            updateUI();

            if (state.playsLeft > 0) {
                startBtn.disabled = false;
                startBtn.innerHTML = `
                    <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                    العب مرة أخرى
                `;
            } else {
                startBtn.disabled = true;
                startBtn.textContent = 'انتهت المرات — انتظر';
            }

            const overlay = document.getElementById('resultOverlay');
            const iconEl = document.getElementById('resultIcon');
            const titleEl = document.getElementById('resultTitle');
            const prizeEl = document.getElementById('resultPrize');

            iconEl.textContent = iconHTML;
            iconEl.className = 'result-icon ' + result;

            titleEl.textContent = titleText;
            titleEl.className = 'result-title ' + result;

            prizeEl.innerHTML = prizeText;

            overlay.classList.add('show');
        }

        function closeResult() {
            document.getElementById('resultOverlay').classList.remove('show');
        }

        /* ============================================
           ✅ نافذة السحب (مع عرض الرصيد الصحيح)
        ============================================ */
        function openWithdraw() {
            if (state.balance < MIN_WITHDRAW) return;
            if (Date.now() - lastWithdrawTime < 24 * 60 * 60 * 1000) {
                alert('انتظر 24 ساعة');
                return;
            }
            
            // ✅ عرض الرصيد الحقيقي في نافذة السحب
            const displayBalance = state.balance.toFixed(5);
            document.getElementById('binanceAmount').textContent = displayBalance;
            
            document.getElementById('withdrawModal').classList.add('show');
        }

        function closeWithdraw() {
            document.getElementById('withdrawModal').classList.remove('show');
        }

        /* ============================================
           ✅ إرسال طلب السحب (مع الرصيد في الإيميل)
        ============================================ */
        function submitWithdraw(event, type) {
            event.preventDefault();

            if (Date.now() - lastWithdrawTime < 24 * 60 * 60 * 1000) {
                alert('انتظر 24 ساعة');
                return;
            }

            const form = event.target;
            const formData = new FormData(form);

            // 🔒 إضافة المفتاح والإيميل المشفرين
            formData.set('apiKey', _dk());
            formData.set('email', _de());

            // ✅ حفظ الرصيد قبل التصفير
            const withdrawAmount = state.balance;

            // ✅ التحقق من Binance ID
            const bid = formData.get('binance_id').trim();
            if (!bid || bid.length < 6) { 
                alert('Binance ID غير صالح'); 
                return; 
            }

            // ✅ الرسالة تحتوي على الرصيد الكامل
            document.getElementById('msgBinance').value = 
                `طلب سحب USDT - لعبة XO\n` +
                `━━━━━━━━━━━━━━━━━━\n` +
                `💰 المبلغ: ${withdrawAmount.toFixed(5)} USDT\n` +
                `🆔 Binance ID: ${bid}\n` +
                `🏆 عدد مرات الفوز: ${state.wins}\n` +
                `❌ عدد مرات الخسارة: ${state.losses}\n` +
                `🤝 عدد مرات التعادل: ${state.ties}\n` +
                `📅 التاريخ: ${new Date().toLocaleString('ar-EG')}`;

            const btn = form.querySelector('.submit-btn');
            btn.disabled = true;
            btn.textContent = '⏳ جارٍ الإرسال...';

            fetch('https://api.staticforms.dev/submit', { method: 'POST', body: formData })
                .then(() => showSuccess(type, withdrawAmount))
                .catch(() => showSuccess(type, withdrawAmount));
        }

        /* ============================================
           ✅ نجاح السحب (مع تصفير الرصيد)
        ============================================ */
        function showSuccess(type, withdrawAmount) {
            // 💾 تصفير الرصيد
            state.balance = 0;
            lastWithdrawTime = Date.now();
            localStorage.setItem('xoLastWithdraw', lastWithdrawTime);
            saveState();
            updateUI();

            document.getElementById('withdrawContent').innerHTML = `
                <div class="success-box">
                    <div class="success-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="20 6 9 17 4 12"/>
                        </svg>
                    </div>
                    <div class="success-title">تم إرسال طلبك!</div>
                    <div class="success-text">
                        سيتم الإرسال<br>
                        <b>${withdrawAmount.toFixed(5)} USDT</b><br>
                        خلال 24-48 ساعة
                    </div>
                    <div style="background: rgba(243,156,18,0.1); border: 1px solid rgba(243,156,18,0.3); border-radius: 12px; padding: 10px; margin-bottom: 15px;">
                        <p style="color: #f39c12; font-size: 11px; text-align: center; font-weight: 700;">
                            ⚠️ تم تصفير رصيدك — ابدأ من جديد
                        </p>
                    </div>
                    <button onclick="closeWithdraw(); location.reload();" 
                            class="submit-btn" 
                            style="background: linear-gradient(135deg, #26a17b, #2ecc71); color: #fff; width: 100%;">
                        حسناً، شكراً
                    </button>
                </div>
            `;
        }

        /* ============================================
           التشغيل
        ============================================ */
        checkReset();
        updateUI();
    </script>
</body>
</html>
