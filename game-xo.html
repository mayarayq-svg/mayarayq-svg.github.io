<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>X O | الألعاب</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }

  :root {
    --x-color: #ef4444;
    --o-color: #22c55e;
    --gold: #fbbf24;
    --bg-dark: #050810;
    --card: rgba(255,255,255,0.04);
    --border: rgba(255,255,255,0.08);
    --text: #e2e8f0;
    --text-dim: #64748b;
  }

  body {
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 10%, #14213d 0%, #050810 60%);
    color: var(--text);
    padding: 16px;
    overflow-x: hidden;
    position: relative;
  }

  /* خلفية متحركة */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background:
      radial-gradient(circle at 20% 30%, rgba(239,68,68,0.08), transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(34,197,94,0.08), transparent 40%);
    pointer-events: none;
    animation: bgFloat 10s ease-in-out infinite alternate;
    z-index: 0;
  }

  @keyframes bgFloat {
    0% { transform: scale(1) rotate(0deg); }
    100% { transform: scale(1.15) rotate(3deg); }
  }

  /* ===== الشريط العلوي ===== */
  .topbar {
    width: 100%; max-width: 460px;
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 14px;
    z-index: 2;
    position: relative;
  }

  .back-btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 9px 16px;
    font-size: 0.75rem; font-weight: 700; letter-spacing: 1px;
    border: 1px solid rgba(34,197,94,0.3);
    background: linear-gradient(135deg, rgba(34,197,94,0.12), rgba(34,197,94,0.02));
    color: #4ade80; border-radius: 12px;
    cursor: pointer; transition: all 0.3s;
  }

  .back-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(34,197,94,0.25);
  }

  .back-btn svg { width: 14px; height: 14px; }

  .balance-chip {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 16px;
    background: linear-gradient(135deg, rgba(251,191,36,0.15), rgba(251,191,36,0.03));
    border: 1px solid rgba(251,191,36,0.3);
    border-radius: 12px;
    font-family: 'Courier New', monospace;
    font-weight: 700;
    font-size: 0.85rem;
    color: var(--gold);
    direction: ltr;
  }

  .balance-chip svg { width: 14px; height: 14px; }

  /* ===== العنوان ===== */
  .title {
    font-size: 2rem; font-weight: 900; letter-spacing: 6px;
    margin-bottom: 6px;
    background: linear-gradient(135deg, #ef4444, #fbbf24, #22c55e);
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
    text-align: center;
    z-index: 2;
    position: relative;
  }

  .subtitle {
    font-size: 0.7rem; color: var(--text-dim);
    letter-spacing: 4px; margin-bottom: 18px;
    text-align: center;
    z-index: 2; position: relative;
  }

  /* ===== بطاقة اللعب ===== */
  .game-card {
    width: 100%; max-width: 460px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 20px;
    backdrop-filter: blur(14px);
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    z-index: 2; position: relative;
    margin-bottom: 14px;
  }

  /* ===== حالة اللعب ===== */
  .status-bar {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 16px; padding: 12px 16px;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    border-radius: 14px;
  }

  .turn-indicator {
    display: flex; align-items: center; gap: 10px;
    font-size: 0.85rem; font-weight: 700;
    letter-spacing: 1px;
    transition: all 0.3s;
  }

  .turn-icon {
    width: 28px; height: 28px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 8px;
    font-weight: 900; font-size: 1rem;
    transition: all 0.3s;
  }

  .turn-icon.x {
    background: rgba(239,68,68,0.2);
    color: var(--x-color);
    box-shadow: 0 0 15px rgba(239,68,68,0.5);
  }

  .turn-icon.o {
    background: rgba(34,197,94,0.2);
    color: var(--o-color);
    box-shadow: 0 0 15px rgba(34,197,94,0.5);
  }

  .score-mini {
    display: flex; gap: 12px;
    font-family: 'Courier New', monospace;
    font-size: 0.85rem; font-weight: 700;
  }

  .score-mini .x { color: var(--x-color); }
  .score-mini .o { color: var(--o-color); }
  .score-mini .d { color: var(--text-dim); }

  /* ===== شبكة اللعب ===== */
  .board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 16px;
    position: relative;
  }

  .cell {
    aspect-ratio: 1 / 1;
    background: linear-gradient(135deg, rgba(255,255,255,0.05), rgba(255,255,255,0.01));
    border: 2px solid rgba(255,255,255,0.08);
    border-radius: 20px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: all 0.3s;
    position: relative;
    overflow: hidden;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .cell::before {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.1), transparent 70%);
    opacity: 0;
    transition: opacity 0.3s;
  }

  .cell:hover:not(.taken) {
    border-color: rgba(34,197,94,0.4);
    transform: translateY(-3px);
    box-shadow: 0 10px 30px rgba(34,197,94,0.2);
  }

  .cell:hover:not(.taken)::before { opacity: 1; }

  .cell.taken { cursor: not-allowed; }

  .cell.winner {
    background: linear-gradient(135deg, rgba(251,191,36,0.25), rgba(251,191,36,0.05));
    border-color: var(--gold);
    box-shadow:
      0 0 30px rgba(251,191,36,0.6),
      inset 0 0 30px rgba(251,191,36,0.15);
    animation: winnerPulse 0.8s ease-in-out infinite;
  }

  @keyframes winnerPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }

  /* X و O داخل المربع */
  .mark {
    width: 70%;
    height: 70%;
    display: flex; align-items: center; justify-content: center;
    animation: markIn 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55);
  }

  @keyframes markIn {
    0% { transform: scale(0) rotate(-180deg); opacity: 0; }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
  }

  .mark svg { width: 100%; height: 100%; }

  .mark.x svg {
    filter: drop-shadow(0 0 12px rgba(239,68,68,0.9));
  }

  .mark.o svg {
    filter: drop-shadow(0 0 12px rgba(34,197,94,0.9));
  }

  /* رسم X و O تدريجياً */
  .mark svg path, .mark svg circle {
    stroke-dasharray: 200;
    stroke-dashoffset: 200;
    animation: draw 0.5s ease-out forwards;
  }

  @keyframes draw {
    to { stroke-dashoffset: 0; }
  }

  /* ===== أزرار اللعبة ===== */
  .game-actions {
    display: flex; gap: 10px;
  }

  .btn-action {
    flex: 1;
    padding: 14px;
    font-size: 0.8rem; font-weight: 700;
    letter-spacing: 1px;
    border-radius: 14px;
    cursor: pointer;
    transition: all 0.3s;
    border: 1px solid;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }

  .btn-action svg { width: 16px; height: 16px; }

  .btn-new {
    border-color: rgba(34,197,94,0.4);
    background: linear-gradient(135deg, rgba(34,197,94,0.15), rgba(34,197,94,0.03));
    color: #4ade80;
  }

  .btn-new:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 25px rgba(34,197,94,0.3);
    background: linear-gradient(135deg, rgba(34,197,94,0.25), rgba(34,197,94,0.08));
  }

  .btn-reset {
    border-color: rgba(239,68,68,0.3);
    background: linear-gradient(135deg, rgba(239,68,68,0.1), rgba(239,68,68,0.02));
    color: #f87171;
  }

  .btn-reset:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 25px rgba(239,68,68,0.25);
  }

  /* ===== مفاتيح السحب والإيداع ===== */
  .wallet-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    width: 100%; max-width: 460px;
    margin-bottom: 14px;
    z-index: 2; position: relative;
  }

  .wallet-btn {
    padding: 14px;
    font-size: 0.82rem; font-weight: 700;
    letter-spacing: 1px;
    border-radius: 14px;
    cursor: pointer;
    transition: all 0.3s;
    border: 1px solid;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }

  .wallet-btn svg { width: 18px; height: 18px; }

  .btn-deposit {
    border-color: rgba(34,197,94,0.4);
    background: linear-gradient(135deg, rgba(34,197,94,0.18), rgba(34,197,94,0.04));
    color: #4ade80;
  }

  .btn-deposit:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 10px 25px rgba(34,197,94,0.35);
  }

  .btn-withdraw {
    border-color: rgba(251,191,36,0.4);
    background: linear-gradient(135deg, rgba(251,191,36,0.18), rgba(251,191,36,0.04));
    color: var(--gold);
  }

  .btn-withdraw:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 10px 25px rgba(251,191,36,0.35);
  }

  .wallet-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    filter: grayscale(0.7);
  }

  /* ===== نافذة ===== */
  .modal {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.8);
    backdrop-filter: blur(8px);
    display: flex; align-items: center; justify-content: center;
    z-index: 300;
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s;
    padding: 20px;
  }

  .modal.show { opacity: 1; pointer-events: auto; }

  .modal-in {
    background: linear-gradient(135deg, #0f172a, #1e293b);
    border: 1px solid rgba(34,197,94,0.3);
    border-radius: 24px;
    padding: 28px 24px;
    width: 100%; max-width: 360px;
    transform: scale(0.85) translateY(20px);
    transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55);
    box-shadow: 0 30px 80px rgba(0,0,0,0.7);
  }

  .modal.show .modal-in {
    transform: scale(1) translateY(0);
  }

  .modal-icon {
    width: 60px; height: 60px;
    margin: 0 auto 16px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, rgba(34,197,94,0.2), rgba(34,197,94,0.05));
    border: 2px solid rgba(34,197,94,0.4);
    box-shadow: 0 0 30px rgba(34,197,94,0.4);
  }

  .modal-icon svg { width: 28px; height: 28px; color: #4ade80; }

  .modal-title {
    font-size: 1.2rem; font-weight: 800;
    text-align: center; margin-bottom: 6px;
    color: #4ade80;
    letter-spacing: 1px;
  }

  .modal-sub {
    font-size: 0.75rem; color: var(--text-dim);
    text-align: center; margin-bottom: 20px;
    letter-spacing: 1px;
  }

  .modal-input-wrap {
    position: relative; margin-bottom: 16px;
  }

  .modal-input {
    width: 100%;
    padding: 15px 45px 15px 15px;
    background: rgba(0,0,0,0.4);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 14px;
    color: var(--text);
    font-family: 'Courier New', monospace;
    font-size: 1.2rem; text-align: center;
    letter-spacing: 2px;
    outline: none;
    direction: ltr;
    transition: all 0.3s;
  }

  .modal-input:focus {
    border-color: #22c55e;
    box-shadow: 0 0 0 4px rgba(34,197,94,0.15);
  }

  .input-suffix {
    position: absolute;
    left: 15px; top: 50%;
    transform: translateY(-50%);
    font-size: 0.7rem; color: var(--text-dim);
    letter-spacing: 1px;
    pointer-events: none;
  }

  .modal-actions {
    display: flex; gap: 10px;
  }

  .btn {
    flex: 1; padding: 13px;
    border: none; border-radius: 14px;
    font-weight: 700; font-size: 0.82rem;
    letter-spacing: 1px; cursor: pointer;
    transition: all 0.25s;
  }

  .btn-cancel {
    background: rgba(100,116,139,0.2);
    color: #94a3b8;
  }

  .btn-cancel:hover { background: rgba(100,116,139,0.35); }

  .btn-confirm {
    background: linear-gradient(135deg, #22c55e, #15803d);
    color: white;
    box-shadow: 0 5px 20px rgba(34,197,94,0.4);
  }

  .btn-confirm:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(34,197,94,0.6);
  }

  /* ===== إشعار ===== */
  .toast {
    position: fixed;
    bottom: 30px; left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: rgba(15,23,42,0.98);
    border: 1px solid rgba(34,197,94,0.4);
    border-radius: 14px;
    padding: 13px 24px;
    color: var(--text);
    font-size: 0.82rem;
    font-weight: 600;
    transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55);
    z-index: 400;
    box-shadow: 0 15px 40px rgba(0,0,0,0.6);
    max-width: 90%; text-align: center;
    letter-spacing: 0.5px;
  }

  .toast.show { transform: translateX(-50%) translateY(0); }

  .toast.error { border-color: rgba(239,68,68,0.5); color: #fca5a5; }
  .toast.success { border-color: rgba(34,197,94,0.5); color: #86efac; }
  .toast.win { border-color: rgba(251,191,36,0.5); color: var(--gold); }

  /* ===== جزيئات الفوز ===== */
  .confetti {
    position: fixed;
    width: 8px; height: 8px;
    pointer-events: none;
    z-index: 500;
    animation: confettiFall 1.8s ease-out forwards;
  }

  @keyframes confettiFall {
    0% {
      opacity: 1;
      transform: translate(0, 0) rotate(0deg) scale(1);
    }
    100% {
      opacity: 0;
      transform: translate(var(--tx), var(--ty)) rotate(720deg) scale(0.3);
    }
  }

  /* ===== شاشة فوز ===== */
  .win-overlay {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(5,8,16,0.9);
    backdrop-filter: blur(8px);
    border-radius: 24px;
    z-index: 100;
    opacity: 0; pointer-events: none;
    transition: opacity 0.4s;
  }

  .win-overlay.show { opacity: 1; pointer-events: auto; }

  .win-content {
    text-align: center;
    transform: scale(0.7);
    transition: transform 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55);
  }

  .win-overlay.show .win-content {
    transform: scale(1);
  }

  .win-icon {
    width: 90px; height: 90px;
    margin: 0 auto 20px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    animation: winRotate 2s ease-in-out infinite;
  }

  @keyframes winRotate {
    0%, 100% { transform: rotate(-5deg) scale(1); }
    50% { transform: rotate(5deg) scale(1.05); }
  }

  .win-icon.x {
    background: radial-gradient(circle, rgba(239,68,68,0.3), rgba(239,68,68,0.05));
    border: 3px solid var(--x-color);
    box-shadow: 0 0 50px rgba(239,68,68,0.7), inset 0 0 30px rgba(239,68,68,0.3);
  }

  .win-icon.o {
    background: radial-gradient(circle, rgba(34,197,94,0.3), rgba(34,197,94,0.05));
    border: 3px solid var(--o-color);
    box-shadow: 0 0 50px rgba(34,197,94,0.7), inset 0 0 30px rgba(34,197,94,0.3);
  }

  .win-icon.draw {
    background: radial-gradient(circle, rgba(100,116,139,0.3), rgba(100,116,139,0.05));
    border: 3px solid #64748b;
    box-shadow: 0 0 50px rgba(100,116,139,0.5);
  }

  .win-icon svg { width: 48px; height: 48px; }

  .win-text {
    font-size: 1.6rem; font-weight: 900;
    margin-bottom: 8px;
    letter-spacing: 3px;
  }

  .win-text.x { color: var(--x-color); text-shadow: 0 0 30px rgba(239,68,68,0.9); }
  .win-text.o { color: var(--o-color); text-shadow: 0 0 30px rgba(34,197,94,0.9); }
  .win-text.draw { color: var(--text-dim); }

  .win-sub {
    font-size: 0.85rem; color: var(--text-dim);
    letter-spacing: 2px; margin-bottom: 20px;
  }

  .win-btn {
    padding: 12px 40px;
    font-size: 0.85rem; font-weight: 700;
    letter-spacing: 2px;
    border: none; border-radius: 14px;
    background: linear-gradient(135deg, #22c55e, #15803d);
    color: white; cursor: pointer;
    box-shadow: 0 10px 30px rgba(34,197,94,0.5);
    transition: all 0.3s;
  }

  .win-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 15px 40px rgba(34,197,94,0.7);
  }

  @media (max-width: 460px) {
    .title { font-size: 1.6rem; letter-spacing: 4px; }
    .game-card { padding: 16px; }
    .board { gap: 8px; }
    .cell { border-radius: 16px; }
  }
</style>
</head>
<body>

<!-- الشريط العلوي -->
<div class="topbar">
  <button class="back-btn" id="backBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="9 18 15 12 9 6"></polyline>
    </svg>
    العودة للألعاب
  </button>

  <div class="balance-chip">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"></circle>
      <path d="M12 6v12M9 9h6M9 15h6"></path>
    </svg>
    <span id="balanceEl">0</span>
  </div>
</div>

<!-- العنوان -->
<div class="title">X O</div>
<div class="subtitle">TIC TAC TOE · PRO EDITION</div>

<!-- بطاقة اللعب -->
<div class="game-card">

  <!-- شريط الحالة -->
  <div class="status-bar">
    <div class="turn-indicator" id="turnIndicator">
      <div class="turn-icon x" id="turnIcon">X</div>
      <span id="turnText">دور اللاعب X</span>
    </div>
    <div class="score-mini">
      <span class="x">X: <span id="scoreX">0</span></span>
      <span class="o">O: <span id="scoreO">0</span></span>
      <span class="d">T: <span id="scoreD">0</span></span>
    </div>
  </div>

  <!-- الشبكة -->
  <div class="board" id="board"></div>

  <!-- أزرار -->
  <div class="game-actions">
    <button class="btn-action btn-new" id="newBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="1 4 1 10 7 10"></polyline>
        <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
      </svg>
      جولة جديدة
    </button>
    <button class="btn-action btn-reset" id="resetBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="3 6 5 6 21 6"></polyline>
        <path d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6"></path>
      </svg>
      تصفير النتائج
    </button>
  </div>

  <!-- شاشة الفوز -->
  <div class="win-overlay" id="winOverlay">
    <div class="win-content">
      <div class="win-icon" id="winIcon"></div>
      <div class="win-text" id="winText"></div>
      <div class="win-sub" id="winSub"></div>
      <button class="win-btn" id="winNewBtn">جولة جديدة</button>
    </div>
  </div>

</div>

<!-- مفاتيح السحب والإيداع -->
<div class="wallet-row">
  <button class="wallet-btn btn-deposit" id="depositBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 5v14M5 12l7 7 7-7"></path>
    </svg>
    إيداع
  </button>
  <button class="wallet-btn btn-withdraw" id="withdrawBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 19V5M5 12l7-7 7 7"></path>
    </svg>
    سحب
  </button>
</div>

<!-- نافذة الإيداع/السحب -->
<div class="modal" id="modal">
  <div class="modal-in">
    <div class="modal-icon" id="modalIcon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 5v14M5 12l7 7 7-7"></path>
      </svg>
    </div>
    <div class="modal-title" id="modalTitle">إيداع</div>
    <div class="modal-sub" id="modalSub">أدخل المبلغ (الحد الأدنى 10)</div>
    <div class="modal-input-wrap">
      <input type="number" class="modal-input" id="modalInput" placeholder="0" step="1" min="0">
      <span class="input-suffix">PEPE</span>
    </div>
    <div class="modal-actions">
      <button class="btn btn-cancel" id="modalCancel">إلغاء</button>
      <button class="btn btn-confirm" id="modalConfirm">تأكيد</button>
    </div>
  </div>
</div>

<!-- إشعار -->
<div class="toast" id="toast"></div>

<script>
  /* ============ الإعدادات ============ */
  const MIN_DEPOSIT   = 10;
  const MIN_WITHDRAW  = 100;
  const GAMES_URL     = 'games.html';

  /* ============ الحالة ============ */
  let balance = parseFloat(localStorage.getItem('p_bal') || '0');
  let scoreX = parseInt(localStorage.getItem('xo_x') || '0');
  let scoreO = parseInt(localStorage.getItem('xo_o') || '0');
  let scoreD = parseInt(localStorage.getItem('xo_d') || '0');

  /* ============ حالة اللعبة ============ */
  let board = Array(9).fill(null);
  let currentPlayer = 'X';
  let gameOver = false;
  let aiEnabled = true;
  let playerMark = 'X';
  let aiMark = 'O';
  let modalMode = 'deposit'; // deposit | withdraw

  /* ============ العناصر ============ */
  const boardEl       = document.getElementById('board');
  const balanceEl     = document.getElementById('balanceEl');
  const turnIndicator = document.getElementById('turnIndicator');
  const turnIcon      = document.getElementById('turnIcon');
  const turnText      = document.getElementById('turnText');
  const scoreXEl      = document.getElementById('scoreX');
  const scoreOEl      = document.getElementById('scoreO');
  const scoreDEl      = document.getElementById('scoreD');
  const newBtn        = document.getElementById('newBtn');
  const resetBtn      = document.getElementById('resetBtn');
  const winOverlay    = document.getElementById('winOverlay');
  const winIcon       = document.getElementById('winIcon');
  const winText       = document.getElementById('winText');
  const winSub        = document.getElementById('winSub');
  const winNewBtn     = document.getElementById('winNewBtn');
  const backBtn       = document.getElementById('backBtn');
  const depositBtn    = document.getElementById('depositBtn');
  const withdrawBtn   = document.getElementById('withdrawBtn');
  const modal         = document.getElementById('modal');
  const modalIcon     = document.getElementById('modalIcon');
  const modalTitle    = document.getElementById('modalTitle');
  const modalSub      = document.getElementById('modalSub');
  const modalInput    = document.getElementById('modalInput');
  const modalCancel   = document.getElementById('modalCancel');
  const modalConfirm  = document.getElementById('modalConfirm');
  const toastEl       = document.getElementById('toast');

  /* ============ أيقونات SVG ============ */
  const SVG_X = `
    <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <line x1="20" y1="20" x2="80" y2="80" stroke="#ef4444" stroke-width="12" stroke-linecap="round"/>
      <line x1="80" y1="20" x2="20" y2="80" stroke="#ef4444" stroke-width="12" stroke-linecap="round"/>
    </svg>
  `;

  const SVG_O = `
    <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="50" cy="50" r="32" stroke="#22c55e" stroke-width="12" stroke-linecap="round"/>
    </svg>
  `;

  const SVG_TROPHY = `
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path>
      <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path>
      <path d="M4 22h16"></path>
      <path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"></path>
      <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"></path>
      <path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"></path>
    </svg>
  `;

  const SVG_HAND = `
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 11V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v0"></path>
      <path d="M14 10V4a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v2"></path>
      <path d="M10 10.5V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v8"></path>
      <path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"></path>
    </svg>
  `;

  /* ============ التهيئة ============ */
  function initBoard() {
    boardEl.innerHTML = '';
    for (let i = 0; i < 9; i++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.index = i;
      cell.addEventListener('click', () => handleCellClick(i));
      boardEl.appendChild(cell);
    }
  }

  function updateBalanceUI() {
    balanceEl.textContent = balance.toFixed(2);
    localStorage.setItem('p_bal', balance);
  }

  function updateScoreUI() {
    scoreXEl.textContent = scoreX;
    scoreOEl.textContent = scoreO;
    scoreDEl.textContent = scoreD;
    localStorage.setItem('xo_x', scoreX);
    localStorage.setItem('xo_o', scoreO);
    localStorage.setItem('xo_d', scoreD);
  }

  function updateTurnUI() {
    if (currentPlayer === 'X') {
      turnIcon.className = 'turn-icon x';
      turnIcon.textContent = 'X';
      turnText.textContent = 'دور اللاعب X';
    } else {
      turnIcon.className = 'turn-icon o';
      turnIcon.textContent = 'O';
      turnText.textContent = 'دور اللاعب O';
    }
  }

  /* ============ إشعار ============ */
  function showToast(msg, type = '', duration = 2500) {
    toastEl.textContent = msg;
    toastEl.className = 'toast show ' + type;
    clearTimeout(toastEl._t);
    toastEl._t = setTimeout(() => {
      toastEl.classList.remove('show');
    }, duration);
  }

  /* ============ معالجة الضغط ============ */
  function handleCellClick(index) {
    if (gameOver) return;
    if (board[index] !== null) return;
    if (currentPlayer !== playerMark) return;

    makeMove(index, playerMark);

    if (!gameOver) {
      currentPlayer = aiMark;
      updateTurnUI();
      setTimeout(aiMove, 500);
    }
  }

  function makeMove(index, player) {
    board[index] = player;
    const cell = boardEl.children[index];
    cell.classList.add('taken');
    const mark = document.createElement('div');
    mark.className = 'mark ' + (player === 'X' ? 'x' : 'o');
    mark.innerHTML = player === 'X' ? SVG_X : SVG_O;
    cell.appendChild(mark);

    const winner = checkWinner();
    if (winner) {
      handleGameEnd(winner);
    } else if (board.every(c => c !== null)) {
      handleGameEnd('draw');
    }
  }

  /* ============ AI ============ */
  function aiMove() {
    if (gameOver) return;

    // محاولة الفوز
    let move = findBestMove(aiMark);
    if (move === -1) move = findBestMove(playerMark); // صد اللاعب
    if (move === -1) {
      // المركز ثم الزوايا ثم الباقي
      if (board[4] === null) move = 4;
      else {
        const corners = [0, 2, 6, 8].filter(i => board[i] === null);
        if (corners.length) move = corners[Math.floor(Math.random() * corners.length)];
        else {
          const empty = board.map((v, i) => v === null ? i : -1).filter(i => i !== -1);
          move = empty[Math.floor(Math.random() * empty.length)];
        }
      }
    }

    makeMove(move, aiMark);

    if (!gameOver) {
      currentPlayer = playerMark;
      updateTurnUI();
    }
  }

  function findBestMove(player) {
    const lines = [
      [0,1,2],[3,4,5],[6,7,8],
      [0,3,6],[1,4,7],[2,5,8],
      [0,4,8],[2,4,6]
    ];
    for (const line of lines) {
      const vals = line.map(i => board[i]);
      const playerCount = vals.filter(v => v === player).length;
      const emptyCount = vals.filter(v => v === null).length;
      if (playerCount === 2 && emptyCount === 1) {
        return line[vals.indexOf(null)];
      }
    }
    return -1;
  }

  /* ============ فحص الفائز ============ */
  function checkWinner() {
    const lines = [
      [0,1,2],[3,4,5],[6,7,8],
      [0,3,6],[1,4,7],[2,5,8],
      [0,4,8],[2,4,6]
    ];
    for (const line of lines) {
      const [a,b,c] = line;
      if (board[a] && board[a] === board[b] && board[a] === board[c]) {
        line.forEach(i => boardEl.children[i].classList.add('winner'));
        return board[a];
      }
    }
    return null;
  }

  /* ============ نهاية اللعبة ============ */
  function handleGameEnd(winner) {
    gameOver = true;

    let text = '', sub = '', iconClass = '';

    if (winner === 'draw') {
      text = 'تعادل';
      sub = 'لا فائز هذه الجولة';
      iconClass = 'draw';
      scoreD++;
      winIcon.innerHTML = SVG_HAND;
    } else if (winner === playerMark) {
      text = 'فزت!';
      sub = 'أحسنت!';
      iconClass = winner === 'X' ? 'x' : 'o';
      if (winner === 'X') scoreX++; else scoreO++;
      winIcon.innerHTML = SVG_TROPHY;
      spawnConfetti();
      // مكافأة
      balance += 5;
      updateBalanceUI();
      showToast('+5 PEPE مكافأة الفوز!', 'win');
    } else {
      text = 'خسرت';
      sub = 'حظ أوفر في الجولة القادمة';
      iconClass = winner === 'X' ? 'x' : 'o';
      if (winner === 'X') scoreX++; else scoreO++;
      winIcon.innerHTML = winner === 'X' ? SVG_X : SVG_O;
    }

    winIcon.className = 'win-icon ' + iconClass;
    winText.className = 'win-text ' + iconClass;
    winText.textContent = text;
    winSub.textContent = sub;

    updateScoreUI();

    setTimeout(() => {
      winOverlay.classList.add('show');
    }, 600);
  }

  /* ============ جزيئات الفوز ============ */
  function spawnConfetti() {
    const colors = ['#22c55e', '#4ade80', '#fbbf24', '#ef4444', '#60a5fa', '#f472b6'];
    const centerX = window.innerWidth / 2;
    const centerY = window.innerHeight / 2;

    for (let i = 0; i < 40; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = centerX + 'px';
      c.style.top = centerY + 'px';
      c.style.background = colors[Math.floor(Math.random() * colors.length)];
      c.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';

      const angle = (Math.PI * 2 * i) / 40 + Math.random() * 0.5;
      const dist = 200 + Math.random() * 300;
      c.style.setProperty('--tx', (Math.cos(angle) * dist) + 'px');
      c.style.setProperty('--ty', (Math.sin(angle) * dist) + 'px');

      document.body.appendChild(c);
      setTimeout(() => c.remove(), 1900);
    }
  }

  /* ============ جولة جديدة ============ */
  function newRound() {
    board = Array(9).fill(null);
    currentPlayer = 'X';
    gameOver = false;
    winOverlay.classList.remove('show');

    Array.from(boardEl.children).forEach(cell => {
      cell.className = 'cell';
      cell.innerHTML = '';
    });

    updateTurnUI();
  }

  /* ============ تصفير النتائج ============ */
  function resetScores() {
    scoreX = 0; scoreO = 0; scoreD = 0;
    updateScoreUI();
    newRound();
    showToast('تم تصفير النتائج', 'success');
  }

  /* ============ نافذة الإيداع/السحب ============ */
  function openModal(mode) {
    modalMode = mode;
    modalInput.value = '';

    if (mode === 'deposit') {
      modalIcon.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12l7 7 7-7"></path></svg>`;
      modalIcon.style.background = 'linear-gradient(135deg, rgba(34,197,94,0.2), rgba(34,197,94,0.05))';
      modalIcon.style.borderColor = 'rgba(34,197,94,0.4)';
      modalIcon.style.boxShadow = '0 0 30px rgba(34,197,94,0.4)';
      modalIcon.querySelector('svg').style.color = '#4ade80';
      modalTitle.textContent = 'إيداع';
      modalTitle.style.color = '#4ade80';
      modalSub.textContent = 'أدخل المبلغ (الحد الأدنى 10)';
    } else {
      modalIcon.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"></path></svg>`;
      modalIcon.style.background = 'linear-gradient(135deg, rgba(251,191,36,0.2), rgba(251,191,36,0.05))';
      modalIcon.style.borderColor = 'rgba(251,191,36,0.4)';
      modalIcon.style.boxShadow = '0 0 30px rgba(251,191,36,0.4)';
      modalIcon.querySelector('svg').style.color = '#fbbf24';
      modalTitle.textContent = 'سحب';
      modalTitle.style.color = '#fbbf24';
      modalSub.textContent = 'أدخل المبلغ (الحد الأدنى 100)';
    }

    modal.classList.add('show');
    setTimeout(() => modalInput.focus(), 300);
  }

  function closeModal() {
    modal.classList.remove('show');
  }

  function confirmModal() {
    const val = parseFloat(modalInput.value);

    if (!val || val <= 0) {
      showToast('أدخل مبلغاً صالحاً', 'error');
      return;
    }

    if (modalMode === 'deposit') {
      if (val < MIN_DEPOSIT) {
        showToast('الحد الأدنى للإيداع ' + MIN_DEPOSIT, 'error');
        return;
      }
      balance += val;
      updateBalanceUI();
      closeModal();
      showToast('تم إيداع ' + val.toFixed(2) + ' PEPE', 'success');
    } else {
      if (val < MIN_WITHDRAW) {
        showToast('الحد الأدنى للسحب ' + MIN_WITHDRAW, 'error');
        return;
      }
      if (val > balance) {
        showToast('الرصيد غير كافٍ', 'error');
        return;
      }
      balance -= val;
      updateBalanceUI();
      closeModal();
      showToast('تم طلب سحب ' + val.toFixed(2) + ' PEPE', 'success');
    }
  }

  /* ============ الأحداث ============ */
  newBtn.addEventListener('click', newRound);
  winNewBtn.addEventListener('click', newRound);
  resetBtn.addEventListener('click', resetScores);
  depositBtn.addEventListener('click', () => openModal('deposit'));
  withdrawBtn.addEventListener('click', () => openModal('withdraw'));
  modalCancel.addEventListener('click', closeModal);
  modalConfirm.addEventListener('click', confirmModal);
  modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
  modalInput.addEventListener('keydown', e => { if (e.key === 'Enter') confirmModal(); });

  backBtn.addEventListener('click', () => {
    localStorage.setItem('p_bal', balance);
    window.location.href = GAMES_URL;
  });

  /* ============ تشغيل ============ */
  initBoard();
  updateBalanceUI();
  updateScoreUI();
  updateTurnUI();
</script>

</body>
</html>
