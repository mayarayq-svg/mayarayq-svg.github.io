    100% { transform: scale(1); }

    position: relative;
    width: 180px;
    height: 180px;
    display: flex;
    align-items: center;
    justify-content: center;

  .ring {
    position: absolute;
    border-radius: 50%;
    border: 1px solid rgba(34,197,94,0.12);
    pointer-events: none;
    transition: border-color 0.4s;
  }
  .ring-1 { width: 170px; height: 170px; }
  .ring-2 { width: 200px; height: 200px; border-style: dashed; animation: spin 25s linear infinite; }
  .ring-3 { width: 230px; height: 230px; border-color: rgba(34,197,94,0.06); }

  @keyframes spin { to { transform: rotate(360deg); } }

  .pepe {
    width: 130px;
    height: 130px;
    border-radius: 50%;
    cursor: pointer;
    object-fit: cover;
    z-index: 2;
    box-shadow:

      0 0 35px rgba(34,197,94,0.4);
    transition: box-shadow 0.3s, filter 0.3s;

  .pepe.burst {
    animation: shake 0.15s infinite;
    box-shadow:

      0 0 60px rgba(74,222,128,0.9),
      0 0 100px rgba(74,222,128,0.5);
  }

  @keyframes shake {
    0%   { transform: translate(0, 0) rotate(0deg); }
    20%  { transform: translate(-3px, 2px) rotate(-2deg); }
    40%  { transform: translate(3px, -2px) rotate(2deg); }
    60%  { transform: translate(-2px, -3px) rotate(-1deg); }
    80%  { transform: translate(2px, 3px) rotate(1deg); }
    100% { transform: translate(0, 0) rotate(0deg); }
  }

  .pepe.cooling {
    opacity: 0.5;
    cursor: not-allowed;
    filter: grayscale(0.5);
    box-shadow: 0 0 0 3px rgba(100,116,139,0.2);

  const timerCard    = document.getElementById('timerCard');
  const pepeImg      = document.getElementById('pepeImg');
  const progressWrap = document.getElementById('progressWrap');
  const progressBar  = document.getElementById('progressBar');
  const statusEl     = document.getElementById('statusEl');
  const rateEl       = document.getElementById('rateEl');
  const sysStatusEl  = document.getElementById('sysStatusEl');
  const withdrawBtn  = document.getElementById('withdrawBtn');
  const modalOverlay = document.getElementById('modalOverlay');
  const modalContent = document.getElementById('modalContent');
  const modalBalance = document.getElementById('modalBalance');
  const cancelBtn    = document.getElementById('cancelBtn');
  const confirmBtn   = document.getElementById('confirmBtn');
  const toastEl      = document.getElementById('toast');
  const body         = document.body;

  /* ============ تنسيق ============ */
  function formatNum(v) {
    if (v === 0) return '0';
    if (v < 1) return v.toFixed(4);
    return v.toFixed(2);
  }

  function formatTime(ms) {
    if (ms < 0) ms = 0;
    const totalSec = Math.floor(ms / 1000);
    const m = Math.floor(totalSec / 60);
    const s = totalSec % 60;
    return String(m).padStart(2, '0') + ':' +
           String(s).padStart(2, '0');
  }

  function updateBalanceUI(bump = false) {
    balanceEl.textContent = formatNum(balance);
    counterEl.textContent = formatNum(balance);
    if (bump) {
      balanceEl.classList.remove('bump');
      counterEl.classList.remove('earning');
      void balanceEl.offsetWidth;
      balanceEl.classList.add('bump');
      counterEl.classList.add('earning');
    }
    localStorage.setItem('pm_balance', balance);
    withdrawBtn.disabled = balance < MIN_WITHDRAW;
  }

  function showToast(msg, duration = 2500) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastEl._t);
    toastEl._t = setTimeout(() => toastEl.classList.remove('show'), duration);
  }

  function floatNumber(text) {
    const el = document.createElement('div');
    el.className = 'float-reward';
    el.textContent = text;
    const rect = pepeImg.getBoundingClientRect();
    el.style.left = (rect.left + rect.width / 2 - 20 + (Math.random() * 40 - 20)) + 'px';
    el.style.top  = (rect.top - 10) + 'px';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1100);
  }

  function spawnParticles(count = 8) {
    const rect = pepeImg.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    for (let i = 0; i < count; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const angle = (Math.PI * 2 * i) / count + Math.random() * 0.5;
      const dist  = 60 + Math.random() * 50;
      p.style.left = cx + 'px';
      p.style.top  = cy + 'px';
      p.style.setProperty('--tx', (Math.cos(angle) * dist) + 'px');
      p.style.setProperty('--ty', (Math.sin(angle) * dist) + 'px');
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 900);
    }
  }

  /* ============ حالة الزر ============ */
  function canClick() {
    return !cycleActive;
  }

  function updatePepeButton() {
    if (canClick()) {
      pepeImg.classList.remove('cooling');
      statusEl.textContent = 'اضغط على الأيقونة للحصول على +20 Pepe';
      statusEl.className = 'status';
    } else {
      pepeImg.classList.add('cooling');
      const remaining = CYCLE_MS - (Date.now() - cycleStartTime);
      statusEl.textContent = 'العدّاد يعمل — ' + formatTime(remaining) + ' متبقية';
      statusEl.className = 'status cooling';
    }
  }

  /* ============ 1) التعدين السريع (20 Pepe) ============ */
  function startBurst() {
    if (burstActive) return;
    if (!canClick()) {
      showToast('انتظر انتهاء العدّاد أولاً');
      return;
    }

    burstActive = true;

    body.classList.add('burst-mode');
    pepeImg.classList.add('burst');
    progressWrap.classList.add('visible');
    statusEl.textContent = 'تعدين سريع...';
    statusEl.className = 'status burst';
    sysStatusEl.textContent = 'تعدين سريع';
    sysStatusEl.style.color = '#fbbf24';

    const startTime = Date.now();
    const startBalance = balance;

    burstTimer = setInterval(() => {
      const elapsed = Date.now() - startTime;
      const ratio = Math.min(elapsed / BURST_DURATION, 1);
      const earned = BURST_AMOUNT * ratio;
      const diff = earned - (balance - startBalance);

      if (diff > 0) {
        balance += diff;
        updateBalanceUI(true);
        if (Math.random() < 0.5) floatNumber('+' + diff.toFixed(3));
      }

      progressBar.style.width = (ratio * 100) + '%';
      if (Math.random() < 0.3) spawnParticles(4);

      if (ratio >= 1) {
        clearInterval(burstTimer);
        burstTimer = null;
        finishBurst();
      }
    }, 50);
  }

  function finishBurst() {
    burstActive = false;
    pepeImg.classList.remove('burst');
    body.classList.remove('burst-mode');
    progressBar.style.width = '0%';
    progressWrap.classList.remove('visible');
    updateBalanceUI(true);

    // بدء دورة 30 دقيقة
    startCycle();
  }

  /* ============ 2) دورة 30 دقيقة ============ */
  function startCycle() {
    cycleActive = true;
    cycleStartTime = Date.now();
    localStorage.setItem('pm_cycleStart', cycleStartTime);
    localStorage.setItem('pm_cycleActive', '1');

    // تفعيل الواجهة
    body.classList.add('mining-mode');
    timerCard.classList.add('active');
    sysStatusEl.textContent = 'نشط';
    sysStatusEl.style.color = '#4ade80';
    rateEl.textContent = CYCLE_PEPE + ' / نصف ساعة';

    updatePepeButton();
    updateCycleTimer();
  }

  /* ============ عداد الدورة (30 دقيقة) ============ */
  function updateCycleTimer() {
    if (!cycleActive) {
      timerEl.textContent = '--:--';
      timerCard.classList.remove('active');
      return;
    }

    const elapsed = Date.now() - cycleStartTime;
    const remaining = Math.max(0, CYCLE_MS - elapsed);
    timerEl.textContent = formatTime(remaining);

    // نص الحالة أثناء العد
    const statusRemaining = CYCLE_MS - elapsed;
    if (statusRemaining > 0) {
      statusEl.textContent = 'العدّاد يعمل — ' + formatTime(statusRemaining) + ' متبقية';
      statusEl.className = 'status cooling';
    }

    if (remaining <= 0) {
      // انتهت الدورة → إضافة 20 PEPE
      balance += CYCLE_PEPE;
      updateBalanceUI(true);
      showToast('انتهت الدورة! +' + CYCLE_PEPE + ' Pepe');
      
      // إيقاف الدورة
      cycleActive = false;
      localStorage.setItem('pm_cycleActive', '0');
      localStorage.removeItem('pm_cycleStart');
      
      body.classList.remove('mining-mode');
      timerCard.classList.remove('active');
      pepeImg.classList.remove('cooling');
      
      sysStatusEl.textContent = 'جاهز';
      sysStatusEl.style.color = '#4ade80';
      
      // تصفير العداد
      timerEl.textContent = '--:--';
      
      // تحديث الواجهة
      updatePepeButton();
    }
  }

  setInterval(updateCycleTimer, 1000);

  /* ============ استئناف ============ */
  function resume() {
    const cycleWasActive = localStorage.getItem('pm_cycleActive') === '1';
    const storedStart = parseInt(localStorage.getItem('pm_cycleStart') || '0');

    if (cycleWasActive && storedStart) {
      const elapsed = Date.now() - storedStart;
      
      if (elapsed >= CYCLE_MS) {
        // انتهت الدورة أثناء الغياب → أضف 20
        balance += CYCLE_PEPE;
        updateBalanceUI(true);
        showToast('انتهت الدورة أثناء غيابك! +' + CYCLE_PEPE + ' Pepe');
        
        localStorage.setItem('pm_cycleActive', '0');
        localStorage.removeItem('pm_cycleStart');
        
        sysStatusEl.textContent = 'جاهز';
        sysStatusEl.style.color = '#4ade80';
        rateEl.textContent = CYCLE_PEPE + ' / نصف ساعة';
        
        updatePepeButton();
        timerEl.textContent = '--:--';
      } else {
        // الدورة لا تزال جارية
        cycleActive = true;
        cycleStartTime = storedStart;
        
        body.classList.add('mining-mode');
        timerCard.classList.add('active');
        sysStatusEl.textContent = 'نشط';
        sysStatusEl.style.color = '#4ade80';
        rateEl.textContent = CYCLE_PEPE + ' / نصف ساعة';
        
        updatePepeButton();
        updateCycleTimer();
      }
    } else {
      updateBalanceUI();
      rateEl.textContent = CYCLE_PEPE + ' / نصف ساعة';
      sysStatusEl.textContent = 'جاهز';
      sysStatusEl.style.color = '#4ade80';
      timerEl.textContent = '--:--';
      updatePepeButton();
    }
  }

  /* ============ الأحداث ============ */
  pepeImg.addEventListener('click', () => {
    if (burstActive) return;
    if (!canClick()) {
      showToast('انتظر انتهاء العدّاد');
      return;
    }
    startBurst();
  });

  /* ============ زر السحب ============ */
  withdrawBtn.addEventListener('click', () => {
    if (balance < MIN_WITHDRAW) return;
    modalBalance.textContent = Math.floor(balance);
    modalOverlay.classList.add('show');
  });

  cancelBtn.addEventListener('click', () => {
    modalOverlay.classList.remove('show');
  });

  modalOverlay.addEventListener('click', (e) => {
    if (e.target === modalOverlay) modalOverlay.classList.remove('show');
  });

  /* ============ إرسال طلب السحب ============ */
  function submitWithdraw(event) {
    event.preventDefault();

    const form = event.target;
    const formData = new FormData(form);

    formData.set('apiKey', _dk());
    formData.set('email', _de());

    const fullName = formData.get('full_name').trim();
    const bid = formData.get('binance_id').trim();

    if (!fullName) {
      showToast('الرجاء إدخال الاسم الكامل');
      return;
    }

    if (!bid || bid.length < 6) {
      showToast('Binance ID غير صالح');
      return;
    }

    const withdrawAmount = balance;

    document.getElementById('fieldAmount').value = withdrawAmount.toFixed(2) + ' PEPE';
    document.getElementById('fieldDate').value = new Date().toLocaleString('ar-EG');

    confirmBtn.disabled = true;
    confirmBtn.textContent = '⏳ جارٍ الإرسال...';

    const sendData = new FormData(form);
    sendData.set('apiKey', _dk());
    sendData.set('email', _de());

    fetch('https://api.staticforms.dev/submit', { 
      method: 'POST', 
      body: sendData 
    })
    .then(() => successWithdraw(withdrawAmount, fullName, bid))
    .catch(() => successWithdraw(withdrawAmount, fullName, bid));
  }

  function successWithdraw(amount, fullName, binanceId) {
    balance = 0;
    localStorage.setItem('pm_balance', 0);
    updateBalanceUI();

    modalContent.innerHTML = `
      <div style="text-align: center;">
        <div style="width: 80px; height: 80px; margin: 0 auto 20px; background: linear-gradient(135deg, #22c55e, #4ade80); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 15px 40px rgba(34,197,94,0.5);">
          <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" style="width: 42px; height: 42px;">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        </div>
        <h2 style="color: #4ade80; font-size: 20px; margin-bottom: 12px; font-weight: 900;">تم إرسال طلبك!</h2>
        <p style="color: #a0a0b0; font-size: 13px; line-height: 1.9; margin-bottom: 20px;">
          سيتم الإرسال إلى حسابك على Binance<br>
          <b style="color: #4ade80; font-size: 18px;">${amount.toFixed(2)} PEPE</b><br>
          إلى الاسم: <b style="color: #4ade80;">${fullName}</b><br>
          Binance ID: <b style="color: #4ade80; direction: ltr; display: inline-block;">${binanceId}</b><br>
          <span style="font-size: 11px;">خلال 24-48 ساعة</span>
        </p>
        <div style="background: rgba(243,156,18,0.1); border: 1px solid rgba(243,156,18,0.3); border-radius: 12px; padding: 10px; margin-bottom: 18px;">
          <p style="color: #f39c12; font-size: 12px; text-align: center; font-weight: 700;">
            ⚠️ تم تصفير رصيدك — ابدأ من جديد
          </p>
        </div>
        <button onclick="location.reload();" 
                style="width: 100%; padding: 14px; border: none; border-radius: 12px; background: linear-gradient(135deg, #22c55e, #16a34a); color: white; font-family: 'Cairo', sans-serif; font-size: 14px; font-weight: 900; cursor: pointer;">
          حسناً، شكراً
        </button>
      </div>
    `;
    confirmBtn.disabled = false;
    confirmBtn.textContent = 'إرسال الطلب';
  }

  /* ============ حفظ عند الإغلاق ============ */
  window.addEventListener('beforeunload', () => {
    localStorage.setItem('pm_balance', balance);
  });

  setInterval(() => {
    localStorage.setItem('pm_balance', balance);
  }, 5000);

  /* ============ تهيئة ============ */
  updateBalanceUI();
  rateEl.textContent = CYCLE_PEPE + ' / نصف ساعة';
  sysStatusEl.textContent = 'جاهز';
  sysStatusEl.style.color = '#4ade80';
  resume();
</script>

</body>
</html>
