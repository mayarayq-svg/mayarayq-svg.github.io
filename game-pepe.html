<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بيبي ماینر</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
  body {
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 10%, #14213d 0%, #050810 60%);
    color: #e2e8f0; padding: 16px;
    transition: background 0.6s;
  }
  body.burst { background: radial-gradient(circle at 50% 10%, #14532d 0%, #050810 60%); }
  body.auto  { background: radial-gradient(circle at 50% 10%, #0f3d2e 0%, #050810 60%); }

  .logo {
    font-size: 1.6rem; font-weight: 800; letter-spacing: 5px; margin-bottom: 16px;
    background: linear-gradient(135deg, #4ade80, #15803d);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }

  .card {
    width: 100%; max-width: 380px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 24px; padding: 20px;
    backdrop-filter: blur(14px);
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }

  .balance {
    background: linear-gradient(135deg, rgba(34,197,94,0.12), rgba(34,197,94,0.02));
    border: 1px solid rgba(34,197,94,0.2);
    border-radius: 16px; padding: 12px; text-align: center;
    margin-bottom: 14px;
  }
  .balance-l { font-size: 0.68rem; color: #64748b; letter-spacing: 3px; margin-bottom: 6px; }
  .balance-v {
    font-family: 'Courier New', monospace; font-size: 1.8rem; font-weight: 700;
    color: #4ade80; text-shadow: 0 0 25px rgba(74,222,128,0.6);
    direction: ltr; transition: transform 0.15s;
  }
  .balance-v.bump { transform: scale(1.06); }
  .balance-u { font-size: 0.7rem; color: #64748b; letter-spacing: 3px; margin-top: 4px; }

  .timer {
    display: flex; justify-content: space-between; align-items: center;
    background: rgba(251,191,36,0.06);
    border: 1px solid rgba(251,191,36,0.2);
    border-radius: 14px; padding: 10px 16px; margin-bottom: 14px;
  }
  .timer.ready { background: rgba(34,197,94,0.1); border-color: rgba(34,197,94,0.5); }
  .timer-l { font-size: 0.7rem; color: #94a3b8; letter-spacing: 2px; }
  .timer-v {
    font-family: 'Courier New', monospace; font-size: 1.3rem; font-weight: 700;
    color: #fbbf24; letter-spacing: 2px; direction: ltr;
  }
  .timer.ready .timer-v { color: #4ade80; }

  .stage {
    position: relative; width: 100%; height: 260px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }

  .counter {
    font-family: 'Courier New', monospace; font-size: 2.2rem; font-weight: 700;
    color: #4ade80; text-shadow: 0 0 30px rgba(74,222,128,0.7);
    margin-bottom: 14px; direction: ltr; line-height: 1;
    transition: transform 0.15s;
  }
  .counter.earn { animation: cp 0.15s; }
  @keyframes cp { 50% { transform: scale(1.08); } }

  .wrap { position: relative; width: 170px; height: 170px; display: flex; align-items: center; justify-content: center; }
  .ring { position: absolute; border-radius: 50%; border: 1px solid rgba(34,197,94,0.12); }
  .r1 { width: 160px; height: 160px; }
  .r2 { width: 190px; height: 190px; border-style: dashed; animation: sp 25s linear infinite; }
  .r3 { width: 220px; height: 220px; border-color: rgba(34,197,94,0.06); }
  @keyframes sp { to { transform: rotate(360deg); } }

  .pepe {
    width: 125px; height: 125px; border-radius: 50%;
    cursor: pointer; user-select: none; object-fit: cover;
    z-index: 2; -webkit-tap-highlight-color: transparent;
    box-shadow: 0 0 0 3px rgba(34,197,94,0.25), 0 0 35px rgba(34,197,94,0.4);
    transition: box-shadow 0.3s, filter 0.3s;
  }
  .pepe:hover { filter: brightness(1.15); }
  .pepe.burst {
    animation: sh 0.15s infinite;
    box-shadow: 0 0 0 5px rgba(34,197,94,0.7), 0 0 60px rgba(74,222,128,0.9);
  }
  @keyframes sh {
    0% { transform: translate(0,0); }
    25% { transform: translate(-3px,2px); }
    50% { transform: translate(3px,-2px); }
    75% { transform: translate(-2px,-2px); }
    100% { transform: translate(2px,2px); }
  }
  .pepe.auto {
    animation: br 3s ease-in-out infinite;
    box-shadow: 0 0 0 3px rgba(34,197,94,0.3), 0 0 45px rgba(34,197,94,0.6);
  }
  @keyframes br { 50% { transform: scale(1.03); } }
  .pepe.ready {
    animation: rg 1.2s ease-in-out infinite;
  }
  @keyframes rg {
    0%,100% { box-shadow: 0 0 0 3px rgba(74,222,128,0.5), 0 0 40px rgba(74,222,128,0.8); }
    50% { box-shadow: 0 0 0 8px rgba(74,222,128,0.2), 0 0 70px rgba(74,222,128,1); }
  }

  .prog { width: 100%; max-width: 240px; height: 5px; background: rgba(255,255,255,0.05); border-radius: 10px; overflow: hidden; margin-top: 14px; }
  .prog-b { height: 100%; width: 0%; background: linear-gradient(90deg, #16a34a, #4ade80); border-radius: 10px; transition: width 0.5s linear; }

  .status { font-size: 0.72rem; letter-spacing: 2px; color: #64748b; margin-top: 12px; min-height: 18px; font-weight: 600; }
  .status.active { color: #4ade80; }
  .status.burst { color: #fbbf24; }
  .status.ready { color: #4ade80; animation: bk 1s infinite; }
  @keyframes bk { 50% { opacity: 0.5; } }

  .wd {
    width: 100%; max-width: 380px; padding: 13px; margin-top: 16px;
    font-size: 0.8rem; font-weight: 700; letter-spacing: 2px;
    border: 1px solid rgba(251,191,36,0.3); border-radius: 14px;
    background: linear-gradient(135deg, rgba(251,191,36,0.12), rgba(239,68,68,0.12));
    color: #fbbf24; cursor: pointer; transition: all 0.3s;
  }
  .wd:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(251,191,36,0.2); }
  .wd:disabled { border-color: rgba(100,116,139,0.2); color: #334155; background: rgba(100,116,139,0.05); cursor: not-allowed; }

  .fl {
    position: fixed; color: #4ade80; font-family: 'Courier New', monospace;
    font-weight: 700; font-size: 1rem; pointer-events: none;
    animation: fu 1.1s ease-out forwards; z-index: 99; direction: ltr;
    text-shadow: 0 0 12px rgba(74,222,128,0.9);
  }
  @keyframes fu { to { opacity: 0; transform: translateY(-80px) scale(1.2); } }

  .toast {
    position: fixed; bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: rgba(15,23,42,0.95); border: 1px solid rgba(34,197,94,0.3);
    border-radius: 12px; padding: 11px 20px; color: #e2e8f0;
    font-size: 0.8rem; transition: transform 0.4s; z-index: 200;
    max-width: 90%; text-align: center;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  .modal {
    position: fixed; inset: 0; background: rgba(0,0,0,0.75);
    backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center;
    z-index: 300; opacity: 0; pointer-events: none; transition: opacity 0.3s; padding: 20px;
  }
  .modal.show { opacity: 1; pointer-events: auto; }
  .modal-in {
    background: linear-gradient(135deg, #0f172a, #1e293b);
    border: 1px solid rgba(34,197,94,0.3); border-radius: 20px;
    padding: 24px 20px; width: 100%; max-width: 330px;
    transform: scale(0.9); transition: transform 0.3s;
  }
  .modal.show .modal-in { transform: scale(1); }
  .mt { font-size: 1.1rem; font-weight: 700; text-align: center; margin-bottom: 6px; color: #4ade80; }
  .ms { font-size: 0.72rem; color: #64748b; text-align: center; margin-bottom: 16px; }
  .mi {
    width: 100%; padding: 12px; background: rgba(0,0,0,0.4);
    border: 1px solid rgba(255,255,255,0.1); border-radius: 12px;
    color: #e2e8f0; font-family: 'Courier New', monospace;
    font-size: 1.1rem; text-align: center; letter-spacing: 2px;
    margin-bottom: 14px; outline: none; direction: ltr;
  }
  .mi:focus { border-color: #22c55e; }
  .ma { display: flex; gap: 10px; }
  .btn { flex: 1; padding: 11px; border: none; border-radius: 12px; font-weight: 700; font-size: 0.8rem; cursor: pointer; }
  .bc { background: rgba(100,116,139,0.2); color: #94a3b8; }
  .bo { background: linear-gradient(135deg, #22c55e, #15803d); color: white; }
</style>
</head>
<body>

<div class="logo">بيبي ماینر</div>

<div class="card">
  <div class="balance">
    <div class="balance-l">الرصيد الكلي</div>
    <div class="balance-v" id="bal">0</div>
    <div class="balance-u">PEPE</div>
  </div>

  <div class="timer" id="tCard">
    <div class="timer-l">النصف ساعة القادم</div>
    <div class="timer-v" id="tVal">30:00</div>
  </div>

  <div class="stage">
    <div class="counter" id="cnt">0</div>
    <div class="wrap">
      <div class="ring r1"></div>
      <div class="ring r2"></div>
      <div class="ring r3"></div>
      <img id="pepe" class="pepe ready" src="pepe.png" alt="Pepe"
        onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 200 200%22><circle cx=%22100%22 cy=%22100%22 r=%2295%22 fill=%22%2322c55e%22/><circle cx=%2275%22 cy=%2280%22 r=%2212%22 fill=%22%230a0e1a%22/><circle cx=%22125%22 cy=%2280%22 r=%2212%22 fill=%22%230a0e1a%22/><path d=%22M65 125 Q100 160 135 125%22 stroke=%22%230a0e1a%22 stroke-width=%228%22 fill=%22none%22 stroke-linecap=%22round%22/></svg>'">
    </div>
    <div class="prog"><div class="prog-b" id="pb"></div></div>
    <div class="status ready" id="st">اضغط على Pepe للتعدين</div>
  </div>
</div>

<button class="wd" id="wd" disabled>سحب · الحد الأدنى 100 PEPE</button>

<div class="modal" id="modal">
  <div class="modal-in">
    <div class="mt">طلب سحب</div>
    <div class="ms">أدخل المبلغ (الحد الأدنى 100)</div>
    <input type="number" class="mi" id="mi" placeholder="0.00" step="0.01">
    <div class="ma">
      <button class="btn bc" id="cb">إلغاء</button>
      <button class="btn bo" id="okb">تأكيد</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  /* ===== الإعدادات ===== */
  const BURST = 10;              // كمية التعدين اليدوي
  const BURST_MS = 5000;         // مدة الانفجار
  const AUTO_TOTAL = 10;         // إجمالي التعدين التلقائي
  const HALF_HOUR = 1800000;     // 30 دقيقة
  const AUTO_PER_MS = AUTO_TOTAL / HALF_HOUR;
  const MIN_WD = 100;

  /* ===== الحالة ===== */
  let balance = parseFloat(localStorage.getItem('p_bal') || '0');
  let cycleStart = parseInt(localStorage.getItem('p_cycle') || '0');
  let manualReady = localStorage.getItem('p_manual') !== '0';
  let bursting = false, autoMining = false;
  let autoT = null, uiT = null, lastTick = Date.now();

  /* ===== العناصر ===== */
  const balEl = document.getElementById('bal');
  const cntEl = document.getElementById('cnt');
  const tVal = document.getElementById('tVal');
  const tCard = document.getElementById('tCard');
  const pepe = document.getElementById('pepe');
  const pb = document.getElementById('pb');
  const st = document.getElementById('st');
  const wd = document.getElementById('wd');
  const modal = document.getElementById('modal');
  const mi = document.getElementById('mi');
  const cb = document.getElementById('cb');
  const okb = document.getElementById('okb');
  const toast = document.getElementById('toast');
  const body = document.body;

  /* ===== أدوات ===== */
  const fmt = v => v === 0 ? '0' : (v < 1 ? v.toFixed(4) : v.toFixed(2));
  const fmtT = ms => {
    if (ms < 0) ms = 0;
    const s = Math.ceil(ms / 1000);
    return String(Math.floor(s / 60)).padStart(2,'0') + ':' + String(s % 60).padStart(2,'0');
  };

  function updateUI(bump = false) {
    balEl.textContent = fmt(balance);
    cntEl.textContent = fmt(balance);
    if (bump) {
      balEl.classList.remove('bump'); cntEl.classList.remove('earn');
      void balEl.offsetWidth;
      balEl.classList.add('bump'); cntEl.classList.add('earn');
    }
    localStorage.setItem('p_bal', balance);
    wd.disabled = balance < MIN_WD;
  }

  function showToast(msg, d = 2500) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => toast.classList.remove('show'), d);
  }

  function float(text) {
    const el = document.createElement('div');
    el.className = 'fl';
    el.textContent = text;
    const r = pepe.getBoundingClientRect();
    el.style.left = (r.left + r.width/2 - 20 + (Math.random()*40-20)) + 'px';
    el.style.top  = (r.top - 10) + 'px';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1100);
  }

  /* ===== 1) التعدين اليدوي (متاح من البداية) ===== */
  function startBurst() {
    if (bursting || autoMining || !manualReady) return;
    bursting = true;
    manualReady = false;
    localStorage.setItem('p_manual', '0');

    body.classList.add('burst');
    pepe.classList.remove('auto', 'ready');
    pepe.classList.add('burst');
    st.textContent = 'تعدين سريع...';
    st.className = 'status burst';

    const start = Date.now();
    const startBal = balance;

    const t = setInterval(() => {
      const el = Date.now() - start;
      const ratio = Math.min(el / BURST_MS, 1);
      const target = BURST * ratio;
      const diff = target - (balance - startBal);

      if (diff > 0) {
        balance += diff;
        updateUI(true);
        if (Math.random() < 0.5) float('+' + diff.toFixed(3));
      }
      pb.style.width = (ratio * 100) + '%';

      if (ratio >= 1) {
        clearInterval(t);
        finishBurst();
      }
    }, 50);
  }

  function finishBurst() {
    bursting = false;
    pepe.classList.remove('burst');
    body.classList.remove('burst');
    pb.style.width = '0%';
    updateUI(true);
    showToast('تم تعدين 10 Pepe');
    setTimeout(startAuto, 400);
  }

  /* ===== 2) التعدين التلقائي (10 Pepe / 30 دقيقة) ===== */
  function startAuto() {
    if (autoMining) return;
    autoMining = true;

    if (!cycleStart) {
      cycleStart = Date.now();
      localStorage.setItem('p_cycle', cycleStart);
    }

    body.classList.add('auto');
    pepe.classList.add('auto');
    pepe.classList.remove('ready');
    st.textContent = 'التعدين التلقائي نشط';
    st.className = 'status active';
    lastTick = Date.now();

    autoT = setInterval(() => {
      const now = Date.now();
      const dt = now - lastTick;
      lastTick = now;

      const elapsed = now - cycleStart;
      const ratio = Math.min(elapsed / HALF_HOUR, 1);

      const earned = AUTO_PER_MS * dt;
      balance += earned;
      updateUI(true);

      if (Math.random() < 0.35) float('+' + earned.toFixed(5));

      pb.style.width = (ratio * 100) + '%';

      if (ratio >= 1) finishCycle();
    }, 1000);

    updateTimer();
  }

  /* ===== نهاية الدورة ===== */
  function finishCycle() {
    if (autoT) { clearInterval(autoT); autoT = null; }
    autoMining = false;
    body.classList.remove('auto');
    pepe.classList.remove('auto');
    pb.style.width = '100%';

    manualReady = true;
    localStorage.setItem('p_manual', '1');
    cycleStart = 0;
    localStorage.removeItem('p_cycle');

    st.textContent = 'اضغط على Pepe للتعدين';
    st.className = 'status ready';
    pepe.classList.add('ready');

    tVal.textContent = '00:00';
    tCard.classList.add('ready');
    setTimeout(() => tCard.classList.remove('ready'), 3000);

    showToast('انتهى النصف ساعة! اضغط على Pepe');
  }

  /* ===== العداد ===== */
  function updateTimer() {
    if (!cycleStart) { tVal.textContent = '00:00'; return; }
    const el = Date.now() - cycleStart;
    tVal.textContent = fmtT(Math.max(0, HALF_HOUR - el));
  }

  /* ===== استئناف ===== */
  function resume() {
    if (cycleStart) {
      const el = Date.now() - cycleStart;
      if (el >= HALF_HOUR) {
        // انتهت أثناء الغياب → امنح الباقي
        const earned = parseFloat(localStorage.getItem('p_cycleEarned') || '0');
        const remaining = Math.max(0, AUTO_TOTAL - earned);
        balance += remaining;
        updateUI();
        manualReady = true;
        localStorage.setItem('p_manual', '1');
        cycleStart = 0;
        localStorage.removeItem('p_cycle');
        pepe.classList.add('ready');
        st.textContent = 'اضغط على Pepe للتعدين';
        st.className = 'status ready';
        tVal.textContent = '00:00';
      } else {
        startAuto();
      }
    } else {
      manualReady = true;
      pepe.classList.add('ready');
      st.textContent = 'اضغط على Pepe للتعدين';
      st.className = 'status ready';
      updateUI();
    }
  }

  /* ===== الأحداث ===== */
  pepe.addEventListener('click', () => {
    if (bursting) return;
    if (autoMining) {
      st.textContent = 'التعدين التلقائي شغال';
      setTimeout(() => {
        if (autoMining) { st.textContent = 'التعدين التلقائي نشط'; st.className = 'status active'; }
      }, 1500);
      return;
    }
    if (manualReady) startBurst();
  });

  wd.addEventListener('click', () => {
    if (balance < MIN_WD) return;
    mi.value = Math.floor(balance);
    modal.classList.add('show');
    setTimeout(() => mi.focus(), 300);
  });
  cb.addEventListener('click', () => modal.classList.remove('show'));
  modal.addEventListener('click', e => { if (e.target === modal) modal.classList.remove('show'); });
  okb.addEventListener('click', () => {
    const v = parseFloat(mi.value);
    if (!v || v < MIN_WD) { showToast('الحد الأدنى ' + MIN_WD); return; }
    if (v > balance) { showToast('الرصيد غير كافٍ'); return; }
    balance -= v;
    updateUI(true);
    modal.classList.remove('show');
    showToast('تم طلب سحب ' + v.toFixed(2));
  });

  window.addEventListener('beforeunload', () => {
    localStorage.setItem('p_bal', balance);
  });

  /* ===== تشغيل ===== */
  updateUI();
  resume();
  uiT = setInterval(updateTimer, 1000);
</script>
</body>
</html>
