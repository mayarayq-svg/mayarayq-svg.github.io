<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a15">
    <title>لعبة الفضاء | PAID PLUS</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; font-family: 'Cairo', sans-serif; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #000; touch-action: none; position: fixed; overscroll-behavior: none; }
        #gameCanvas { display: block; width: 100%; height: 100%; background: #000; position: fixed; top: 0; left: 0; touch-action: none; }

        .back-btn {
            position: fixed; top: 12px; right: 12px; z-index: 100; color: #fff; text-decoration: none;
            font-size: 12px; font-weight: 800; padding: 8px 16px;
            background: linear-gradient(135deg, rgba(106,17,203,0.85), rgba(37,117,252,0.85));
            border-radius: 20px; backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 8px 25px rgba(106,17,203,0.4); display: flex; align-items: center; gap: 5px;
        }
        .back-btn:active { transform: scale(0.94); }
        .back-btn svg { width: 14px; height: 14px; }

        .fullscreen-btn {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 100;
            display: flex; align-items: center; gap: 8px;
            background: linear-gradient(135deg, #26a17b, #2ecc71); color: #fff; border: none;
            padding: 13px 26px; border-radius: 26px; font-family: 'Cairo', sans-serif;
            font-size: 13px; font-weight: 900; cursor: pointer;
            box-shadow: 0 12px 35px rgba(38,161,123,0.55); border: 1px solid rgba(255,255,255,0.25);
        }
        .fullscreen-btn:active { transform: translateX(-50%) scale(0.94); }
        .fullscreen-btn svg { width: 16px; height: 16px; }

        @media (max-width: 500px) {
            .fullscreen-btn { padding: 11px 22px; font-size: 12px; bottom: 16px; }
        }

        @media (orientation: landscape) and (max-height: 500px) {
            .fullscreen-btn { display: none !important; }
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <a href="games.html" class="back-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>
        </svg>
        الألعاب
    </a>

    <button class="fullscreen-btn" id="fullscreenBtn" onclick="toggleFullscreen()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
        </svg>
        ملء الشاشة
    </button>

    <script>
        /* ============================================
           الإعدادات
        ============================================ */
        const KILL_POINTS = 1;
        const BOSS_KILL_POINTS = 15;
        const BOSS_BONUS_POINTS = 50;
        const ENEMIES_PER_BOSS = 25;
        const MAX_LEVEL = 10;

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        let DPR = Math.min(window.devicePixelRatio || 1, 2);
        let viewWidth = window.innerWidth;
        let viewHeight = window.innerHeight;

        /* ============================================
           الخلفيات المتغيرة حسب المستوى
        ============================================ */
        const BACKGROUNDS = [
            { name: 'فضاء',   colors: ['#0a0020', '#1a0040', '#2d1b4e'], stars: '#ffffff', nebula: 'rgba(106,17,203,0.15)' },
            { name: 'مجرى',   colors: ['#001a2e', '#003366', '#005a8a'], stars: '#aaccff', nebula: 'rgba(37,117,252,0.2)' },
            { name: 'غروب',   colors: ['#2e0010', '#4a0020', '#6b0030'], stars: '#ffccaa', nebula: 'rgba(231,76,60,0.2)' },
            { name: 'زمرد',   colors: ['#001a10', '#003020', '#004a30'], stars: '#aaffcc', nebula: 'rgba(46,204,113,0.2)' },
            { name: 'بنفسج',  colors: ['#1a0030', '#2d0050', '#400070'], stars: '#ddaaff', nebula: 'rgba(155,89,182,0.25)' },
            { name: 'جهنمي',  colors: ['#2e0000', '#4a0000', '#6b1010'], stars: '#ffaaaa', nebula: 'rgba(231,76,60,0.3)' },
            { name: 'جليد',   colors: ['#001a2e', '#003a5e', '#005a8e'], stars: '#ccffff', nebula: 'rgba(52,152,219,0.25)' },
            { name: 'ذهبي',   colors: ['#2e1a00', '#4a2e00', '#6b4500'], stars: '#ffeeaa', nebula: 'rgba(243,156,18,0.25)' },
            { name: 'ظلام',   colors: ['#050505', '#0a0a15', '#151520'], stars: '#8888aa', nebula: 'rgba(106,17,203,0.15)' },
            { name: 'أسطوري', colors: ['#1a0020', '#300040', '#500060'], stars: '#ff88ff', nebula: 'rgba(255,0,255,0.2)' }
        ];

        const enemyImg = new Image();
        let enemyLoaded = false;
        enemyImg.onload = () => { enemyLoaded = true; };
        enemyImg.src = 'USDX.png';

        const bossImg = new Image();
        let bossLoaded = false;
        bossImg.onload = () => { bossLoaded = true; };
        bossImg.src = 'USDTX.png';

        /* ============================================
           النقاط (بدون USDT)
        ============================================ */
        let score = 0;
        let displayedScore = 0;
        let bestScore = parseInt(localStorage.getItem('spaceHighScore') || '0');
        let level = 1;

        const shipHP = { current: 100, max: 100, hitFlash: 0, invulnerable: 0 };

        /* ============================================
           الأصوات
        ============================================ */
        const audioPool = { sounds: [], poolSize: 4, currentIndex: 0, ready: false };
        function initAudio() {
            for (let i = 0; i < audioPool.poolSize; i++) {
                const a = new Audio();
                a.src = 'XS1.mp3';
                a.preload = 'auto';
                a.volume = 0.3;
                audioPool.sounds.push(a);
            }
            audioPool.ready = true;
        }
        function playShootSound() {
            if (!audioPool.ready) return;
            try {
                const a = audioPool.sounds[audioPool.currentIndex];
                a.currentTime = 0;
                const p = a.play();
                if (p) p.catch(() => {});
                audioPool.currentIndex = (audioPool.currentIndex + 1) % audioPool.poolSize;
            } catch (e) {}
        }

        const bossFireSound = new Audio('XS3.mp3');
        bossFireSound.preload = 'auto';
        bossFireSound.volume = 0.4;

        const bossDeathSound = new Audio('XS2.mp3');
        bossDeathSound.preload = 'auto';
        bossDeathSound.volume = 0.6;

        const enemyFireSound = new Audio('XS3.mp3');
        enemyFireSound.preload = 'auto';
        enemyFireSound.volume = 0.1;

        function playBossFireSound() { try { bossFireSound.currentTime = 0; const p = bossFireSound.play(); if (p) p.catch(() => {}); } catch (e) {} }
        function playBossDeathSound() { try { bossDeathSound.currentTime = 0; const p = bossDeathSound.play(); if (p) p.catch(() => {}); } catch (e) {} }
        function playEnemyFireSound() { try { enemyFireSound.currentTime = 0; const p = enemyFireSound.play(); if (p) p.catch(() => {}); } catch (e) {} }

        let audioUnlocked = false;
        function unlockAudio() { if (audioUnlocked) return; audioUnlocked = true; initAudio(); }

        /* ============================================
           المركبات
        ============================================ */
        const SHIPS_DATA = [
            { imgSrc: 'X1.png', glowColor: '#00aaff', coreColor: '#00ffff', bulletType: 'rect', preview: null, loaded: false },
            { imgSrc: 'X2.png', glowColor: '#aabbcc', coreColor: '#ffffff', bulletType: 'rect', preview: null, loaded: false },
            { imgSrc: 'X3.png', glowColor: '#00aa44', coreColor: '#00ff88', bulletType: 'rect', preview: null, loaded: false },
            { imgSrc: 'X4.png', glowColor: '#cc0000', coreColor: '#ff3333', bulletType: 'triangle', preview: null, loaded: false },
            { imgSrc: 'X5.png', glowColor: '#ffffff', coreColor: '#ffffff', bulletType: 'rect', preview: null, loaded: false },
            { imgSrc: 'X6.png', glowColor: '#ffcc00', coreColor: '#ffee88', bulletType: 'rect', preview: null, loaded: false }
        ];

        let selectedShipIndex = 0;
        let gameState = 'select';
        let shipImg = new Image();
        let imageLoaded = false;

        const ship = {
            x: 0, y: 0, width: 100, height: 50,
            targetX: 0, targetY: 0,
            recoil: 0, glow: 0, angle: 0,
            vx: 0, vy: 0, shake: 0
        };

        let arena = { x: 0, y: 0, width: 0, height: 0 };

        let scrollY = 0, scrollTargetY = 0, scrollVelocity = 0;
        let isDragging = false, dragTouchId = null, dragStartY = 0, dragStartScrollY = 0;
        let lastDragY = 0, lastDragTime = 0, dragMoved = false;

        let isChargingOrb = false, chargeTouchId = null, chargeStartX = 0, chargeCurrentX = 0;
        let chargeSpeed = 0, lastChargeX = 0, lastChargeTime = 0;

        let shipSpacing = 0, selectShipSize = 0, selectLeftX = 0, selectCenterY = 0;
        let startButton = { x: 0, y: 0, width: 0, height: 0 };

        const bullets = [];
        const enemyBullets = [];
        const powerOrbs = [];
        const particles = [];
        const muzzleFades = [];
        const stars = [];
        const smokeParticles = [];
        const enemies = [];
        const explosions = [];
        const scorePopups = [];

        let enemySpawnTimer = 0;
        let enemySpawnInterval = 60;
        let bossActive = false;
        let gameTime = 0;

        const leftTouch = { active: false, id: null, x: 0, y: 0 };
        const rightTouch = { active: false, id: null };
        let fireInterval = null;

        /* ============================================
           السرعة والسلاسة
        ============================================ */
        const SHIP_FOLLOW_SPEED = 0.35;   // سرعة متابعة المركبة للهدف
        const SHIP_MAX_SPEED = 22;        // أقصى سرعة في الإطار
        const BULLET_SPEED = 26;          // سرعة الرصاصة
        const ORB_SPEED = 20;             // سرعة الكرة الطاقية

        /* ============================================
           تحديث حجم المركبة
        ============================================ */
        function updateShipSize() {
            if (!imageLoaded) return;
            const targetWidth = Math.min(arena.width * 0.13, arena.height * 1.0);
            const aspect = shipImg.width / shipImg.height;
            ship.width = targetWidth;
            ship.height = targetWidth / aspect;
        }

        function resizeCanvas() {
            viewWidth = window.innerWidth;
            viewHeight = window.innerHeight;

            canvas.width = viewWidth * DPR;
            canvas.height = viewHeight * DPR;
            canvas.style.width = viewWidth + 'px';
            canvas.style.height = viewHeight + 'px';

            ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'low';

            arena.x = 0;
            arena.width = viewWidth;
            arena.height = viewHeight;
            arena.y = 0;

            selectShipSize = Math.min(arena.width * 0.18, arena.height * 0.25);
            shipSpacing = selectShipSize * 1.7;
            selectLeftX = arena.x + arena.width * 0.07;
            selectCenterY = arena.y + arena.height / 2;

            const btnWidth = Math.min(arena.width * 0.28, 180);
            const btnHeight = Math.min(arena.height * 0.28, 55);
            startButton = {
                x: arena.x + arena.width * 0.65 + (arena.width * 0.28 - btnWidth) / 2,
                y: arena.y + (arena.height - btnHeight) / 2,
                width: btnWidth,
                height: btnHeight
            };

            if (gameState === 'select') {
                ship.x = arena.x + arena.width / 2;
                ship.y = arena.y + arena.height / 2;
                ship.targetX = ship.x;
                ship.targetY = ship.y;
            } else {
                ship.x = Math.min(ship.x, arena.width - ship.width / 2);
                ship.y = Math.min(ship.y, arena.height - ship.height / 2);
                ship.targetX = Math.min(ship.targetX, arena.width - ship.width / 2);
                ship.targetY = Math.min(ship.targetY, arena.height - ship.height / 2);
            }

            updateShipSize();
        }

        SHIPS_DATA.forEach((data, index) => {
            const img = new Image();
            img.onload = () => {
                data.preview = img;
                data.loaded = true;
                if (index === selectedShipIndex) {
                    shipImg = img;
                    imageLoaded = true;
                    updateShipSize();
                }
            };
            img.src = data.imgSrc;
        });

        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 150));

        function toggleFullscreen() {
            const el = document.documentElement;
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
                else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
                if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {});
            } else {
                if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
            }
        }

        function getTouchPos(touch) {
            const rect = canvas.getBoundingClientRect();
            return { x: touch.clientX - rect.left, y: touch.clientY - rect.top };
        }

        function handleTouchStart(pos, id) {
            if (gameState === 'select') {
                if (pos.x >= startButton.x && pos.x <= startButton.x + startButton.width &&
                    pos.y >= startButton.y && pos.y <= startButton.y + startButton.height) {
                    startGame();
                    return;
                }
                isDragging = true; dragTouchId = id; dragStartY = pos.y; dragStartScrollY = scrollTargetY;
                lastDragY = pos.y; lastDragTime = Date.now(); dragMoved = false; scrollVelocity = 0;
            } else if (gameState === 'playing') {
                if (pos.x < viewWidth / 2) {
                    if (!leftTouch.active) {
                        leftTouch.active = true;
                        leftTouch.id = id;
                        leftTouch.x = pos.x;
                        leftTouch.y = pos.y;
                        ship.targetX = Math.max(arena.x + ship.width / 2, Math.min(arena.x + arena.width - ship.width / 2, pos.x));
                        ship.targetY = Math.max(arena.y + ship.height / 2, Math.min(arena.y + arena.height - ship.height / 2, pos.y));
                    }
                } else {
                    if (!rightTouch.active) {
                        rightTouch.active = true;
                        rightTouch.id = id;
                        fireBullet();
                        fireInterval = setInterval(fireBullet, 110);
                    }
                    isChargingOrb = true;
                    chargeTouchId = id;
                    chargeStartX = pos.x;
                    chargeCurrentX = pos.x;
                    lastChargeX = pos.x;
                    lastChargeTime = Date.now();
                    chargeSpeed = 0;
                }
            } else if (gameState === 'gameover') {
                // إعادة اللعب عند اللمس
                if (Date.now() - gameOverTime > 800) {
                    resetGame();
                }
            }
        }

        function handleTouchMove(pos, id) {
            if (gameState === 'select' && isDragging && id === dragTouchId) {
                const dy = pos.y - dragStartY;
                if (Math.abs(dy) > 5) dragMoved = true;
                scrollTargetY = dragStartScrollY + dy;
                const now = Date.now();
                const dt = now - lastDragTime;
                if (dt > 0) scrollVelocity = (pos.y - lastDragY) / dt;
                lastDragY = pos.y; lastDragTime = now;
            } else if (gameState === 'playing') {
                if (id === leftTouch.id) {
                    leftTouch.x = pos.x;
                    leftTouch.y = pos.y;
                    ship.targetX = Math.max(arena.x + ship.width / 2, Math.min(arena.x + arena.width - ship.width / 2, pos.x));
                    ship.targetY = Math.max(arena.y + ship.height / 2, Math.min(arena.y + arena.height - ship.height / 2, pos.y));
                }
                if (isChargingOrb && id === chargeTouchId) {
                    const now = Date.now();
                    const dt = now - lastChargeTime;
                    if (dt > 0) chargeSpeed = (pos.x - lastChargeX) / dt;
                    lastChargeX = pos.x; lastChargeTime = now; chargeCurrentX = pos.x;
                    if (chargeSpeed > 0.8 && chargeCurrentX - chargeStartX > 40) {
                        firePowerOrb();
                        isChargingOrb = false;
                    }
                }
            }
        }

        function handleTouchEnd(id) {
            if (gameState === 'select' && id === dragTouchId) {
                isDragging = false; dragTouchId = null;
                if (dragMoved) scrollTargetY += scrollVelocity * 100;
                alignToNearest();
            }
            if (id === leftTouch.id) { leftTouch.active = false; leftTouch.id = null; }
            if (id === rightTouch.id) {
                rightTouch.active = false; rightTouch.id = null;
                if (fireInterval) { clearInterval(fireInterval); fireInterval = null; }
            }
            if (id === chargeTouchId) { isChargingOrb = false; chargeTouchId = null; }
        }

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            unlockAudio();
            for (let i = 0; i < e.changedTouches.length; i++) {
                handleTouchStart(getTouchPos(e.changedTouches[i]), e.changedTouches[i].identifier);
            }
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            for (let i = 0; i < e.changedTouches.length; i++) {
                handleTouchMove(getTouchPos(e.changedTouches[i]), e.changedTouches[i].identifier);
            }
        }, { passive: false });

        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            for (let i = 0; i < e.changedTouches.length; i++) {
                handleTouchEnd(e.changedTouches[i].identifier);
            }
        }, { passive: false });

        canvas.addEventListener('touchcancel', (e) => {
            e.preventDefault();
            for (let i = 0; i < e.changedTouches.length; i++) {
                handleTouchEnd(e.changedTouches[i].identifier);
            }
        }, { passive: false });

        canvas.addEventListener('mousedown', (e) => {
            unlockAudio();
            const rect = canvas.getBoundingClientRect();
            handleTouchStart({ x: e.clientX - rect.left, y: e.clientY - rect.top }, 'mouse');
        });
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const pos = { x: e.clientX - rect.left, y: e.clientY - rect.top };
            if (isDragging || isChargingOrb || leftTouch.active) handleTouchMove(pos, 'mouse');
        });
        canvas.addEventListener('mouseup', () => handleTouchEnd('mouse'));

        function alignToNearest() {
            let idx = Math.round(-scrollTargetY / shipSpacing);
            idx = Math.max(0, Math.min(5, idx));
            selectedShipIndex = idx;
            scrollTargetY = -idx * shipSpacing;
            const data = SHIPS_DATA[idx];
            if (data.loaded) { shipImg = data.preview; imageLoaded = true; updateShipSize(); }
        }

        let gameOverTime = 0;

        function startGame() {
            gameState = 'playing';
            ship.x = selectLeftX + selectShipSize / 2;
            ship.y = selectCenterY;
            ship.targetX = ship.x;
            ship.targetY = ship.y;
            ship.recoil = 0; ship.glow = 0; ship.shake = 0;
            ship.angle = 0; ship.vx = 0; ship.vy = 0;

            bullets.length = 0; enemyBullets.length = 0; powerOrbs.length = 0;
            particles.length = 0; muzzleFades.length = 0;
            enemies.length = 0; explosions.length = 0; smokeParticles.length = 0;
            scorePopups.length = 0;

            enemySpawnTimer = 0;
            enemySpawnInterval = 60;
            bossActive = false;
            score = 0;
            displayedScore = 0;
            level = 1;
            gameTime = 0;
            shipHP.current = shipHP.max;
            shipHP.hitFlash = 0; shipHP.invulnerable = 0;
        }

        function resetGame() {
            startGame();
        }

        /* ============================================
           صعوبة متزايدة حسب المستوى والوقت
        ============================================ */
        function getDifficultyMultiplier() {
            return 1 + (level - 1) * 0.18;
        }

        function updateLevel() {
            const newLevel = Math.min(MAX_LEVEL, 1 + Math.floor(score / 10));
            if (newLevel > level) {
                level = newLevel;
                // زيادة الصعوبة
                enemySpawnInterval = Math.max(22, 60 - (level - 1) * 4);
            }
        }

        /* ============================================
           إنشاء الأعداء
        ============================================ */
        function spawnEnemy() {
            if (!enemyLoaded) return;
            const diff = getDifficultyMultiplier();
            const targetWidth = Math.min(arena.width * 0.075, 50);
            const aspect = enemyImg.width / enemyImg.height;
            const w = targetWidth;
            const h = w / aspect;
            enemies.push({
                x: arena.width + w / 2,
                y: h / 2 + Math.random() * (arena.height - h),
                size: w, width: w, height: h,
                speed: (2.2 + Math.random() * 1.8) * diff,
                hp: 1, maxHp: 1, hitFlash: 0, isBoss: false,
                vx: 0, vy: 0,
                shootTimer: 100 + Math.floor(Math.random() * 120),
                shootCooldown: Math.max(70, 160 - (level - 1) * 8)
            });
        }

        function spawnBoss() {
            if (!bossLoaded) return;
            const targetWidth = Math.min(arena.width * 0.32, 180);
            const aspect = bossImg.width / bossImg.height;
            const w = targetWidth;
            const h = w / aspect;
            enemies.push({
                x: arena.width + w / 2, y: arena.height / 2,
                size: w, width: w, height: h,
                speed: 0.5, hp: 15 + level * 3, maxHp: 15 + level * 3,
                hitFlash: 0, isBoss: true, isBonusBoss: false,
                movePhase: 0, moveTimer: 0, baseY: arena.height / 2,
                shootTimer: 50, shootCooldown: Math.max(30, 60 - level * 3),
                stopped: false, stopX: arena.width * 0.7, recoil: 0
            });
            bossActive = true;
        }

        function spawnSoldiersFromBoss(bx, by) {
            const count = 6 + Math.min(6, level);
            for (let i = 0; i < count; i++) {
                const angle = (i / count) * Math.PI * 2;
                const targetWidth = Math.min(arena.width * 0.075, 50);
                const aspect = enemyImg.width / enemyImg.height;
                const w = targetWidth;
                const h = w / aspect;
                enemies.push({
                    x: bx, y: by, size: w, width: w, height: h,
                    speed: 2 + Math.random() * 1.5, hp: 1, maxHp: 1,
                    hitFlash: 0, isBoss: false, isBonusBoss: false,
                    vx: Math.cos(angle) * 3, vy: Math.sin(angle) * 3,
                    spreadTimer: 40, shootTimer: 150, shootCooldown: 150
                });
            }
        }

        function fireBullet() {
            const data = SHIPS_DATA[selectedShipIndex];
            const mx = ship.x + ship.width / 2 - 8;
            const my = ship.y;
            playShootSound();

            if (data.bulletType === 'triangle') {
                bullets.push({ x: mx, y: my, vx: BULLET_SPEED, vy: (Math.random() - 0.5) * 0.3, life: 200, maxLife: 200, size: 6, type: 'triangle' });
            } else {
                bullets.push({ x: mx, y: my, vx: BULLET_SPEED, vy: (Math.random() - 0.5) * 0.3, life: 200, maxLife: 200, width: 12, height: 3, type: 'rect' });
            }

            muzzleFades.push({ x: mx, y: my, radius: 5, maxRadius: 30, life: 10, maxLife: 10, color: data.glowColor, coreColor: data.coreColor });

            for (let i = 0; i < 2; i++) {
                const angle = (Math.random() - 0.5) * Math.PI * 0.9;
                const speed = 3 + Math.random() * 5;
                particles.push({ x: mx, y: my, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, life: 10, maxLife: 10, size: 1.2, color: data.glowColor });
            }

            ship.recoil = 12;
            ship.glow = 0.6;
            ship.shake = 1.5;
        }

        function firePowerOrb() {
            const data = SHIPS_DATA[selectedShipIndex];
            const mx = ship.x + ship.width / 2 - 8;
            const my = ship.y;
            playShootSound();
            powerOrbs.push({ x: mx, y: my, vx: ORB_SPEED, vy: 0, life: 200, maxLife: 200, radius: 6, maxRadius: 35, growth: 0.35 });
            muzzleFades.push({ x: mx, y: my, radius: 8, maxRadius: 55, life: 15, maxLife: 15, color: data.glowColor, coreColor: '#ffffff' });
            ship.recoil = 20;
            ship.glow = 1.2;
            ship.shake = 5;
        }

        function bossFire(enemy) {
            playBossFireSound();
            enemy.recoil = 15;
            const bulletsCount = 3 + Math.min(4, Math.floor(level / 2));
            for (let i = 0; i < bulletsCount; i++) {
                const dx = ship.x - enemy.x;
                const dy = ship.y - enemy.y;
                const angle = Math.atan2(dy, dx) + (i - (bulletsCount - 1) / 2) * 0.15;
                const speed = 7 + level * 0.3;
                enemyBullets.push({
                    x: enemy.x - (enemy.width || enemy.size) * 0.3,
                    y: enemy.y + (i - (bulletsCount - 1) / 2) * 12,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: 200, maxLife: 200, width: 16, height: 4, isBossBullet: true
                });
            }
        }

        function enemyFire(enemy) {
            playEnemyFireSound();
            const dx = ship.x - enemy.x;
            const dy = ship.y - enemy.y;
            const angle = Math.atan2(dy, dx);
            const speed = 5 + level * 0.2;
            enemyBullets.push({
                x: enemy.x - enemy.size * 0.3, y: enemy.y,
                vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
                life: 200, maxLife: 200, width: 10, height: 3, isBossBullet: false
            });
        }

        /* ============================================
           التحديث
        ============================================ */
        let lastFrameTime = performance.now();

        function update(now) {
            const dt = Math.min((now - lastFrameTime) / 16.67, 3);
            lastFrameTime = now;

            for (let i = 0; i < stars.length; i++) {
                const s = stars[i];
                s.x -= s.speed * dt;
                if (s.x < 0) { s.x = viewWidth; s.y = Math.random() * viewHeight; }
            }

            for (let i = smokeParticles.length - 1; i >= 0; i--) {
                const p = smokeParticles[i];
                p.x -= p.vx * dt;
                p.life -= dt;
                p.size += 0.3 * dt;
                if (p.life <= 0) smokeParticles.splice(i, 1);
            }
            if (Math.random() < 0.3 && smokeParticles.length < 10) {
                smokeParticles.push({
                    x: viewWidth + 50, y: Math.random() * viewHeight,
                    vx: 0.5 + Math.random() * 0.8,
                    size: 40 + Math.random() * 60,
                    life: 200 + Math.random() * 200, maxLife: 400,
                    alpha: 0.08 + Math.random() * 0.08
                });
            }

            for (let i = muzzleFades.length - 1; i >= 0; i--) {
                const f = muzzleFades[i];
                f.life -= dt;
                const progress = 1 - (f.life / f.maxLife);
                f.radius = 5 + (f.maxRadius - 5) * progress;
                if (f.life <= 0) muzzleFades.splice(i, 1);
            }

            displayedScore += (score - displayedScore) * 0.18;

            if (shipHP.hitFlash > 0) shipHP.hitFlash -= dt;
            if (shipHP.invulnerable > 0) shipHP.invulnerable -= dt;

            for (let i = scorePopups.length - 1; i >= 0; i--) {
                const sp = scorePopups[i];
                sp.y -= 1.5 * dt;
                sp.life -= dt;
                if (sp.life <= 0) scorePopups.splice(i, 1);
            }

            if (gameState === 'select') {
                const easing = isDragging ? 0.35 : 0.15;
                scrollY += (scrollTargetY - scrollY) * easing;
                return;
            }

            if (gameState !== 'playing') return;

            gameTime += dt;
            updateLevel();

            enemySpawnTimer += dt;
            if (enemySpawnTimer >= enemySpawnInterval && !bossActive) {
                enemySpawnTimer = 0;
                spawnEnemy();
                // زيادة تدريجية للصعوبة
                if (enemySpawnInterval > 22) enemySpawnInterval -= 0.25;
            }

            /* ============================================
               متابعة سلسة وسريعة للمركبة
            ============================================ */
            if (leftTouch.active) {
                const dx = ship.targetX - ship.x;
                const dy = ship.targetY - ship.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                // سرعة متكيفة مع المسافة
                let speed = SHIP_FOLLOW_SPEED;
                if (dist > 100) speed = 0.55;
                else if (dist > 30) speed = 0.45;
                else speed = 0.35;

                const stepX = dx * speed * dt;
                const stepY = dy * speed * dt;

                // تقييد السرعة القصوى
                const stepDist = Math.sqrt(stepX * stepX + stepY * stepY);
                if (stepDist > SHIP_MAX_SPEED) {
                    const ratio = SHIP_MAX_SPEED / stepDist;
                    ship.x += stepX * ratio;
                    ship.y += stepY * ratio;
                } else {
                    ship.x += stepX;
                    ship.y += stepY;
                }

                ship.angle = Math.max(-0.35, Math.min(0.35, dy * 0.02));
            } else {
                ship.angle *= 0.88;
            }

            ship.x = Math.max(ship.width / 2, Math.min(arena.width - ship.width / 2, ship.x));
            ship.y = Math.max(ship.height / 2, Math.min(arena.height - ship.height / 2, ship.y));

            if (ship.recoil > 0) { ship.recoil *= 0.87; if (ship.recoil < 0.1) ship.recoil = 0; }
            if (ship.glow > 0) { ship.glow *= 0.93; if (ship.glow < 0.01) ship.glow = 0; }
            if (ship.shake > 0) { ship.shake *= 0.8; if (ship.shake < 0.1) ship.shake = 0; }

            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                b.x += b.vx * dt;
                b.y += b.vy * dt;
                b.life -= dt;

                let hit = false;
                for (let j = enemies.length - 1; j >= 0; j--) {
                    const e = enemies[j];
                    const dx = b.x - e.x;
                    const dy = b.y - e.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    const cs = e.isBoss ? (e.width || e.size) * 0.35 : e.size * 0.4;

                    if (dist < cs) {
                        e.hp--;
                        e.hitFlash = 6;

                        for (let k = 0; k < 4; k++) {
                            const angle = Math.random() * Math.PI * 2;
                            const speed = 3 + Math.random() * 4;
                            explosions.push({ x: e.x, y: e.y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, life: 12, maxLife: 20, size: 1.5 + Math.random() * 2, color: e.isBoss ? '#ff8800' : '#26a17b' });
                        }

                        if (e.hp <= 0) {
                            if (e.isBoss) {
                                playBossDeathSound();
                                score += BOSS_KILL_POINTS;
                                bossActive = false;
                                scorePopups.push({ x: e.x, y: e.y, text: '+' + BOSS_KILL_POINTS, life: 60, maxLife: 60 });
                                for (let k = 0; k < 30; k++) {
                                    const angle = Math.random() * Math.PI * 2;
                                    const speed = 4 + Math.random() * 10;
                                    explosions.push({ x: e.x, y: e.y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, life: 20 + Math.random() * 15, maxLife: 35, size: 3 + Math.random() * 3, color: '#0a3d1a' });
                                }
                                spawnSoldiersFromBoss(e.x, e.y);
                            } else {
                                score += KILL_POINTS;
                                scorePopups.push({ x: e.x, y: e.y, text: '+1', life: 45, maxLife: 45 });
                                for (let k = 0; k < 10; k++) {
                                    const angle = Math.random() * Math.PI * 2;
                                    const speed = 3 + Math.random() * 6;
                                    explosions.push({ x: e.x, y: e.y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, life: 15, maxLife: 25, size: 2 + Math.random() * 2.5, color: '#26a17b' });
                                }
                            }
                            enemies.splice(j, 1);
                            if (!e.isBoss && score > 0 && score % (ENEMIES_PER_BOSS) === 0 && !bossActive) spawnBoss();
                            if (score > bestScore) {
                                bestScore = score;
                                localStorage.setItem('spaceHighScore', score);
                            }
                        }
                        hit = true;
                        break;
                    }
                }

                if (hit || b.x > arena.width + 50 || b.life <= 0) bullets.splice(i, 1);
            }

            for (let i = enemyBullets.length - 1; i >= 0; i--) {
                const eb = enemyBullets[i];
                eb.x += eb.vx * dt;
                eb.y += eb.vy * dt;
                eb.life -= dt;

                const dx = eb.x - ship.x;
                const dy = eb.y - ship.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < ship.width * 0.35 && shipHP.invulnerable <= 0) {
                    shipHP.current -= (eb.isBossBullet ? 10 : 5);
                    shipHP.hitFlash = 12;
                    shipHP.invulnerable = 30;
                    for (let k = 0; k < 8; k++) {
                        const angle = Math.random() * Math.PI * 2;
                        const speed = 3 + Math.random() * 4;
                        explosions.push({ x: ship.x, y: ship.y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, life: 12, maxLife: 20, size: 1.5 + Math.random() * 2, color: '#ff3333' });
                    }
                    enemyBullets.splice(i, 1);
                    continue;
                }

                if (eb.x < -50 || eb.x > arena.width + 50 || eb.life <= 0) enemyBullets.splice(i, 1);
            }

            for (let i = powerOrbs.length - 1; i >= 0; i--) {
                const o = powerOrbs[i];
                o.x += o.vx * dt;
                o.y += o.vy * dt;
                o.life -= dt;
                if (o.radius < o.maxRadius) o.radius += o.growth * dt;

                for (let j = enemies.length - 1; j >= 0; j--) {
                    const e = enemies[j];
                    const dx = o.x - e.x;
                    const dy = o.y - e.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < e.size * 0.5 + o.radius * 0.5) {
                        e.hp -= 3;
                        e.hitFlash = 10;
                        if (e.hp <= 0) {
                            if (e.isBoss) {
                                playBossDeathSound();
                                score += BOSS_KILL_POINTS;
                                bossActive = false;
                                scorePopups.push({ x: e.x, y: e.y, text: '+' + BOSS_KILL_POINTS, life: 60, maxLife: 60 });
                                for (let k = 0; k < 30; k++) {
                                    const angle = Math.random() * Math.PI * 2;
                                    const speed = 4 + Math.random() * 10;
                                    explosions.push({ x: e.x, y: e.y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, life: 20 + Math.random() * 15, maxLife: 35, size: 3 + Math.random() * 3, color: '#0a3d1a' });
                                }
                                spawnSoldiersFromBoss(e.x, e.y);
                            } else {
                                score += KILL_POINTS;
                                scorePopups.push({ x: e.x, y: e.y, text: '+1', life: 45, maxLife: 45 });
                                for (let k = 0; k < 14; k++) {
                                    const angle = Math.random() * Math.PI * 2;
                                    const speed = 4 + Math.random() * 8;
                                    explosions.push({ x: e.x, y: e.y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, life: 15, maxLife: 25, size: 2 + Math.random() * 2.5, color: '#26a17b' });
                                }
                            }
                            enemies.splice(j, 1);
                            if (!e.isBoss && score > 0 && score % ENEMIES_PER_BOSS === 0 && !bossActive) spawnBoss();
                            if (score > bestScore) {
                                bestScore = score;
                                localStorage.setItem('spaceHighScore', score);
                            }
                        }
                    }
                }

                if (o.x > arena.width + 80 || o.life <= 0) powerOrbs.splice(i, 1);
            }

            for (let i = enemies.length - 1; i >= 0; i--) {
                const e = enemies[i];
                if (e.hitFlash > 0) e.hitFlash -= dt;

                if (e.isBoss) {
                    if (e.recoil && e.recoil > 0) { e.recoil *= 0.85; if (e.recoil < 0.5) e.recoil = 0; }
                    if (!e.stopped) {
                        e.x -= e.speed * dt;
                        if (e.x <= e.stopX) { e.x = e.stopX; e.stopped = true; }
                    } else {
                        e.moveTimer += (0.03 + level * 0.005) * dt;
                        e.y = e.baseY + Math.sin(e.moveTimer) * (arena.height * 0.3);
                        e.x = e.stopX + (e.recoil > 0 ? e.recoil : 0);
                    }
                    e.shootTimer -= dt;
                    if (e.shootTimer <= 0 && e.stopped) { bossFire(e); e.shootTimer = e.shootCooldown; }
                } else {
                    if (e.spreadTimer && e.spreadTimer > 0) {
                        e.x += e.vx * dt; e.y += e.vy * dt;
                        e.vx *= 0.94; e.vy *= 0.94;
                        e.spreadTimer -= dt;
                    }
                    e.x -= e.speed * dt;
                    if (e.x < arena.width * 0.95 && e.x > 30) {
                        e.shootTimer -= dt;
                        if (e.shootTimer <= 0) { enemyFire(e); e.shootTimer = e.shootCooldown; }
                    }
                }

                if (e.x < -100) enemies.splice(i, 1);
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx * dt; p.y += p.vy * dt;
                p.vx *= 0.92; p.vy *= 0.92;
                p.life -= dt;
                if (p.life <= 0) particles.splice(i, 1);
            }

            for (let i = explosions.length - 1; i >= 0; i--) {
                const ex = explosions[i];
                ex.x += ex.vx * dt; ex.y += ex.vy * dt;
                ex.vx *= 0.95; ex.vy *= 0.95;
                ex.life -= dt;
                if (ex.life <= 0) explosions.splice(i, 1);
            }

            if (shipHP.current <= 0) {
                shipHP.current = 0;
                gameState = 'gameover';
                gameOverTime = Date.now();
            }
        }

        /* ============================================
           الرسم — الخلفيات المتغيرة حسب المستوى
        ============================================ */
        function drawBackground() {
            const bg = BACKGROUNDS[Math.min(level - 1, BACKGROUNDS.length - 1)];
            const grad = ctx.createLinearGradient(0, 0, viewWidth, viewHeight);
            grad.addColorStop(0, bg.colors[0]);
            grad.addColorStop(0.5, bg.colors[1]);
            grad.addColorStop(1, bg.colors[2]);
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, viewWidth, viewHeight);

            // سديم متحرك
            const t = gameTime * 0.002;
            const nebX = viewWidth * (0.5 + Math.sin(t) * 0.3);
            const nebY = viewHeight * (0.5 + Math.cos(t * 1.3) * 0.3);
            const nebGrad = ctx.createRadialGradient(nebX, nebY, 0, nebX, nebY, viewWidth * 0.7);
            nebGrad.addColorStop(0, bg.nebula);
            nebGrad.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = nebGrad;
            ctx.fillRect(0, 0, viewWidth, viewHeight);

            // دخان
            smokeParticles.forEach(p => {
                const alpha = (p.life / p.maxLife) * p.alpha;
                const grad2 = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size);
                grad2.addColorStop(0, `rgba(120, 120, 160, ${alpha})`);
                grad2.addColorStop(1, 'rgba(0, 0, 0, 0)');
                ctx.fillStyle = grad2;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });

            // نجوم
            ctx.globalAlpha = 1;
            ctx.fillStyle = bg.stars;
            stars.forEach(s => {
                ctx.globalAlpha = s.alpha;
                ctx.fillRect(s.x, s.y, s.size, s.size);
            });
            ctx.globalAlpha = 1;
        }

        function drawGame() {
            const data = SHIPS_DATA[selectedShipIndex];
            drawBackground();

            ctx.save();
            ctx.beginPath();
            ctx.rect(0, 0, viewWidth, viewHeight);
            ctx.clip();

            muzzleFades.forEach(f => {
                const progress = f.life / f.maxLife;
                ctx.save();
                const grad = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.radius);
                grad.addColorStop(0, f.coreColor);
                grad.addColorStop(0.4, f.color);
                grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
                ctx.fillStyle = grad;
                ctx.globalAlpha = progress;
                ctx.beginPath();
                ctx.arc(f.x, f.y, f.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });

            enemies.forEach(e => {
                let img, isLoaded;
                if (e.isBoss) { img = bossImg; isLoaded = bossLoaded; }
                else { img = enemyImg; isLoaded = enemyLoaded; }
                if (!isLoaded) return;

                ctx.save();
                ctx.translate(e.x, e.y);
                if (e.isBoss) {
                    ctx.shadowBlur = 15 + Math.sin(gameTime * 0.1) * 8;
                    ctx.shadowColor = '#ff3333';
                } else {
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = '#0a3d1a';
                }
                if (e.hitFlash > 0) ctx.globalAlpha = 0.7;
                ctx.drawImage(img, -e.width / 2, -e.height / 2, e.width, e.height);
                ctx.restore();

                if (e.isBoss) {
                    const barW = e.width * 0.9;
                    const barH = 5;
                    const barX = e.x - barW / 2;
                    const barY = e.y - e.height / 2 - 12;
                    ctx.save();
                    ctx.fillStyle = 'rgba(0,0,0,0.7)';
                    ctx.fillRect(barX, barY, barW, barH);
                    ctx.fillStyle = '#ff3333';
                    ctx.fillRect(barX, barY, barW * (e.hp / e.maxHp), barH);
                    ctx.restore();
                }
            });

            ctx.save();
            enemyBullets.forEach(eb => {
                const alpha = eb.life / eb.maxLife;
                ctx.globalAlpha = alpha;
                ctx.fillStyle = eb.isBossBullet ? '#ff3333' : '#ff8800';
                ctx.fillRect(eb.x - eb.width / 2, eb.y - eb.height / 2, eb.width, eb.height);
                ctx.globalAlpha = alpha * 0.4;
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(eb.x - eb.width / 4, eb.y - 1, eb.width / 2, 2);
            });
            ctx.restore();

            ctx.save();
            explosions.forEach(ex => {
                ctx.globalAlpha = ex.life / ex.maxLife;
                ctx.fillStyle = ex.color;
                ctx.fillRect(ex.x - ex.size, ex.y - ex.size, ex.size * 2, ex.size * 2);
            });
            ctx.restore();

            ctx.save();
            particles.forEach(p => {
                ctx.globalAlpha = p.life / p.maxLife;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x - p.size, p.y - p.size, p.size * 2, p.size * 2);
            });
            ctx.restore();

            ctx.save();
            bullets.forEach(b => {
                ctx.globalAlpha = b.life / b.maxLife;
                ctx.fillStyle = data.coreColor;
                if (b.type === 'triangle') {
                    ctx.beginPath();
                    ctx.moveTo(b.x + b.size, b.y);
                    ctx.lineTo(b.x - b.size, b.y - b.size);
                    ctx.lineTo(b.x - b.size, b.y + b.size);
                    ctx.closePath();
                    ctx.fill();
                } else {
                    ctx.fillRect(b.x - b.width / 2, b.y - b.height / 2, b.width, b.height);
                }
            });
            ctx.restore();

            ctx.save();
            powerOrbs.forEach(o => {
                ctx.globalAlpha = o.life / o.maxLife;
                const grad = ctx.createRadialGradient(o.x, o.y, 0, o.x, o.y, o.radius);
                grad.addColorStop(0, '#ffffff');
                grad.addColorStop(1, data.coreColor);
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(o.x, o.y, o.radius, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.restore();

            // نقاط طائرة
            ctx.save();
            scorePopups.forEach(sp => {
                const alpha = sp.life / sp.maxLife;
                ctx.globalAlpha = alpha;
                ctx.fillStyle = '#26a17b';
                ctx.font = 'bold 20px Cairo, sans-serif';
                ctx.textAlign = 'center';
                ctx.shadowBlur = 12;
                ctx.shadowColor = '#26a17b';
                ctx.fillText(sp.text, sp.x, sp.y);
            });
            ctx.restore();

            // المركبة
            ctx.save();
            const shakeX = (Math.random() - 0.5) * ship.shake;
            const shakeY = (Math.random() - 0.5) * ship.shake;
            const dx = ship.x - ship.recoil + shakeX;
            const dy = ship.y + shakeY;

            if (imageLoaded) {
                ctx.translate(dx, dy);
                ctx.rotate(ship.angle);
                ctx.shadowBlur = 10 + ship.glow * 20;
                ctx.shadowColor = data.glowColor;

                if (shipHP.invulnerable > 0 && Math.floor(shipHP.invulnerable / 4) % 2 === 0) {
                    ctx.globalAlpha = 0.5;
                }

                ctx.drawImage(shipImg, -ship.width / 2, -ship.height / 2, ship.width, ship.height);
            }
            ctx.restore();

            ctx.restore();

            drawHUD();
        }

        function drawHUD() {
            const centerX = viewWidth / 2;
            const padding = 10;

            // النقاط
            const scoreFontSize = Math.min(viewWidth * 0.035, 20);
            const scoreText = displayedScore.toString();

            ctx.save();
            ctx.font = `bold ${scoreFontSize}px 'Courier New', monospace`;
            const metrics = ctx.measureText(scoreText);
            const boxW = Math.max(metrics.width + 60, 100);
            const boxH = scoreFontSize * 1.7;
            const boxX = centerX - boxW / 2;
            const boxY = padding;

            ctx.fillStyle = 'rgba(0, 20, 15, 0.85)';
            ctx.fillRect(boxX, boxY, boxW, boxH);
            ctx.strokeStyle = '#26a17b';
            ctx.lineWidth = 1.5;
            ctx.strokeRect(boxX, boxY, boxW, boxH);

            ctx.fillStyle = '#26a17b';
            ctx.beginPath();
            ctx.arc(boxX + 15, boxY + boxH / 2, 7, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 10px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('★', boxX + 15, boxY + boxH / 2 + 1);

            ctx.textAlign = 'left';
            ctx.fillStyle = '#26a17b';
            ctx.font = `bold ${scoreFontSize}px 'Courier New', monospace`;
            ctx.fillText(scoreText, boxX + 28, boxY + boxH / 2);
            ctx.restore();

            // المستوى
            ctx.save();
            ctx.font = `bold 12px Cairo, sans-serif`;
            ctx.fillStyle = '#f39c12';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(`المستوى ${level}`, centerX, boxY + boxH + 14);
            ctx.restore();

            // شريط الصحة
            const hpBarW = Math.min(viewWidth * 0.38, 160);
            const hpBarH = 5;
            const hpBarX = centerX - hpBarW / 2;
            const hpBarY = boxY + boxH + 26;

            ctx.save();
            ctx.fillStyle = 'rgba(40, 0, 0, 0.7)';
            ctx.fillRect(hpBarX, hpBarY, hpBarW, hpBarH);

            const hpRatio = shipHP.current / shipHP.max;
            let hpColor = '#00ff44';
            if (hpRatio < 0.6) hpColor = '#ffcc00';
            if (hpRatio < 0.3) hpColor = '#ff3333';

            ctx.fillStyle = hpColor;
            ctx.fillRect(hpBarX, hpBarY, hpBarW * hpRatio, hpBarH);
            ctx.restore();

            // أفضل نتيجة
            ctx.save();
            ctx.font = `bold 10px Cairo, sans-serif`;
            ctx.fillStyle = 'rgba(255,255,255,0.5)';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'top';
            ctx.fillText(`الأفضل: ${bestScore}`, 15, padding);
            ctx.restore();
        }

        function drawGameOver() {
            ctx.save();
            ctx.fillStyle = 'rgba(0,0,0,0.7)';
            ctx.fillRect(0, 0, viewWidth, viewHeight);

            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            // العنوان
            ctx.font = `bold ${Math.min(viewWidth * 0.08, 42)}px Cairo, sans-serif`;
            ctx.fillStyle = '#ff3333';
            ctx.shadowBlur = 25;
            ctx.shadowColor = '#ff3333';
            ctx.fillText('انتهت اللعبة', viewWidth / 2, viewHeight * 0.28);

            // النقاط
            ctx.font = `bold ${Math.min(viewWidth * 0.05, 26)}px Cairo, sans-serif`;
            ctx.fillStyle = '#ffffff';
            ctx.shadowColor = '#26a17b';
            ctx.shadowBlur = 15;
            ctx.fillText('النقاط', viewWidth / 2, viewHeight * 0.42);

            ctx.font = `bold ${Math.min(viewWidth * 0.12, 65)}px 'Courier New', monospace`;
            ctx.fillStyle = '#26a17b';
            ctx.shadowColor = '#26a17b';
            ctx.shadowBlur = 30;
            ctx.fillText(score.toString(), viewWidth / 2, viewHeight * 0.53);

            // أفضل نتيجة
            if (score >= bestScore && score > 0) {
                ctx.font = `bold ${Math.min(viewWidth * 0.045, 20)}px Cairo, sans-serif`;
                ctx.fillStyle = '#f39c12';
                ctx.shadowColor = '#f39c12';
                ctx.shadowBlur = 20;
                ctx.fillText('🎉 رقم قياسي جديد!', viewWidth / 2, viewHeight * 0.63);
            } else {
                ctx.font = `bold ${Math.min(viewWidth * 0.04, 16)}px Cairo, sans-serif`;
                ctx.fillStyle = 'rgba(255,255,255,0.6)';
                ctx.shadowBlur = 0;
                ctx.fillText(`الأفضل: ${bestScore}`, viewWidth / 2, viewHeight * 0.63);
            }

            // زر إعادة المحاولة
            const btnW = Math.min(viewWidth * 0.5, 240);
            const btnH = Math.min(viewHeight * 0.09, 55);
            const btnX = viewWidth / 2 - btnW / 2;
            const btnY = viewHeight * 0.75;

            ctx.shadowBlur = 25;
            ctx.shadowColor = '#6a11cb';
            const btnGrad = ctx.createLinearGradient(btnX, btnY, btnX + btnW, btnY + btnH);
            btnGrad.addColorStop(0, '#6a11cb');
            btnGrad.addColorStop(1, '#2575fc');
            ctx.fillStyle = btnGrad;
            ctx.beginPath();
            ctx.roundRect(btnX, btnY, btnW, btnH, btnH / 2);
            ctx.fill();

            ctx.shadowBlur = 0;
            ctx.fillStyle = '#ffffff';
            ctx.font = `bold ${Math.min(btnH * 0.42, 20)}px Cairo, sans-serif`;
            ctx.fillText('العب مرة أخرى', viewWidth / 2, btnY + btnH / 2);

            ctx.restore();
        }

        function drawSelectScreen() {
            drawBackground();

            const centerX = selectLeftX + selectShipSize / 2;
            const centerY = selectCenterY;

            for (let i = 0; i < 6; i++) {
                const d = SHIPS_DATA[i];
                const screenY = centerY + (i * shipSpacing) + scrollY;
                if (screenY < -selectShipSize || screenY > viewHeight + selectShipSize) continue;

                const isSel = (i === selectedShipIndex);
                const fadeAlpha = Math.max(0.1, 0.4 - (Math.abs(screenY - centerY) / (viewHeight * 0.5)) * 0.3);

                if (d.loaded) {
                    const aspect = d.preview.width / d.preview.height;
                    const drawW = selectShipSize;
                    const drawH = drawW / aspect;
                    ctx.globalAlpha = isSel ? 1 : fadeAlpha;
                    ctx.drawImage(d.preview, centerX - drawW / 2, screenY - drawH / 2, drawW, drawH);
                }
            }
            ctx.globalAlpha = 1;

            const btn = startButton;
            ctx.save();
            ctx.fillStyle = SHIPS_DATA[selectedShipIndex].coreColor;
            ctx.font = `bold ${Math.min(btn.height * 0.75, 50)}px Arial, sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowBlur = 20;
            ctx.shadowColor = SHIPS_DATA[selectedShipIndex].coreColor;
            ctx.fillText('START', btn.x + btn.width / 2, btn.y + btn.height / 2 + 2);
            ctx.restore();
        }

        function draw() {
            if (gameState === 'select') drawSelectScreen();
            else if (gameState === 'playing') drawGame();
            else if (gameState === 'gameover') {
                drawGame();
                drawGameOver();
            }
        }

        function gameLoop(now) {
            update(now);
            draw();
            requestAnimationFrame(gameLoop);
        }

        function initStars() {
            stars.length = 0;
            for (let i = 0; i < 60; i++) {
                stars.push({
                    x: Math.random() * viewWidth,
                    y: Math.random() * viewHeight,
                    size: Math.random() * 1.2 + 0.5,
                    speed: Math.random() * 0.5 + 0.3,
                    alpha: Math.random() * 0.5 + 0.3
                });
            }
            smokeParticles.length = 0;
        }

        function init() {
            resizeCanvas();
            initStars();
            requestAnimationFrame(gameLoop);
        }

        init();
        setTimeout(resizeCanvas, 200);
    </script>
</body>
</html>
