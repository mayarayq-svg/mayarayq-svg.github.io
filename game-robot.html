<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a15">
  <title>لعبة الروبوت — قيد التطوير | PAID PLUS</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Cairo', sans-serif;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      min-height: 100vh;
      overflow-x: hidden;
      background: #050510;
      color: #fff;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(106,17,203,0.35), transparent),
        radial-gradient(ellipse 60% 40% at 100% 100%, rgba(37,117,252,0.25), transparent),
        radial-gradient(ellipse 60% 40% at 0% 100%, rgba(46,204,113,0.15), transparent),
        #050510;
      z-index: 0;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(106,17,203,0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(106,17,203,0.05) 1px, transparent 1px);
      background-size: 50px 50px;
      z-index: 0;
      pointer-events: none;
      animation: gridMove 25s linear infinite;
    }

    @keyframes gridMove {
      from { background-position: 0 0; }
      to { background-position: 50px 50px; }
    }

    body > * { position: relative; z-index: 1; }

    .container {
      max-width: 500px;
      margin: 0 auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-height: 100vh;
      justify-content: flex-start;
    }

    /* ====== الهيدر ====== */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
      border-radius: 18px;
      box-shadow:
        0 10px 40px rgba(106,17,203,0.5),
        0 0 0 1px rgba(255,255,255,0.1),
        inset 0 1px 0 rgba(255,255,255,0.2);
      position: relative;
      overflow: hidden;
    }

    .header::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
      animation: shine 4s infinite;
    }

    @keyframes shine {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    .logo {
      font-size: 17px;
      font-weight: 900;
      letter-spacing: 2px;
      position: relative;
      z-index: 2;
      text-shadow: 0 2px 10px rgba(0,0,0,0.3);
    }

    .back-btn {
      color: #fff;
      text-decoration: none;
      font-size: 12px;
      font-weight: 800;
      padding: 8px 15px;
      background: rgba(255,255,255,0.2);
      border-radius: 20px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.25);
      position: relative;
      z-index: 2;
      transition: 0.25s;
    }
    .back-btn:active { transform: scale(0.94); background: rgba(255,255,255,0.3); }

    /* ====== بطاقة قيد التطوير ====== */
    .dev-card {
      background:
        radial-gradient(circle at 50% 0%, rgba(106,17,203,0.35), transparent 60%),
        linear-gradient(180deg, rgba(26,26,46,0.95), rgba(10,10,20,0.98));
      border-radius: 26px;
      padding: 40px 24px 32px;
      border: 1px solid rgba(106,17,203,0.45);
      box-shadow:
        0 25px 70px rgba(106,17,203,0.35),
        0 0 0 1px rgba(255,255,255,0.05),
        inset 0 1px 0 rgba(255,255,255,0.08);
      text-align: center;
      position: relative;
      overflow: hidden;
      margin-top: 10px;
      animation: cardIn 0.7s cubic-bezier(0.4, 0, 0.2, 1);
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(30px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .dev-card::before {
      content: '';
      position: absolute;
      top: -120px; left: -120px;
      width: 340px; height: 340px;
      background: radial-gradient(circle, rgba(106,17,203,0.25), transparent 70%);
      border-radius: 50%;
      animation: floatBg 6s ease-in-out infinite;
      pointer-events: none;
    }

    .dev-card::after {
      content: '';
      position: absolute;
      bottom: -100px; right: -100px;
      width: 280px; height: 280px;
      background: radial-gradient(circle, rgba(37,117,252,0.2), transparent 70%);
      border-radius: 50%;
      animation: floatBg 8s ease-in-out infinite reverse;
      pointer-events: none;
    }

    @keyframes floatBg {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(30px, 30px); }
    }

    /* ====== صورة الروبوت ====== */
    .robot-wrap {
      position: relative;
      width: 170px;
      height: 170px;
      margin: 0 auto 24px;
      z-index: 2;
      animation: robotFloat 3s ease-in-out infinite;
    }

    @keyframes robotFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-14px); }
    }

    .robot-glow {
      position: absolute;
      inset: -25px;
      background: radial-gradient(circle, rgba(106,17,203,0.55), transparent 65%);
      border-radius: 50%;
      animation: glowPulse 2.5s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes glowPulse {
      0%, 100% { transform: scale(1); opacity: 0.7; }
      50% { transform: scale(1.15); opacity: 1; }
    }

    .robot-ring {
      position: absolute;
      inset: -12px;
      border: 2px dashed rgba(106,17,203,0.6);
      border-radius: 50%;
      animation: ringSpin 12s linear infinite;
      pointer-events: none;
    }

    .robot-ring-2 {
      position: absolute;
      inset: -22px;
      border: 1px solid rgba(37,117,252,0.4);
      border-radius: 50%;
      animation: ringSpin 18s linear infinite reverse;
      pointer-events: none;
    }

    @keyframes ringSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .robot-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      position: relative;
      z-index: 2;
      filter: drop-shadow(0 15px 35px rgba(106,17,203,0.7));
      animation: robotTilt 4s ease-in-out infinite;
    }

    @keyframes robotTilt {
      0%, 100% { transform: rotate(-3deg); }
      50% { transform: rotate(3deg); }
    }

    /* ====== النصوص ====== */
    .dev-title {
      font-size: 26px;
      font-weight: 900;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #6a11cb, #2575fc, #2ecc71);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      position: relative;
      z-index: 2;
      letter-spacing: 0.5px;
    }

    .dev-subtitle {
      font-size: 13px;
      color: #a0a0b0;
      line-height: 1.9;
      margin-bottom: 22px;
      position: relative;
      z-index: 2;
      max-width: 340px;
      margin-left: auto;
      margin-right: auto;
    }

    .dev-subtitle b {
      color: #fff;
      font-weight: 800;
    }

    /* ====== شريط التحميل ====== */
    .loading-bar {
      width: 100%;
      max-width: 280px;
      height: 8px;
      background: rgba(255,255,255,0.08);
      border-radius: 10px;
      overflow: hidden;
      margin: 0 auto 12px;
      position: relative;
      z-index: 2;
    }

    .loading-fill {
      height: 100%;
      width: 30%;
      background: linear-gradient(90deg, #6a11cb, #2575fc, #2ecc71);
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(106,17,203,0.9);
      animation: loadingSlide 2.2s ease-in-out infinite;
      position: relative;
    }

    .loading-fill::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
      animation: shineProgress 1.5s infinite;
    }

    @keyframes loadingSlide {
      0% { margin-left: 0; width: 20%; }
      50% { margin-left: 40%; width: 45%; }
      100% { margin-left: 80%; width: 20%; }
    }

    @keyframes shineProgress {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    .loading-text {
      font-size: 12px;
      color: #a0a0b0;
      font-weight: 700;
      position: relative;
      z-index: 2;
      margin-bottom: 26px;
      letter-spacing: 0.5px;
    }

    .loading-text .dot {
      display: inline-block;
      animation: dotBlink 1.4s infinite;
    }
    .loading-text .dot:nth-child(2) { animation-delay: 0.2s; }
    .loading-text .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes dotBlink {
      0%, 60%, 100% { opacity: 0.3; }
      30% { opacity: 1; }
    }

    /* ====== أزرار ====== */
    .actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      position: relative;
      z-index: 2;
    }

    .action-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 13px 26px;
      border-radius: 30px;
      font-family: 'Cairo', sans-serif;
      font-size: 13px;
      font-weight: 900;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: 0.3s;
      position: relative;
      overflow: hidden;
    }

    .action-btn.primary {
      background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
      color: #fff;
      box-shadow: 0 12px 30px rgba(106,17,203,0.5), inset 0 1px 0 rgba(255,255,255,0.2);
    }

    .action-btn.primary::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      transform: translateX(-100%);
      transition: 0.6s;
    }

    .action-btn.primary:hover::before { transform: translateX(100%); }

    .action-btn.secondary {
      background: rgba(255,255,255,0.06);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.15);
      backdrop-filter: blur(10px);
    }

    .action-btn:active { transform: scale(0.95); }

    .action-btn svg { width: 16px; height: 16px; }

    /* ====== بطاقة معلومات ====== */
    .info-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 4px;
    }

    .info-box {
      background: linear-gradient(135deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 14px 8px;
      text-align: center;
      position: relative;
      overflow: hidden;
      transition: 0.3s;
    }

    .info-box::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, currentColor, transparent);
      opacity: 0.6;
    }

    .info-box.green { color: #2ecc71; }
    .info-box.blue { color: #3498db; }
    .info-box.gold { color: #f39c12; }

    .info-icon {
      font-size: 22px;
      margin-bottom: 6px;
      display: block;
    }

    .info-label {
      font-size: 10px;
      color: #a0a0b0;
      font-weight: 700;
      letter-spacing: 0.5px;
      display: block;
      margin-bottom: 3px;
    }

    .info-value {
      font-size: 13px;
      font-weight: 900;
      color: currentColor;
      text-shadow: 0 0 12px currentColor;
    }

    /* ====== وسوم الميزات ====== */
    .features {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 6px;
    }

    .feature-tag {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 7px 14px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 800;
      background: rgba(106,17,203,0.12);
      border: 1px solid rgba(106,17,203,0.3);
      color: #b794f6;
      transition: 0.3s;
    }

    .feature-tag:hover {
      background: rgba(106,17,203,0.22);
      transform: translateY(-2px);
    }

    .feature-tag .emoji { font-size: 13px; }

    /* ====== الجوال ====== */
    @media (max-width: 400px) {
      .container { padding: 10px; gap: 12px; }
      .dev-card { padding: 32px 18px 26px; border-radius: 22px; }
      .robot-wrap { width: 140px; height: 140px; margin-bottom: 20px; }
      .dev-title { font-size: 22px; }
      .dev-subtitle { font-size: 12px; }
      .action-btn { padding: 12px 22px; font-size: 12px; }
      .info-value { font-size: 12px; }
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- الهيدر -->
    <div class="header">
      <span class="logo">PAID PLUS</span>
      <a href="games.html" class="back-btn">← الألعاب</a>
    </div>

    <!-- بطاقة قيد التطوير -->
    <div class="dev-card">

      <div class="robot-wrap">
        <div class="robot-glow"></div>
        <div class="robot-ring"></div>
        <div class="robot-ring-2"></div>
        <img src="RO.png" alt="الروبوت" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤖</text></svg>'">
      </div>

      <div class="dev-title">قيد التطوير</div>
      <div class="dev-subtitle">
        نعمل حالياً على <b>لعبة الروبوت</b> بجهد كبير<br>
        لتقديم تجربة لعب ممتعة واحترافية
      </div>

      <div class="loading-bar">
        <div class="loading-fill"></div>
      </div>
      <div class="loading-text">
        جارٍ العمل
        <span class="dot">.</span><span class="dot">.</span><span class="dot">.</span>
      </div>

      <div class="actions">
        <a href="games.html" class="action-btn primary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"/>
            <polyline points="12 19 5 12 12 5"/>
          </svg>
          العودة للألعاب
        </a>
      </div>

    </div>

    <!-- معلومات إضافية -->
    <div class="info-grid">
      <div class="info-box green">
        <span class="info-icon">🚀</span>
        <span class="info-label">الحالة</span>
        <span class="info-value">قريباً</span>
      </div>
      <div class="info-box blue">
        <span class="info-icon">⚙️</span>
        <span class="info-label">التحديث</span>
        <span class="info-value">جاري</span>
      </div>
      <div class="info-box gold">
        <span class="info-icon">🎮</span>
        <span class="info-label">النوع</span>
        <span class="info-value">مغامرة</span>
      </div>
    </div>

    <!-- وسوم الميزات -->
    <div class="features">
      <span class="feature-tag"><span class="emoji">⚡</span> سريع</span>
      <span class="feature-tag"><span class="emoji">🎯</span> ممتع</span>
      <span class="feature-tag"><span class="emoji">💎</span> حصري</span>
      <span class="feature-tag"><span class="emoji">🔥</span> قريباً</span>
    </div>

  </div>

</body>
</html>
